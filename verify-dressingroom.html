<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dressing room harness</title>
<!-- v21 Stream 5, Task 4: the real controller, styles, stage and a real
     progression on an in-memory save (the mockup's sample save). Nothing is
     written to localStorage. URL params: ?long=1 (room joined, dusk on,
     every pill), ?wardrobe=1, ?more=1, ?nogl=1 (pretend WebGL is missing). -->
<style>
  .harness { max-width: 1000px; margin: 30px auto 60px; padding: 12px 20px; color: #a8c0e0; font: 13px/1.5 sans-serif;
             border-top: 1px dashed #33425e; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .harness button { padding: 8px 12px; border-radius: 8px; border: 1px solid #5b6c88; background: #2c3d58; color: #fff; }
  .harness output { flex: 1 0 100%; color: #f2c14e; }
</style>
</head>
<body>
<div id="homebase"><div id="root"></div>
  <div class="harness">
    <b>Harness:</b>
    <button id="h-normal">Sample state</button>
    <button id="h-long">Long state (room, dusk, every chip)</button>
    <button id="h-points">+100 points</button>
    <output id="h-out">—</output>
  </div>
</div>
<script type="module">
  import '/src/style.css';
  import { CATALOG, createProgression, rankFor } from '/src/progression.js';
  import { SKILLS } from '/src/skills.js';
  import { buildCat } from '/src/cat/model.js';
  import { menuThumbnails } from '/src/thumbnails.js';
  import { createCatStage } from '/src/ui/catstage.js';
  import { renderStartButtonHtml } from '/src/ui/colonypanel.js';
  import { createDressingRoom } from '/src/ui/dressingroomview.js';

  const params = new URLSearchParams(location.search);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (id) => document.getElementById(id);
  const out = (msg) => { $('h-out').textContent = msg; };

  // ---- an in-memory save seeded with the mockup's sample ----
  function memoryStorage() {
    const m = new Map();
    return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) };
  }
  function seeded(long) {
    const blank = JSON.parse(JSON.stringify(createProgression(memoryStorage()).state));
    Object.assign(blank, {
      points: 85, lifetimePoints: 230, bestWalk: 42,
      streak: { last: new Date().toISOString().slice(0, 10), count: 3 },
      skills: SKILLS.slice(0, 2).map((s) => s.id),
      area: 'park', walks: { ...blank.walks, neighborhood: 5, park: 1 },
    });
    blank.unlocked = { cats: ['tabby', 'black', 'calico', 'zeetoo'], accessories: ['bell', 'bandana', 'glow', 'crown', 'glasses'], areas: ['neighborhood', 'park'] };
    blank.equipped = { cat: 'calico', collar: 'glow', head: null, face: null, neck: 'bandana', body: null, back: null, feet: null };
    if (long) {
      blank.race = { date: new Date().toISOString().slice(0, 10), area: 'park', bestMs: 41234 };
      blank.kitten = { stage: 3 };
    }
    const store = memoryStorage();
    store.setItem('whisker-walk-save', JSON.stringify(blank));
    return createProgression(store);
  }

  let long = params.get('long') === '1';
  let progression = seeded(long);
  const thumbs = menuThumbnails();
  const stage = params.get('nogl') === '1'
    ? createCatStage({ buildCat, thumbs, createRenderer: () => { throw new Error('no WebGL (harness)'); } })
    : createCatStage({ buildCat, thumbs });
  let dressing = null;

  // ---- the owner's pieces (homebase renders these in Task 5) ----
  function headerHtml(s) {
    const rank = rankFor(s.lifetimePoints);
    return `<h1 class="dr-title">🐾 Whisker Walk 2 <span class="dr-edition">Clan Edition</span></h1>`
      + `<div class="hb-pill hb-points">🐾 ${s.points}</div><div class="hb-pill hb-rank">🏆 ${esc(rank.title)}</div>`
      + `<div class="hb-pill dr-visit">🐾 Visit 12</div>`
      + '<button class="hb-menu-btn" data-dr-sheet="menu" aria-label="Menu">☰<span class="hb-menu-word"> Menu</span></button>';
  }
  const room = () => (long ? { code: 'ABCD', starting: false } : null);
  function startHtml() {
    return `<div class="dr-start-row"><button id="btn-play-together" class="dr-together" aria-label="Play together"><span aria-hidden="true">👫</span><span class="dr-together-words" aria-hidden="true">Play together</span></button>${renderStartButtonHtml(room())}</div>`;
  }
  function extrasHtml(s) {
    const glowReady = s.equipped.collar === 'glow';
    return glowReady ? `<label class="dusk"><input type="checkbox" id="dusk-toggle" ${long ? 'checked' : ''} /> Dusk walk ✨</label>` : '';
  }

  function render() {
    const s = progression.state;
    const root = $('root');
    root.innerHTML = dressing.html({ headerHtml: headerHtml(s), startHtml: startHtml(), extrasHtml: extrasHtml(s), rankTitle: rankFor(s.lifetimePoints).title });
    dressing.afterRender(root);
  }
  function build() {
    dressing = createDressingRoom({
      progression, catalog: CATALOG, stage, thumbs,
      sync: { autoSync: () => out('autoSync() called') },
      onChange: render,
      onOpenSheet: (id) => out(`would open the ${id} sheet`),
    });
    render();
  }
  build();
  $('root').addEventListener('click', (e) => {
    if (dressing.handleClick(e)) return;
    if (e.target.closest('#btn-start')) {
      dressing.clearPreview();
      const s = progression.state;
      const acc = ['collar', 'head', 'face', 'neck', 'body', 'back', 'feet'].map((k) => s.equipped[k]).filter(Boolean).join(', ');
      out(`walk would use ${s.equipped.cat} wearing ${acc || 'nothing'} in ${s.area}`);
      render();
    } else if (e.target.closest('#btn-play-together')) out('would open Play together');
  });
  // ?cat=<id> taps that portrait; ?try=<accessory id> opens the wardrobe and its slot and tries it on;
  // ?wardrobe=1 opens the wardrobe; ?more=1 shows the locked cats
  const pick = (sel) => $('root').querySelector(sel)?.click();
  if (params.get('more') === '1') pick('[data-dr-more-cats]');
  if (params.get('wardrobe') === '1' || params.get('try')) pick('[data-dr-wardrobe]');
  if (params.get('cat')) pick(`[data-dr-cat="${CSS.escape(params.get('cat'))}"]`);
  const tryId = params.get('try');
  if (tryId && CATALOG.accessories[tryId]) {
    pick(`[data-dr-slot="${CATALOG.accessories[tryId].slot}"]`);
    pick(`[data-dr-acc="${CSS.escape(tryId)}"][data-dr-act="try"]`);
  }

  $('h-normal').onclick = () => { long = false; progression = seeded(false); build(); out('sample state'); };
  $('h-long').onclick = () => { long = true; progression = seeded(true); build(); out('long state'); };
  $('h-points').onclick = () => { progression.addPoints(100); render(); out('+100 points'); };

  window.harness = { get dressing() { return dressing; }, get progression() { return progression; }, stage, render };
  document.title = 'Dressing room harness';
</script>
</body>
</html>
