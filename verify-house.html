<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old House</title>
<!-- The Old House's picture page (Old House step 1): the house
     (src/world/house.js) drawn through the game's rig, with the real cat and
     the real player, built and run as game/walk.js and main.js do it: the
     contact-shadow scan, then mergeStaticProps, the caster sweep, the house's
     own life (areaData.life: the walls between the camera and her sink, the
     levels are drawn for hers) and the tree fade over every findOccluders and
     findFadeOccluders entry. Per frame, main.js's order: player.update, the
     house life, the tree fade, the shadow fit (then the cat's contact decal).
     For the owner's pictures and films (scripts/record-page.mjs makes them
     headless). No sound at all: the page makes no audio.
     URL params:
       dusk=1               the walk's dusk look: applyDusk (the house's own lamplight
                            duskLight and skyDusk), the lawn tinted, createLampPools
       rm=1                 reduced motion (the player, the sink, the fade, the pose)
       zoom=0..3            the zoom step she starts at (free play; shots and tours set their own)
       sink=0               the "before": the walls never sink (the level drawing still runs)
       tour=grand|film|sink play that tour in real time (HOUSE_TOURS, and this page's own
                            short "sink" tour: a wall going down in front of her and back up),
                            walked by createHousePilot with the stick alone
       drive=1              no rAF loop: window.__frame() drives
       size=WxH             the picture's size (default 960x540)
       bare                 no HUD (a tour's caption still shows)
       resume=x,z,yaw       where the page's "resume" shot picks a walk up (default the attic,
                            -19,-10, looking west), as game/walk.js's resume branch places her
     With no tour she starts at the front door: the arrows or W-A-S-D walk her,
     + / = zoom in and - zooms out (camzoom.js keyZoomDir).
     Window API:
       __ready              true after the first frame
       __shot(name) → name  one of HOUSE_SHOTS (src/world/housetour.js), or this page's own
                            "standins" (from the attic at Farther, back over the far levels'
                            stand-ins): a fresh walk at the shot's spot, facing, and zoom step,
                            settled at once as a walk's start is (game/walk.js), run
                            SETTLE s in fixed 1/30 s steps with her standing, then rendered;
                            or "resume": a walk picked up again, as its "Welcome back!" card
                            shows it (game/walk.js: placed, settled, no frame run)
       __tour(name) → name  starts a tour from its start, for __frame to drive
       __frame() → { done, caption }   one fixed 1/30 s step (the tour's pilot first, if
                            one is running) plus a render
       __snap(q) → a JPEG data URL of the view
       __place(x, z, fx, fz, zoom) → __info()   a shot at any spot (for looking around)
       __info() → { level, full, down, lid, blockers }   her level, the levels drawn in full,
                            the wall sections not standing, the cellar's lid on or off, and
                            the sections (at their present height, and the lid when it is
                            on) between the camera and her look or paws -->
<style>
  html, body { margin: 0; background: #1c2431; overflow: hidden; font: 12px/1.35 Avenir, system-ui, sans-serif; color: #f1e0c2; }
  canvas { position: fixed; left: 0; top: 0; display: block; }
  #hud { position: fixed; left: 0; top: 0; padding: 6px 10px; background: rgba(20, 26, 36, .72); white-space: pre; pointer-events: none; }
  #caption { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; pointer-events: none; }
  #caption span { display: inline-block; padding: 6px 16px; border-radius: 8px; background: rgba(20, 26, 36, .78);
                  color: #fff6e6; font-size: 22px; font-weight: 600; }
  #caption:empty { display: none; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<div id="caption"></div>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier } from '/src/render/textures.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { createContactShadows } from '/src/render/contactshadows.js';
  import { mergeStaticProps } from '/src/render/mergeprops.js';
  import { applyDusk, duskEnv, tintDuskLawn, createLampPools } from '/src/render/dusk.js';
  import { findOccluders } from '/src/fightcam.js';
  import { createTreeFade, findFadeOccluders } from '/src/treefade.js';
  import { buildCat, CAT_LOOK_Y } from '/src/cat/model.js';
  import { animateCat } from '/src/cat/animator.js';
  import { createPlayer } from '/src/player.js';
  import { keyZoomDir, clampZoomStep, zoomView } from '/src/camzoom.js';
  import { cameraOffset } from '/src/catcam.js';
  import { facingYaw, behindYaw } from '/src/traversal.js';
  import { build as buildHouse } from '/src/world/house.js';
  import { HOUSE_SHOTS, HOUSE_TOURS, createHousePilot } from '/src/world/housetour.js';
  import { makeView, lidInLine, blockers as blockersOf } from '/src/housewalls.js';

  const params = new URLSearchParams(location.search);
  const DUSK = params.get('dusk') === '1';
  const rm = params.get('rm') === '1';
  const SINK_ON = params.get('sink') !== '0';
  const START_ZOOM = clampZoomStep(params.has('zoom') ? Number(params.get('zoom')) : 1);
  const [W, H] = (params.get('size') || '960x540').split('x').map(Number);
  const DRIVE = params.get('drive') === '1';
  const BARE = params.has('bare');
  const RESUME = (params.get('resume') || '-19,-10,' + behindYaw(-1, 0)).split(',').map(Number);
  const DT = 1 / 30; // the fixed step of shots, tours and __frame
  const SETTLE = 1.5; // s a shot runs with her standing: the sink, the fade and the shadow fit settle
  const TAIL = 1.0; // s of film after a tour ends
  const BREED = 'tabby';
  const PACE = 3.5; // her walk, m/s (test/helpers/housewalk.js's, so the tours run as tested)

  // This page's own short tour (not the game's), for judging the sink's calm:
  // just inside the front door the camera hangs outside the hall's south wall,
  // which is down from the first frame (the walk's start settles it, as the
  // game's does); she walks into the hall (the camera comes inside, and the wall
  // rises behind it, out of sight); the Far step cuts the near walls away
  // (down), the Middle step brings them back (up).
  const f = Object.freeze;
  const PAGE_TOURS = f({
    sink: f({
      start: f({ x: 0, z: 10.5, face: f([0, -1]) }),
      steps: f([
        f({ zoom: 1, hold: 1.2, caption: 'The front wall is down' }),
        f({ to: f([0, 6.5]), caption: 'She walks in' }),
        f({ zoom: 1, hold: 1.2 }),
        f({ zoom: 2, hold: 1.8, caption: 'Farther out: the near walls go down' }),
        f({ zoom: 1, hold: 1.8, caption: 'Closer again: they come back up' }),
      ]),
    }),
  });
  const TOURS = { ...HOUSE_TOURS, ...PAGE_TOURS };
  // This page's own extra shot: from the attic at Farther, looking back over the
  // house, so the far levels' plain stand-ins (the ground floor, the cellar) show.
  const PAGE_SHOTS = f({
    standins: f({ at: f([-17, -10]), face: f([1, 0.3]), zoom: 3 }),
  });
  const SHOTS = { ...HOUSE_SHOTS, ...PAGE_SHOTS };

  // ---- The rig, as verify-places.html builds it ----
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.prepend(renderer.domElement);
  const tier = { name: 'high', envIntensity: 0.45 };
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  const sun = createSun();
  scene.add(sun);

  // ---- The house, built as game/walk.js builds a walk ----
  const area = buildHouse(scene); // sets the sky and the fog itself (builder.js applySky)
  const ground = area.ground;
  const fill = createFill(area.groundBounce);
  scene.add(fill);
  // The contact-shadow scan while the scene holds the area's props and nothing
  // else, then the prop merge (walk.js's order, and why, at its call).
  const decals = createContactShadows(scene, { ground });
  mergeStaticProps(scene);
  const cat = buildCat(BREED);
  scene.add(cat);
  // The dusk look, as walk.js gives it (no Night Eyes: the base exposure).
  const duskLook = DUSK ? applyDusk({ scene, sun, fill, areaData: area }) : null;
  if (duskLook) scene.environmentIntensity = duskEnv(scene.environmentIntensity, duskLook);
  const duskGround = duskLook ? scene.children.filter((c) => c.isMesh && (c.userData.ground || c.userData.duskTint || c.name === 'path' || c.name === 'horizonBand' || c.name === 'steppingStones')) : [];
  decals.follow(cat);
  const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
  const shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
  sun.shadow.bias = SUN_BIAS;
  assignShadowCasters(scene);
  if (duskLook) {
    tintDuskLawn({ ground: duskGround, grass: null, look: duskLook });
    createLampPools(scene);
  }
  // The tree fade over everything walk.js hands it (the house's tall furniture
  // carries fadeOccluder; the neighbours and the garden trees their own tags).
  const fade = createTreeFade([...findOccluders(scene), ...findFadeOccluders(scene)], { reducedMotion: rm });
  const fadeLook = { x: 0, y: 0, z: 0 };

  // The house's life: made fresh for every walk (reset), so each shot and tour
  // starts from its own settled view, never helped by walls the last one left.
  let life = null;
  const standing = { fraction: () => 1, isDown: () => false }; // sink=0
  const sinkNow = () => (SINK_ON ? life.sink : standing);

  // ---- The walk: the real player ----
  const player = createPlayer(camera, renderer.domElement);
  player.setReducedMotion(rm);
  let t = 0;

  // A fresh walk at (x, z), facing (fx, fz), the view behind her at zoom step `zoom`.
  function reset(x, z, fx, fz, zoom) {
    life?.dispose();
    life = area.life({ scene, sun, fill, ground, reducedMotion: rm });
    cat.position.set(x, ground.y(x, z), z);
    cat.rotation.set(0, facingYaw(fx, fz), 0);
    player.setAvatar(cat, PACE);
    player.setGround(ground);
    player.setViewYaw(behindYaw(fx, fz));
    player.setCameraZoom(zoom, { instant: true });
    player.setTouchMove(null);
    player.enable();
    player.update(0, area.colliders, area.bounds, area.waters ?? []); // the camera on her spot
    // settled on that view at once, as game/walk.js does at a walk's start
    if (SINK_ON) life.settle(cat.position, camera);
    else life.drawing.settle(cat.position.y);
    shadows.update(ground.y(x, z), 1e3); // the shadow fit settled on her level at once
  }

  function lifeStep(dt) {
    if (SINK_ON) life.update(dt, t, cat.position, camera);
    else life.drawing.update(cat.position.y); // the "before": the levels as ever, no wall sinks
  }

  // One frame, as main.js orders it.
  function frame(dt) {
    t += dt;
    player.update(dt, area.colliders, area.bounds, area.waters ?? []);
    player.speedFactor = 1; // game/avatar.js writes it after player.update
    animateCat(cat, 'follow', t, player.speed, rm);
    cat.rotation.x = 0;
    cat.rotation.z = 0;
    lifeStep(dt);
    fadeLook.x = cat.position.x;
    fadeLook.y = cat.position.y + CAT_LOOK_Y;
    fadeLook.z = cat.position.z;
    fade.update(dt, camera, fadeLook);
    shadows.update(ground.y(cat.position.x, cat.position.z), dt);
    decals.update();
    render();
  }

  const view = {};
  function info() {
    makeView(cat.position, camera.position, CAT_LOOK_Y, view);
    const sink = sinkNow();
    const blockers = blockersOf(area.house.sections, sink, view);
    // the cellar's lid, when it is drawn and in the line (owner's fix B; under sink=0 it never hides)
    const lidOn = SINK_ON ? life.lid.shown : true;
    if (lidOn && lidInLine(area.house.lid, view)) blockers.push('cellarLid');
    return {
      level: life.drawing.current,
      full: [...life.drawing.full],
      down: area.house.sections.filter((s) => sink.isDown(s.id)).map((s) => s.id),
      lid: lidOn ? 'on' : 'off',
      blockers,
    };
  }

  const hud = document.getElementById('hud');
  if (BARE) hud.remove();
  const captionEl = document.getElementById('caption');
  let caption = null;
  function setCaption(text) {
    if (text === caption) return;
    caption = text;
    captionEl.replaceChildren();
    if (text) {
      const span = document.createElement('span');
      span.textContent = text;
      captionEl.append(span);
    }
  }
  function render() {
    renderer.render(scene, camera);
    if (BARE) return;
    const p = cat.position;
    const i = info();
    hud.textContent = [
      `${DUSK ? 'dusk' : 'day'} · walls ${SINK_ON ? 'sink' : 'never sink (before)'}${rm ? ' · reduced motion' : ''} · zoom ${player.cameraZoomStep}`,
      `at ${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)} · level ${i.level} (full: ${i.full.join(', ')})`,
      `down ${i.down.join(' ') || '-'} · cellar lid ${i.lid}`,
      `blockers ${i.blockers.join(' ') || '-'}`,
      tour ? '' : 'arrows or W-A-S-D walk · + and - zoom',
    ].filter(Boolean).join('\n');
  }

  // ---- The shots ----
  // A fresh walk at the spot, settled for SETTLE s as a shot is.
  function settleAt(label, x, z, fx, fz, zoom) {
    tour = null;
    setCaption(null);
    reset(x, z, fx, fz, zoom);
    for (let k = 0; k < SETTLE / DT; k++) frame(DT);
    const b = info().blockers;
    // under sink=0 a wall in the way is the "before" itself, not a fault
    if (b.length && SINK_ON) console.error(`shot ${label}: a wall stands between the camera and her: ${b.join(' ')}`);
    render();
  }
  window.__shot = (name) => {
    if (name === 'resume') { resumeAt(RESUME[0], RESUME[1], RESUME[2]); return name; }
    const s = SHOTS[name];
    if (!s) throw new Error(`no shot "${name}"; there are ${Object.keys(SHOTS).join(', ')}`);
    settleAt(name, s.at[0], s.at[1], s.face[0], s.face[1], s.zoom);
    return name;
  };
  window.__place = (x, z, fx, fz, zoom = 1) => { settleAt(`at ${x}, ${z}`, x, z, fx, fz, zoom); return info(); };

  // A walk picked up again (the "resume" shot), placed as game/walk.js's resume
  // branch places her: at the note's spot, she and the view turned to the
  // note's yaw, the camera behind her at the start view, then the house life
  // settled. The
  // "Welcome back!" card is paused, so no frame runs before the picture.
  function resumeAt(x, z, yaw, zoom = START_ZOOM) {
    tour = null;
    setCaption(null);
    life?.dispose();
    life = area.life({ scene, sun, fill, ground, reducedMotion: rm });
    cat.position.set(x, ground.y(x, z), z);
    cat.rotation.set(0, yaw, 0); // she faces the way the note looked (walk.js, owner's fix C)
    player.setAvatar(cat, PACE);
    player.setGround(ground);
    player.setViewYaw(yaw);
    player.setCameraZoom(zoom, { instant: true });
    player.setTouchMove(null);
    const v = zoomView(zoom);
    camera.position.copy(cat.position).add(cameraOffset(yaw, 0.18, v.dist, v.height));
    camera.lookAt(cat.position.x, cat.position.y + CAT_LOOK_Y, cat.position.z);
    if (SINK_ON) life.settle(cat.position, camera);
    else life.drawing.settle(cat.position.y);
    shadows.update(ground.y(x, z), 1e3);
    render();
  }

  // ---- The tours ----
  let tour = null; // { name, pilot, ended } while one runs

  window.__tour = (name) => {
    const spec = TOURS[name];
    if (!spec) throw new Error(`no tour "${name}"; there are ${Object.keys(TOURS).join(', ')}`);
    reset(spec.start.x, spec.start.z, spec.start.face[0], spec.start.face[1], 1);
    tour = { name, pilot: createHousePilot(spec), ended: null, w: { player, cat } };
    setCaption(null);
    render();
    return name;
  };

  function tourStep() {
    if (tour.ended === null) {
      const r = tour.pilot.step(DT, tour.w);
      setCaption(r.caption);
      if (r.done) {
        if (r.failed !== null) console.error(`tour ${tour.name}: the pilot gave up on step ${r.failed}`);
        tour.ended = t;
      }
    }
    frame(DT);
    return { done: tour.ended !== null && t - tour.ended >= TAIL - 1e-9, caption };
  }

  window.__frame = () => {
    if (tour) return tourStep();
    frame(DT);
    return { done: false, caption };
  };
  window.__snap = (q = 0.85) => { render(); return renderer.domElement.toDataURL('image/jpeg', q); };
  window.__info = info;
  window.__player = player;
  window.__cat = cat;

  // + / = and -: the zoom steps, as the game's keys.
  document.addEventListener('keydown', (e) => {
    if (tour) return;
    const dir = keyZoomDir(e.key, e.code);
    if (!dir) return;
    e.preventDefault();
    player.setCameraZoom(player.cameraZoomStep + dir);
  });

  // ---- Start ----
  const tourName = params.get('tour');
  if (tourName) window.__tour(tourName);
  else reset(area.spawn.x, area.spawn.z, 0, -1, START_ZOOM);
  render();
  window.__ready = true;

  if (!DRIVE) {
    // Real time: a tour in fixed steps of the time that has passed; free play
    // at the frame's own (capped) dt.
    const clock = new THREE.Clock();
    let owed = 0;
    let finished = false;
    const loop = () => {
      requestAnimationFrame(loop);
      const dt = Math.min(clock.getDelta(), 0.1);
      if (!tour) { frame(Math.min(dt, 0.05)); return; }
      if (finished) return;
      owed += dt;
      while (owed >= DT && !finished) {
        owed -= DT;
        finished = tourStep().done;
      }
    };
    requestAnimationFrame(loop);
  }
</script>
</body>
