<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon milestone 0 picture page</title>
<!-- The Moon, milestone 0 (the seams): the real bare plain (src/world/moon.js), the real suit kit (src/cat/suitkit.js, drawn through
     effectiveWear for the 'space' look: the walk does not wire the suit in until milestone 1), the real player with the Moon's own hop
     arc (placeArc from src/placephysics.js, the same call game/interactions.js makes) and the walk's own evening look (render/dusk.js).
     NOT in the game: nothing reaches it from the app. scripts/record-page.mjs makes the pictures: __shot(name), __snap().
     URL params: size=WxH (default 960x540), bare (no HUD), rm=1 (reduced motion: the flat arc), earth=1 (the Moon's arc off: Earth's hop, for a side-by-side).
     Shots: plain, hop (the top of a standing hop), hopfwd (a hop on the run), land (the frame the paws touch), earthhop (Earth's hop for the same view);
     side* are the same four from a fixed camera on the ground. -->
<style>
  html, body { margin: 0; background: #05070f; overflow: hidden; font: 12px/1.35 Avenir, system-ui, sans-serif; color: #e8ecf8; }
  canvas { position: fixed; left: 0; top: 0; display: block; }
  #hud { position: fixed; left: 0; top: 0; padding: 6px 10px; background: rgba(8, 10, 18, .72); white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier } from '/src/render/textures.js';
  import { createSun, createFill, DEFAULT_GROUND_BOUNCE, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { buildCat } from '/src/cat/model.js';
  import { animateCat } from '/src/cat/animator.js';
  import { createPlayer, pounceArc } from '/src/player.js';
  import { facingYaw, behindYaw } from '/src/traversal.js';
  import { applyDusk, duskEnv, tintDuskLawn } from '/src/render/dusk.js';
  import { installSuitKit } from '/src/cat/suitkit.js';
  import { effectiveWear } from '/src/suithook.js';
  import { placeArc, placePace } from '/src/placephysics.js';
  import { build } from '/src/world/moon.js';

  installSuitKit();
  const params = new URLSearchParams(location.search);
  const rm = params.get('rm') === '1';
  const [W, H] = (params.get('size') || '960x540').split('x').map(Number);
  const BARE = params.has('bare');
  const DT = 1 / 30;

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  document.body.prepend(renderer.domElement);
  const tier = { name: 'high', envIntensity: 0.3 };
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  const sun = createSun();
  scene.add(sun);
  const fill = createFill(DEFAULT_GROUND_BOUNCE);
  scene.add(fill);
  const area = build(scene);
  const look = applyDusk({ scene, sun, fill, areaData: area });
  tintDuskLawn({ ground: scene.children.filter((c) => c.isMesh && (c.userData.ground || c.userData.duskTint)), grass: null, look });
  scene.environmentIntensity = duskEnv(scene.environmentIntensity, look);

  // the cat, in the Moon's suit (what milestone 1's hook will do in the walk), the same call the walk makes for any wear
  const wear = effectiveWear({ collar: null, head: null, face: null, neck: null, body: null, back: null, feet: null }, 'moon', 'space');
  const cat = buildCat('tabby', wear);
  scene.add(cat);
  const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
  const shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
  sun.shadow.bias = SUN_BIAS;
  assignShadowCasters(scene);

  const player = createPlayer(camera, renderer.domElement);
  player.setReducedMotion(rm);
  let t = 0;
  let place = 'moon';
  function reset(x, z, fx, fz) {
    cat.position.set(x, 0, z);
    cat.rotation.set(0, facingYaw(fx, fz), 0);
    player.setAvatar(cat, placePace(3.5, place));
    player.setGround(null);
    player.setViewYaw(behindYaw(fx, fz));
    player.enable();
    player.update(0, area.colliders, area.bounds, area.waters);
    shadows.update(0, 1e3);
  }
  const stick = (x, z) => player.setTouchMove(x === 0 && z === 0 ? null : { x, z, mag: 1 });
  const hud = document.getElementById('hud');
  if (BARE) hud.remove();
  function frame(dt) {
    t += dt;
    player.update(dt, area.colliders, area.bounds, area.waters);
    player.speedFactor = 1;
    animateCat(cat, player.hopY > 0 ? 'pounce' : 'follow', t, player.speed, rm);
    cat.rotation.x = 0; cat.rotation.z = 0;
    shadows.update(0, dt);
    render();
  }
  function render() {
    renderer.render(scene, camera);
    if (BARE) return;
    const p = cat.position;
    hud.textContent = [`${place} · at ${p.x.toFixed(1)}, ${p.z.toFixed(1)} · hop ${player.hopY.toFixed(2)} m`, `draws ${renderer.info.render.calls} · tris ${renderer.info.render.triangles}`].join('\n');
  }
  // the pounce exactly as game/interactions.js presses it
  const press = () => player.pounce(placeArc(pounceArc({ skills: [] }, { reducedMotion: rm }), place));
  const SHOTS = {
    plain: { at: [0, 40], face: [0, -1], run: 0 },
    hop: { at: [0, 40], face: [0, -1], hop: 0.54 },
    hopfwd: { at: [0, 40], face: [0, -1], stick: [0, -1], lead: 0.6, hop: 0.54 },
    land: { at: [0, 40], face: [0, -1], hop: 1.08 },
    earthhop: { at: [0, 40], face: [0, -1], hop: 0.15, earth: true },
    // fixed side views (the camera stays on the ground, so the height of the hop reads against the plain)
    sidestand: { at: [0, 40], face: [0, -1], cam: { pos: [7, 1.8, 40], look: [0, 1.3, 40], fov: 48 } },
    sidehop: { at: [0, 40], face: [0, -1], hop: 0.54, cam: { pos: [7, 2.4, 39.4], look: [0, 1.6, 39.4], fov: 48 } },
    sideland: { at: [0, 40], face: [0, -1], hop: 1.08, cam: { pos: [7, 2.4, 39.4], look: [0, 1.6, 39.4], fov: 48 } },
    sideearth: { at: [0, 40], face: [0, -1], hop: 0.15, earth: true, cam: { pos: [7, 2.4, 39.4], look: [0, 1.6, 39.4], fov: 48 } },
  };
  window.__shot = (name) => {
    const s = SHOTS[name];
    if (!s) throw new Error(`no shot "${name}"; there are ${Object.keys(SHOTS).join(', ')}`);
    place = s.earth ? 'park' : 'moon';
    reset(s.at[0], s.at[1], s.face[0], s.face[1]);
    if (s.stick) stick(...s.stick);
    for (let k = 0; k < (s.lead ?? 0) / DT; k++) frame(DT);
    for (let k = 0; k < 20; k++) frame(DT);
    if (s.hop !== undefined) {
      press();
      // the hop is run to its moment, frame by frame, as the walk's clock would
      for (let k = 0; k < Math.round(s.hop / DT); k++) frame(DT);
    }
    stick(0, 0);
    if (s.cam) { camera.fov = s.cam.fov ?? 70; camera.updateProjectionMatrix(); camera.position.set(...s.cam.pos); camera.lookAt(...s.cam.look); }
    render();
    return name;
  };
  window.__snap = (q = 0.85) => { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/jpeg', q); };
  reset(0, 40, 0, -1);
  render();
  window.__ready = true;
</script>
</body>
</html>
