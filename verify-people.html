<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People picture sheet</title>
<!-- The picture sheet for the lifelike people
     (docs/superpowers/specs/2026-11-20-lifelike-people-design.md). It draws the
     real module (src/people/index.js, the kit) next to today's Twoleg
     (src/critters.js buildTwolegFigure), with the game's own light. Not game
     code: nothing in the game imports src/people/ yet.
     Each frame, for every person: pose(), applyPose(), stepGaze() (her head is
     the target), on the scratch shots stepScratch() (her head's top and her
     volumes), then the world matrices, then kit.update() (near/far, view).
     A still runs that loop for 2.5 s of simulated time at 1/60 s before it
     renders, so the eases settle and the gaze turns complete.
     URL params:
       scene=sheet (default)   a lineup on a lawn: today's figure, then a man, a woman with a girl at her side (one spot: a pair), an older man, and a tabby for scale
       scene=fair&fig=new|old  the real Fairground (world/fair.js) with its visitors (src/fairvisitors.js, run on 40 s) and the juggler
       scene=neighborhood|park|docks|seaside
                               the street place built from its world module, its villagers made by the game's own
                               createCritters with the people kit (the head scratch, the bumps, the pairs, the gaze
                               all the walk's code), her cat walked by the game's player (createPlayer, the bumps
                               passed), the walk's contact shadows and its normal camera (the player's own)
       size=WxH                the canvas (default 1280x720)
     Shots (scripts/record-page.mjs --shots a,b): window.__shot(name) poses, lights and frames, and answers the name.
       sheet: lineup-day lineup-cateye-day faces-front-day faces-near-day blink-day glance-day stride-day
              wave-cateye-day crouch-cateye-day dismay-day lineup-sunset wave-cateye-sunset stride-sunset
              neck-side-day neck-far-day far-day lod-close faces-day back-day crowd-spots
              scratch-touch-day scratch-touch-cateye scratch-touch-side scratch-touch-ears scratch-touch-mainecoon
              scratch-held-day scratch-older-day
              kneel-front-day kneel-left-day dress-scratch-day dress-scratch-side dress-scratch-front dress-kneel-back
              skirt-scratch-day skirt-scratch-side coat-scratch-side dress-stride-day skirt-stride-day
       fair:  fair-day fair-dusk fair-close
       place: wave wave-eye (a villager waving, the normal camera and her eye height, 0.3 m)
              pair pair-eye (the place's pair: the Neighborhood, the Park and the Docks)
     Tours (scripts/record-page.mjs --tour name): window.__tour(name), then window.__frame() steps 1/30 s
     (two 1/60 s steps) and renders, and answers { done, caption }.
       sheet: gaze (she walks past the lineup 3 m away, 8 s), walk (a man, a woman and a pair walk past, 6 s),
              scratch (she walks up to the kneeling man from 2 m, is touched, turns away, 7.5 s),
              kneel (the man kneels and stands again, from his left side, 3 s)
       place: slide (she walks into a villager and slides round, 5 s),
              scratch-town (she walks up, asks, is touched, walks away: the game's own head scratch, 11 s),
              scratch-town-side (the same, from the villager's right)
     window.__info() renders and returns { calls, triangles } (renderer.info, shadow passes included);
     window.__stats is the people's triangle counts. -->
<style>
  html, body { margin: 0; height: 100%; background: #cfd6dc; overflow: hidden; font: 13px/1.3 system-ui, sans-serif; color: #222; }
  canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels span { position: absolute; transform: translate(-50%, -100%); background: rgba(255,255,255,.85); padding: 1px 6px; border-radius: 4px; white-space: nowrap; font-size: 12px; }
  #caption { position: fixed; left: 0; right: 0; bottom: 0; padding: 4px 10px; background: rgba(255,255,255,.88); font-size: 12px; }
</style>
</head>
<body>
<div id="labels"></div>
<div id="caption">loading…</div>
<script type="module">
  import * as THREE from 'three';
  import { buildTwolegFigure, villagerPos } from '/src/critters.js';
  import { buildCat } from '/src/cat/model.js';
  import { animateCat } from '/src/cat/animator.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters, DEFAULT_GROUND_BOUNCE } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier, setTextureAnisotropy } from '/src/render/textures.js';
  import { applyDusk, duskEnv } from '/src/render/dusk.js';
  import { skyBackground } from '/src/render/sky.js';
  import { createWind } from '/src/render/wind.js';
  import { createPeopleKit, pose, applyPose, strideFor, createGaze, stepGaze, REACH, headTopOffset, catVolumes, createScratch, stepScratch } from '/src/people/index.js';
  import { palmPoint } from '/src/people/reach.js';

  const params = new URLSearchParams(location.search);
  const sceneId = params.get('scene') || 'sheet';
  const PLACES = ['neighborhood', 'park', 'docks', 'seaside'];
  let town = null; // a street place: { crit, player, cat, decals, clear }
  const figKind = params.get('fig') || 'new';
  const [W, H] = (params.get('size') || '1280x720').split('x').map(Number);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.info.autoReset = true;
  setTextureAnisotropy(Math.min(4, renderer.capabilities.getMaxAnisotropy()));
  setTextureTier({ name: 'high', envIntensity: 0.45 });
  document.body.prepend(renderer.domElement);
  const caption = document.getElementById('caption');
  const labelsEl = document.getElementById('labels');

  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  const ENV = 0.45;
  scene.environmentIntensity = ENV;
  const sun = createSun();
  scene.add(sun);
  const camera = new THREE.PerspectiveCamera(55, W / H, 0.05, 300);
  const kit = createPeopleKit({ camera, reducedMotion: false });
  // What is drawn: { id, group, members: [{ person, gaze, label }], old?, oldPose?, spot?, label? }.
  // A new item's group holds its people's figures (a pair: two, side by side).
  const items = [];
  const cats = [];
  let area = null;
  let fill = null;
  let sky = { top: 0x8fcbf0, horizon: 0xe4f1e2 };
  let skyDusk = { top: 0x2b3560, horizon: 0x9a6a78 };

  // ---- the figures --------------------------------------------------------------
  // One spot, through the kit: one person, or a pair (the grown-up and the
  // child from the same spot), `gap` apart across the group (the pair's middle
  // is the group's origin).
  function spotItem(id, def, { gap = 0.66, labels = [] } = {}) {
    const spot = kit.buildSpot(def);
    const group = new THREE.Group();
    const members = spot.people.map((person, i) => {
      if (spot.pair) person.figure.position.x = i === 0 ? -gap / 2 : gap / 2;
      group.add(person.figure);
      return { person, gaze: createGaze(person.look), label: labels[i] };
    });
    const item = { id, group, members, pair: spot.pair };
    scene.add(group);
    items.push(item);
    return item;
  }
  // Today's figure, posed as critters.js and fairshow.js pose it.
  function oldItem(id, def, label) {
    const { figure, arm } = buildTwolegFigure(def);
    const group = new THREE.Group();
    group.add(figure);
    const oldPose = (spec) => {
      const t = spec.t ?? 0;
      figure.position.y = 0; figure.scale.y = 1; figure.rotation.x = 0;
      arm.rotation.x = 0;
      if (spec.mode === 'wave') arm.rotation.z = 2.6 + Math.sin(t * 6) * 0.3;
      else if (spec.mode === 'kneel') { figure.scale.y = 0.7; figure.rotation.x = -0.28; arm.rotation.z = 1.2; }
      else if (spec.mode === 'juggle') arm.rotation.z = 1.0 + Math.sin(t * 4.6) * 0.35;
      else {
        arm.rotation.z = 0.4;
        if (spec.mode === 'walk') { arm.rotation.x = Math.sin(spec.oldStride ?? 0) * 0.45; figure.position.y = Math.abs(Math.sin(spec.oldStride ?? 0)) * 0.03; }
      }
    };
    const item = { id, group, members: [], old: true, oldPose, label };
    scene.add(group);
    items.push(item);
    return item;
  }

  // ---- the sheet's cast ---------------------------------------------------------------
  // The woman and the girl are one spot (an explicit 'child' kind always
  // pairs): the kit builds both, the girl 0.65 m to her side. The pair's
  // overrides go to both, so only the shared ones (sex, hair colour).
  const SHEET = [
    { id: 'today', old: true, def: { x: -16, z: 12 }, label: "today's Twoleg" },
    { id: 'man', def: { x: 1, z: 1, kind: 'adult', sex: 'm', height: 1.8, hairStyle: 'short', hairColor: 'dark', top: { kind: 'jumper', color: 0x3e5a7a }, bottom: { kind: 'trousers', color: 0x4a4a52 }, shoes: 0x5a3a28, hat: null, skin: 0xe6bf9e }, label: 'man, 1.80 m' },
    { id: 'pair', def: { x: 2, z: 1, kind: 'child', sex: 'f', hairColor: 'auburn', hat: null } },
    // only in the walk tour: a woman on her own
    { id: 'woman', extra: true, def: { x: 2.5, z: 1, kind: 'adult', sex: 'f', height: 1.66, hairStyle: 'ponytail', hairColor: 'dark', top: { kind: 'tshirt', color: 0xd27a96 }, bottom: { kind: 'trousers', color: 0x3e4a66 }, shoes: 0xe8e4dc, hat: null, skin: 0xefcfb4 }, label: 'woman, 1.66 m' },
    // only on the skirt and dress shots
    { id: 'dress', extra: true, def: { x: 3, z: 1, kind: 'adult', sex: 'f', height: 1.68, hairStyle: 'bun', hairColor: 'auburn', top: { kind: 'dress', color: 0x5a7ab0 }, bottom: { kind: 'skirt', color: 0x5a7ab0 }, shoes: 0x3a3330, hat: null, skin: 0xe6bf9e }, label: 'woman in a dress, 1.68 m' },
    { id: 'skirt', extra: true, def: { x: 3.5, z: 1, kind: 'adult', sex: 'f', height: 1.62, hairStyle: 'long', hairColor: 'dark', top: { kind: 'jumper', color: 0xc8604a }, bottom: { kind: 'skirt', color: 0x3e4a66 }, shoes: 0x5a3a28, hat: null, skin: 0xa8734c }, label: 'woman in a skirt, 1.62 m' },
    { id: 'coat', extra: true, def: { x: 4.5, z: 1, kind: 'adult', sex: 'm', height: 1.78, hairStyle: 'crop', hairColor: 'dark', top: { kind: 'coat', color: 0x8a6a4a }, bottom: { kind: 'trousers', color: 0x3e4a5a }, shoes: 0x3a3330, hat: null, skin: 0xf0d2b8 }, label: 'man in a coat, 1.78 m' },
    { id: 'older', def: { x: 4, z: 1, kind: 'older', sex: 'm', height: 1.7, hairStyle: 'short', hairColor: 'white', top: { kind: 'coat', color: 0x7a8a4a }, bottom: { kind: 'trousers', color: 0x7a6a50 }, shoes: 0x3a3330, hat: null, glasses: true, skin: 0xa8734c }, label: 'older man, 1.70 m' },
  ];
  // a second lineup, dressed from spawn spots only (no overrides): how crowds vary
  const SPOTS = [[-16, 12], [14, 34], [4, 27], [-8, -22], [18, 16], [32, -10], [14, 7], [-10, -8]];

  const sunsetLight = () => {
    const look = applyDusk({ scene, sun, fill, areaData: { skyDusk, groundBounce: area?.groundBounce } });
    scene.environmentIntensity = duskEnv(ENV, look);
  };
  const dayLight = () => {
    scene.background = skyBackground(sky.top, sky.horizon);
    scene.fog = sceneId === 'fair' ? new THREE.Fog(sky.horizon, 60, 180) : null;
    const f0 = createFill(area?.groundBounce ?? DEFAULT_GROUND_BOUNCE);
    fill.color.copy(f0.color); fill.groundColor.copy(f0.groundColor); fill.intensity = f0.intensity;
    const s0 = createSun();
    sun.color.copy(s0.color); sun.intensity = s0.intensity;
    scene.environmentIntensity = ENV;
  };

  let shadows;
  if (sceneId === 'sheet') {
    fill = createFill(DEFAULT_GROUND_BOUNCE);
    scene.add(fill);
    const lawn = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x6f9a48, roughness: 0.95 }));
    lawn.rotation.x = -Math.PI / 2;
    lawn.receiveShadow = true;
    scene.add(lawn);
    // a paving strip to stand on, so feet read against something
    const pave = new THREE.Mesh(new THREE.PlaneGeometry(9, 2.2), new THREE.MeshStandardMaterial({ color: 0xc9c2b4, roughness: 0.9 }));
    pave.rotation.x = -Math.PI / 2; pave.position.set(0, 0.002, 0); pave.receiveShadow = true;
    scene.add(pave);
    for (const c of SHEET) {
      if (c.old) { oldItem(c.id, c.def, c.label); continue; }
      const it = spotItem(c.id, c.def, { gap: 0.65, labels: c.id === 'pair' ? [] : [c.label] });
      if (c.extra) { it.extra = true; it.group.visible = false; }
      if (it.pair) {
        const [a, k] = it.members;
        a.label = `woman, ${a.person.look.height.toFixed(2)} m`;
        k.label = `girl, ${k.person.look.height.toFixed(2)} m (same spot)`;
        // the woman at the group's origin, the girl to her side (screen right when facing us)
        a.person.figure.position.x = 0;
        k.person.figure.position.x = -0.65;
      }
    }
    SPOTS.forEach(([x, z], i) => {
      const it = spotItem(`spot${i}`, { x, z }, { gap: 0.66 });
      it.spot = true;
      it.label = it.pair ? `spot ${x},${z}: a pair` : `spot ${x},${z}`;
      it.group.visible = false;
    });
    const cat = buildCat('tabby');
    cat.position.set(0.2, 0, 2.0);
    scene.add(cat);
    cats.push(cat);
    animateCat(cat, 'follow', 0.5, 0, false);
    // a Maine Coon (the biggest preset cat) for the scratch shot, hidden till then
    const coon = buildCat('mainecoon');
    coon.visible = false;
    scene.add(coon);
    cats.push(coon);
    shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
    sun.shadow.bias = SUN_BIAS;
    assignShadowCasters(scene);
    dayLight();
  } else if (PLACES.includes(sceneId)) {
    // ---- a street place: the game's own villagers and player ----
    const world = await import(`/src/world/${sceneId}.js`);
    const { createCritters } = await import('/src/critters.js');
    const { createPlayer, CAT_RADIUS } = await import('/src/player.js');
    const { createContactShadows } = await import('/src/render/contactshadows.js');
    const { waterClearance } = await import('/src/world/builder.js');
    const { mulberry32 } = await import('/src/rng.js');
    const wind = createWind({ reducedMotion: true });
    area = world.build(scene, { water: { quality: { name: 'high' }, reducedMotion: true }, wind });
    fill = createFill(area.groundBounce);
    scene.add(fill);
    const decals = createContactShadows(scene);
    const crit = createCritters(scene, area.critterSpawns.filter((d) => d.type === 'villager'), {
      people: createPeopleKit, camera, area, rng: mulberry32(7), motionRng: mulberry32(11),
    });
    const cat = buildCat('tabby');
    scene.add(cat);
    cats.push(cat);
    const player = createPlayer(camera, renderer.domElement);
    player.setAvatar(cat, 3);
    player.enable();
    decals.follow(cat);
    for (const c of crit.list) decals.follow(c.figure ?? c.group);
    for (const c of crit.list) if (c.people?.[1]) decals.follow(c.people[1].figure); // as walk.js (R26)
    shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
    sun.shadow.bias = SUN_BIAS;
    assignShadowCasters(scene);
    const clear = (x, z) => area.colliders.every((k) => Math.hypot(x - k.x, z - k.z) >= k.r + CAT_RADIUS + 0.15)
      && waterClearance(area.waters, x, z) >= CAT_RADIUS + 0.15
      && crit.bumps.every((b) => Math.hypot(x - b.x, z - b.z) >= b.r + CAT_RADIUS + 0.1)
      && (area.perches ?? []).every((q) => Math.hypot(x - q.x, z - q.z) >= 1.0); // (a bench is a perch, not a collider)
    town = { crit, player, cat, decals, clear };
  } else {
    // ---- the Fairground ----
    const fair = await import('/src/world/fair.js');
    const { createFairVisitors, visitorCount } = await import('/src/fairvisitors.js');
    const { createFairSim } = await import('/src/fairsim.js');
    const wind = createWind({ reducedMotion: true });
    area = fair.build(scene, { water: { quality: { name: 'high' }, reducedMotion: true }, wind });
    sky = { top: 0x8fcbf0, horizon: 0xe4f1e2 };
    skyDusk = area.skyDusk ?? skyDusk;
    fill = createFill(area.groundBounce);
    scene.add(fill);
    const sim = createFairSim(area);
    const visitors = createFairVisitors(area, { count: visitorCount(22), swept: sim.swept, seed: 'people-proto' });
    const cat = buildCat('tabby');
    scene.add(cat);
    cats.push(cat);
    // the cat waits on the midway's east side while the visitors stroll 40 s round her
    const catAt = { x: 3.4, y: 0, z: 25.5, speed: 0, perched: false, inWater: false, pouncing: false };
    for (let s = 0; s < 40; s += 1 / 30) visitors.step(1 / 30, catAt);
    cat.position.set(catAt.x, 0, catAt.z);
    cat.rotation.y = 0.15;
    animateCat(cat, 'follow', 0.5, 0, false);
    const A = area.anchors;
    for (const v of visitors.list) {
      // a pair: the grown-up 0.33 m to one side of the visitor's way, the child 0.33 m to the other
      const it = figKind === 'old' ? oldItem(v.id, { x: v.look.x, z: v.look.z }) : spotItem(v.id, { x: v.look.x, z: v.look.z }, { gap: 0.66 });
      it.v = v;
      it.group.position.set(v.x, 0, v.z);
      it.group.rotation.y = v.yaw + Math.PI;
    }
    const jg = figKind === 'old' ? oldItem('juggler', { x: 311.5, z: 77.25 }) : spotItem('juggler', { x: 311.5, z: 77.25, kind: 'adult', sex: 'm', top: { kind: 'tshirt', color: 0xe2433a } });
    jg.juggler = true;
    jg.group.position.set(A.juggler.x, 0, A.juggler.z);
    jg.group.rotation.y = Math.atan2(A.jugglerWatch.x - A.juggler.x, A.jugglerWatch.z - A.juggler.z) + Math.PI;
    shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
    sun.shadow.bias = SUN_BIAS;
    assignShadowCasters(scene);
    // as the Fairground's visitors are today: no shadow pass for people
    for (const it of items) it.group.traverse((m) => { if (m.isMesh) { m.castShadow = false; m.userData.noCast = true; } });
    window.__visitors = visitors;
    dayLight();
  }

  // ---- the frame loop -----------------------------------------------------------
  const DT = 1 / 60;
  let clock = 0; // the walk clock every pose and blink reads
  const HEAD_AT = new THREE.Vector3();
  // her head (the gaze's target); on cat-eye shots the camera is her eyes
  let her = 0; // which of cats is her (the scratch shots may use the Maine Coon)
  function herHead() {
    const c = cats[her];
    if (!c.visible) return HEAD_AT.copy(camera.position);
    c.updateMatrixWorld(true);
    return c.userData.parts.head.getWorldPosition(HEAD_AT);
  }
  // her head's top (the scratch's target, as the walk will pass it) and her volumes
  const TOP_AT = new THREE.Vector3();
  let VOL = null;
  function herTop() {
    const c = cats[her];
    if (!c.visible) return null;
    c.updateMatrixWorld(true);
    c.userData.parts.head.getWorldPosition(TOP_AT);
    TOP_AT.y += headTopOffset(c);
    VOL = catVolumes(c, VOL);
    return TOP_AT;
  }
  let current = { spec: () => ({ mode: 'stand' }), detail: null };
  // one step of every shown person: pose, applyPose, stepGaze (and on the
  // scratch shots stepScratch, a grown-up's right hand to her head); then the
  // world matrices and the kit's near/far and view test
  function step(dt) {
    clock += dt;
    const target = herHead();
    const top = herTop();
    for (const it of items) {
      if (!it.group.visible || it.old) continue;
      const s = current.spec(it);
      it.group.updateMatrixWorld(true);
      for (const m of it.members) {
        const walked = typeof s.walked === 'function' ? s.walked(m) : s.walked;
        pose(m.person, { mode: s.mode, t: clock + (s.tOff ?? 0), walked, reducedMotion: false });
        applyPose(m.person, dt, 0.3);
        stepGaze(m.person, m.gaze, dt, clock, { target: s.noLook ? null : target });
        if (s.scratch && m.person.look.kind !== 'child') {
          m.scratch = m.scratch ?? createScratch();
          m.scratchState = stepScratch(m.person, m.scratch, dt, { headTop: top, volumes: top ? VOL : undefined });
        }
      }
    }
    for (const it of items) if (it.group.visible) it.group.updateMatrixWorld(true);
    kit.update();
    if (current.detail) {
      for (const it of items) for (const m of it.members) {
        const d = current.detail(it, m);
        if (d && m.person.detail !== d) m.person.setDetail(d);
      }
    }
  }
  // A still: who is shown, the spec per item, and 2.5 s of the loop (then on,
  // up to `most` seconds, until `until()` says so). Gazes start fresh.
  function settle(spec, { which = (it) => !it.spot && !it.extra, detail = null, seconds = 2.5, until = null, most = 12 } = {}) {
    current = { spec: typeof spec === 'function' ? spec : () => spec, detail };
    for (const it of items) {
      it.group.visible = !!which(it); // three draws anything not exactly false
      for (const m of it.members) { m.gaze = createGaze(m.person.look); m.scratch = null; }
    }
    let s = 0;
    for (; s < seconds; s += DT) step(DT);
    if (until) for (; s < most && !until(); s += DT) step(DT);
    for (const it of items) if (it.old && it.group.visible) it.oldPose({ ...current.spec(it), t: clock });
    return s;
  }
  const cam = (px, py, pz, lx, ly, lz, fov = 55) => {
    camera.fov = fov; camera.updateProjectionMatrix();
    camera.position.set(px, py, pz); camera.lookAt(lx, ly, lz);
    camera.updateMatrixWorld(true);
  };
  const LBL = new THREE.Vector3();
  function labels(on = true) {
    labelsEl.innerHTML = '';
    if (!on) return;
    camera.updateMatrixWorld(true);
    const put = (text, v) => {
      v.project(camera);
      if (v.z > 1) return;
      const span = document.createElement('span');
      span.textContent = text;
      span.style.left = `${(v.x * 0.5 + 0.5) * W}px`;
      span.style.top = `${(-v.y * 0.5 + 0.5) * H}px`;
      labelsEl.appendChild(span);
    };
    for (const it of items) {
      if (!it.group.visible) continue;
      if (it.old && it.label) {
        const top = new THREE.Box3().setFromObject(it.group).max.y;
        put(it.label, new THREE.Vector3(it.group.position.x, top + 0.08, it.group.position.z));
      } else if (it.spot && it.label) {
        put(it.label, LBL.set(it.group.position.x, 2.0, it.group.position.z));
      } else {
        for (const m of it.members) {
          if (!m.label) continue;
          m.person.figure.getWorldPosition(LBL);
          LBL.y += m.person.look.height + 0.1;
          put(m.label, LBL);
        }
      }
    }

    wave: () => { const c = singles()[0] ?? town.crit.list[0]; townPlace(c, spotBy(c, 3)); for (let s = 0; s < 2.5; s += DT) townStep(DT); return `${placeName}: a villager waves to her, 3 m away; the game's normal camera.`; },
    'wave-eye': () => { const c = singles()[0] ?? town.crit.list[0]; townPlace(c, spotBy(c, 3)); for (let s = 0; s < 2.5; s += DT) townStep(DT); eyeCam(c); return `${placeName}: the villager waving, from her eye height (0.3 m).`; },
    pair: () => { const c = pairs()[0]; if (!c) throw new Error(`no pair in ${sceneId}`); townPlace(c, spotBy(c, 3)); for (let s = 0; s < 2.5; s += DT) townStep(DT); return `${placeName}: a grown-up with a child (one spot, a pair), she 3 m away; the normal camera. Both wave and look at her.`; },
    'pair-eye': () => { const c = pairs()[0]; if (!c) throw new Error(`no pair in ${sceneId}`); townPlace(c, spotBy(c, 3)); for (let s = 0; s < 2.5; s += DT) townStep(DT); eyeCam(c); return `${placeName}: the pair from her eye height (0.3 m).`; },
  };
  function townTour(name) {
    const c = singles()[0] ?? town.crit.list[0];
    const { player, cat, crit } = town;
    const at = villagerPos(c, new THREE.Vector3());
    const side = name === 'scratch-town-side';
    if (name !== 'slide' && name !== 'scratch-town' && !side) throw new Error(`no tour ${name}`);
    clock = 0;
    const spot = spotBy(c, name === 'slide' ? 3.2 : 3);
    const yaw = townPlace(c, spot);
    if (name === 'slide') {
      // to his right of his middle (his raised knee's circle is on his left),
      // so she slides round him
      let rx = Math.cos(yaw), rz = -Math.sin(yaw);
      if (rx < 0) { rx = -rx; rz = -rz; }
      cat.position.x += rx * 0.3; cat.position.z += rz * 0.3;
    }
    for (let i = 0; i < 45; i++) townStep(DT);
    let tt = 0;
    let phase = 'in', sitAt = 0, most = 0, lastD = cat.position.distanceTo(at);
    player.setTouchMove({ x: 0, z: -1, mag: 1 });
    tour = {
      name, t: 0, frames: 0,
      seconds: name === 'slide' ? 5 : 11,
      tick(dt) {
        tt += dt;
        let anim = 'follow';
        if (name !== 'slide') {
          const d = cat.position.distanceTo(at);
          if (phase === 'in') {
            const inBy = lastD - d;
            most = Math.max(most, inBy);
            if (d < 1.6 && inBy < most / 3) { phase = 'sit'; sitAt = tt; player.setTouchMove(null); }
          } else if (phase === 'sit') {
            anim = 'requestPet';
            if (tt - sitAt > 0.5 && !c.scratch) crit.scratchHello(c); // she presses E (interactions.js)
            if (tt - sitAt > 5.5) { phase = 'out'; player.setTouchMove({ x: 0, z: 1, mag: 1 }); }
          }
          lastD = d;
        }
        townStep(dt, anim);
      },
      frame() {
        if (side) {
          // from the villager's right, a little in front, low
          cam(at.x + 2.1, 1.05, at.z - 1.1, at.x - 0.05, 0.55, at.z - 0.55, 42);
        }
        const what = name === 'slide'
          ? 'She walks straight into a villager and slides round him, as round a post.'
          : 'She walks up and stops where the soft bump stops her, asks (E), he kneels and his hand comes to her head and rests there; she walks away and it withdraws; he stands 0.6 s after she is 2.5 m off.';
        return `${placeName}: ${what} [${c.poseMode}${c.scratchState ? `, ${c.scratchState}` : ''}]`;
      },
    };
    labels(false);
    return name;
  }

  window.__shot = async (name) => {
    const f = (sceneId === 'fair' ? FAIR : town ? TOWN : SHOTS)[name];
    if (!f) throw new Error(`no shot ${name}`);
    tour = null;
    her = 0;
    cats[0].visible = true;
    if (cats[1]) cats[1].visible = false;
    if (sceneId === 'sheet') sheetDefaults(name);
    reset();
    const text = f();
    render();
    labels(sceneId === 'sheet' && !/^(faces|blink|glance)/.test(name));
    drawCaption(name, text);
    return name;
  };

  // ---- tours (films): __tour(name), then __frame() until done ---------------------
  let tour = null;
  const TOURS = {
    // She walks past the lineup 3 m in front of it, left to right, at 1.2 m/s.
    gaze: () => {
      sheetDefaults('gaze');
      const cat = cats[0];
      const x0 = -6, speed = 1.2;
      cat.rotation.y = -Math.PI / 2; // walking toward +x
      current = { spec: () => ({ mode: 'stand' }), detail: null };
      for (const it of items) {
        it.group.visible = newCast(it);
        for (const m of it.members) m.gaze = createGaze(m.person.look);
      }
      let tt = 0;
      return {
        seconds: 8,
        tick(dt) {
          tt += dt;
          cat.position.set(x0 + speed * tt, 0, 3);
          animateCat(cat, 'follow', tt, speed, false);
          step(dt);
        },
        frame() {
          // a little behind and above her, drifting with her, the lineup's faces in the upper half
          const x = Math.min(0.3, Math.max(-2.5, cat.position.x * 0.5));
          cam(x, 1.7, 7.0, x, 0.6, 0, 24);
          return 'She walks past 3 m away: the eyes lead, the heads follow, a glance away after 4 s (with a blink), then they ease back as she goes.';
        },
      };
    },
    // A man, a woman and a pair (a woman and a girl from one spot) walk past
    // her; she sits on the paving's edge, near enough that they look.
    walk: () => {
      sheetDefaults('walk');
      const cat = cats[0];
      cat.position.set(-1.6, 0, 2.6);
      cat.rotation.y = -0.5;
      animateCat(cat, 'follow', 0.5, 0, false);
      const lanes = {
        man: { x0: 5.0, z: -0.4, dir: -1, speed: 1.35 },
        woman: { x0: -4.6, z: 0.8, dir: 1, speed: 1.25 },
        pair: { x0: 7.6, z: -1.6, dir: -1, speed: 1.05 },
      };
      for (const it of items) {
        it.group.visible = !!lanes[it.id];
        if (!lanes[it.id]) continue;
        it.group.rotation.y = lanes[it.id].dir < 0 ? Math.PI / 2 : -Math.PI / 2;
        for (const m of it.members) m.gaze = createGaze(m.person.look);
      }
      // the pair walks side by side, 0.33 m either side of their way (as at
      // the Fairground), the girl on our side so she is not hidden
      const pair = byId('pair');
      pair.members[0].person.figure.position.set(0.33, 0, 0);
      pair.members[1].person.figure.position.set(-0.33, 0, 0);
      let tt = 0;
      current = { spec: (it) => ({ mode: 'walk', walked: lanes[it.id].speed * tt }), detail: null };
      return {
        seconds: 6,
        tick(dt) {
          tt += dt;
          for (const it of items) {
            const L = lanes[it.id];
            if (L) it.group.position.set(L.x0 + L.dir * L.speed * tt, 0, L.z);
          }
          step(dt);
        },
        frame() {
          cam(1.6, 1.45, 6.0, 0.1, 0.85, -0.4, 44);
          return 'A man, a woman, and a woman with a girl (a pair from one spot) walk past her: heels strike, the arms swing against the legs; near her they look.';
        },
      };
    },
  };
  // She walks up to the kneeling man from 2 m, sits up and is touched, then
  // turns away (to his left, out of his right hand's reach) and walks off.
  TOURS.scratch = () => {
    sheetDefaults('scratch');
    const cat = cats[0];
    const man = byId('man');
    for (const it of items) {
      it.group.visible = it.id === 'man';
      for (const m of it.members) { m.gaze = createGaze(m.person.look); m.scratch = null; }
    }
    man.group.position.set(0, 0, 0);
    man.group.rotation.y = Math.PI;
    current = { spec: () => SCRATCH, detail: null };
    const START = 2.0, STOP = 0.85, IN = 0.6, OUT_AT = 5.6, TURN = 0.6, OFF = 0.8, AWAY = -2.0;
    let tt = 0;
    let z = START, x = 0, yaw = 0;
    // he is already kneeling when the film starts (she asked from 2 m)
    cat.position.set(x, 0, z); cat.rotation.y = yaw;
    animateCat(cat, 'follow', 0, 0, false);
    for (let i = 0; i < 60; i++) step(DT);
    return {
      seconds: 7.5,
      tick(dt) {
        tt += dt;
        let state = 'requestPet', speed = 0;
        if (z > STOP && tt < OUT_AT) { z = Math.max(STOP, z - IN * dt); state = 'follow'; speed = IN; }
        if (tt >= OUT_AT) {
          const k = Math.min(1, (tt - OUT_AT) / TURN);
          yaw = AWAY * k * k * (3 - 2 * k);
          state = 'follow';
          if (k >= 1) { x += -Math.sin(yaw) * OFF * dt; z += -Math.cos(yaw) * OFF * dt; speed = OFF; }
        }
        cat.position.set(x, 0, z);
        cat.rotation.y = yaw;
        animateCat(cat, state, tt, speed, false);
        step(dt);
      },
      frame() {
        cam(1.9, 1.45, 2.9, -0.1, 0.72, 0.6, 44);
        const m = man.members[0];
        return `She walks up from 2 m and sits; he kneels, holds his hand out, then it comes to her head over the top and rests there; she turns away and it withdraws, rising first [${m.scratchState}].`;
      },
    };
  };
  // The man kneels at 0.3 s and stands again at 1.6 s, from his left, low:
  // for the feet (a planted foot must not skate).
  TOURS.kneel = () => {
    sheetDefaults('kneel');
    cats[0].visible = false;
    const man = byId('man');
    for (const it of items) {
      it.group.visible = it.id === 'man';
      for (const m of it.members) { m.gaze = createGaze(m.person.look); m.scratch = null; }
    }
    man.group.position.set(0, 0, 0);
    man.group.rotation.y = Math.PI;
    let tt = 0;
    current = { spec: () => ({ mode: tt > 0.3 && tt < 1.6 ? 'kneel' : 'stand', noLook: true }), detail: null };
    for (let i = 0; i < 60; i++) step(DT);
    return {
      seconds: 3,
      tick(dt) { tt += dt; step(dt); },
      frame() {
        cam(2.4, 0.6, 0.35, 0, 0.45, 0.1, 38);
        return `He kneels (from 0.3 s, 0.7 s down) and stands again (from 1.6 s), from his left: the feet [${tt > 0.3 && tt < 1.6 ? 'kneel' : 'stand'}].`;
      },
    };
  };

  window.__tour = (name) => {
    if (town) return townTour(name);
    if (sceneId !== 'sheet') throw new Error('tours run on scene=sheet or a street place');
    const make = TOURS[name];
    if (!make) throw new Error(`no tour ${name}`);
    clock = 0;
    her = 0;
    if (cats[1]) cats[1].visible = false;
    tour = { name, ...make(), t: 0, frames: 0 };
    labels(false);
    return name;
  };
  window.__frame = () => {
    if (!tour) throw new Error('call __tour(name) first');
    tour.tick(DT); tour.tick(DT); // 1/30 s a frame, in 1/60 s steps
    tour.t += 2 * DT;
    tour.frames++;
    const text = tour.frame();
    render();
    drawCaption(`${tour.name} ${tour.t.toFixed(2)} s`, text);
    return { done: tour.t >= tour.seconds - 1e-6, caption: text };
  };

  window.__info = () => { render(); const { calls, triangles } = renderer.info.render; return { calls, triangles }; };
  window.__stats = items.flatMap((it) => it.members.map((m) => ({ id: it.id, ...m.person.stats, kind: m.person.look.kind, h: +m.person.look.height.toFixed(2) })));
  window.__items = items;
  window.__kit = kit;
  window.__scene = scene;
  window.__render = render;
  window.__camera = camera;
  await window.__shot(sceneId === 'fair' ? 'fair-day' : town ? 'wave' : 'lineup-day');
  window.__ready = true;
</script>
</body>
</html>
