<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traversal yard</title>
<!-- The traversal moves' picture page (Rooftops step 1): the test yard
     (src/world/traversalyard.js) drawn through the game's rig, with the real
     cat, the real player and the real moves runtime (src/traversallive.js),
     in main.js's frame order. For the before/after pictures and the two
     tours' films (scripts/record-page.mjs makes them headless). No sound.
     URL params:
       traversal=0          the "before": NO_TRAVERSAL, and the jump is the ordinary pounce
       rm=1                 reduced motion (the moves, the player, the pose, the pounce)
       abilities=longleap,steady,spring   any of the three (Long Leap, Tightrope Tail's
                            steadiness, Spring Paws' 2.2 m climb and higher pounce)
       tour=climbs|leaps    play that tour in real time (YARD_TOURS, driven by createYardPilot)
       area=roofs           the Rooftops (Rooftops step 2) instead of the yard, in its full
                            evening (applyDusk, its life run on to 240 s and on with the
                            frames: the bus runs); tour=firstRoof|terrace|birds (ROOFS_TOURS;
                            birds: after the guide pigeon over plank-3, best with critters=1).
                            Tours and free play only: the shots are the yard's
       critters=1           (area=roofs) the walk's real critters (createCritters, the roof
                            birds among them) handed to the life with visits 0, so the flock
                            flies: she flushes them, the guide leads. The guide's memory is
                            in-memory: the page never reads or writes the device's key, and
                            the guide always starts in the alley
       drive=1              no rAF loop: window.__frame() drives
       size=WxH             the picture's size (default 960x540)
       tail=s               the film runs on s seconds after a tour ends (default 1)
       bare                 no HUD (the tour's caption still shows)
     With no tour she starts at the yard's spawn: the arrows or W-A-S-D walk
     her, Space jumps (a move at a mark, else the ordinary pounce).
     Window API:
       __ready              true after the first frame
       __shot(name) → name  sets up one shot (SHOTS below: a start, a facing, the view
                            behind her, a push or a press), runs it in fixed 1/30 s
                            steps to its moment, renders. A shot that never reaches its
                            moment (8 s) is logged with console.error and drawn anyway
       __tour(name) → name  starts a tour from its start, for __frame to drive
       __frame() → { done, caption }   one fixed 1/30 s step (the tour's pilot first,
                            if one is running) plus a render
       __snap(q) → a JPEG data URL of the view
     Under traversal=0 a tour's move cannot happen. The page stops the tour
     gracefully instead: at a press the moves would have taken (after the
     ordinary pounce) or a walk that has stopped getting anywhere, she holds
     still, the caption says "Today she can't do this", and __frame goes on
     for a few seconds before saying done. With the moves on, a step the pilot
     gives up on (its 20 s limit) stops the tour the same way, with an error.
     The yard is built once per page load and reused by every shot and tour
     (buildTraversalYard has no dispose(); a before/after pair is two loads). -->
<style>
  html, body { margin: 0; background: #1c2431; overflow: hidden; font: 12px/1.35 Avenir, system-ui, sans-serif; color: #f1e0c2; }
  canvas { position: fixed; left: 0; top: 0; display: block; }
  #hud { position: fixed; left: 0; top: 0; padding: 6px 10px; background: rgba(20, 26, 36, .72); white-space: pre; pointer-events: none; }
  #caption { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; pointer-events: none; }
  #caption span { display: inline-block; padding: 6px 16px; border-radius: 8px; background: rgba(20, 26, 36, .78);
                  color: #fff6e6; font-size: 22px; font-weight: 600; }
  #caption:empty { display: none; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<div id="caption"></div>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier } from '/src/render/textures.js';
  import { createSun, createFill, DEFAULT_GROUND_BOUNCE, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { skyBackground } from '/src/render/sky.js';
  import { buildCat } from '/src/cat/model.js';
  import { animateCat } from '/src/cat/animator.js';
  import { createPlayer, pounceArc, POUNCE_HOP_TIME } from '/src/player.js';
  import { BASE_CLIMB_BUDGET, SPRING_PAWS_CLIMB } from '/src/climbing.js';
  import { createTraversalLive, NO_TRAVERSAL } from '/src/traversallive.js';
  import { facingYaw, behindYaw, stickToWorld } from '/src/traversal.js';
  import { buildTraversalYard, YARD_SPAWN, YARD_TOURS, createYardPilot } from '/src/world/traversalyard.js';
  import { build as buildRoofs } from '/src/world/roofs.js';
  import { ROOFS_SPAWN, ROOFS_TOURS } from '/src/world/roofsplan.js';
  import { applyDusk, duskEnv, createLampPools } from '/src/render/dusk.js';
  import { createCritters } from '/src/critters.js';
  import { mulberry32 } from '/src/rng.js';

  const params = new URLSearchParams(location.search);
  const ROOFS = params.get('area') === 'roofs';
  const TOURS = ROOFS ? ROOFS_TOURS : YARD_TOURS;
  const SPAWN = ROOFS ? ROOFS_SPAWN : YARD_SPAWN;
  const MOVES = params.get('traversal') !== '0';
  const rm = params.get('rm') === '1';
  const asked = new Set((params.get('abilities') || '').split(',').map((s) => s.trim()).filter(Boolean));
  const [W, H] = (params.get('size') || '960x540').split('x').map(Number);
  const DRIVE = params.get('drive') === '1';
  const BARE = params.has('bare');
  const DT = 1 / 30; // the fixed step of shots, tours and __frame
  const SHOT_LIMIT = 8; // s
  const BREED = 'tabby';
  const PACE = 3.5; // her walk, m/s (main.js's catPace)
  const SKY = { top: 0x86b4e2, horizon: 0xdde8ee };
  const CANT = "Today she can't do this";
  const REFUSE_HOLD = 1.2; // s after the ordinary pounce at a press the moves would have taken
  const STUCK = { time: 2.5, dist: 0.1 }; // s, m: a walk that has stopped getting anywhere (traversal=0 only)
  // s of film after the tour ends (?tail=s for longer: the life runs on, she stands) / after a graceful stop
  const TAIL = { done: params.has('tail') ? Number(params.get('tail')) : 1.0, stopped: 3.0 };

  // The abilities the moves read (src/traversal.js's BASE_ABILITIES shape).
  const URL_ABILITIES = Object.freeze({
    steady: asked.has('steady'),
    longLeap: asked.has('longleap'),
    climb: asked.has('spring') ? SPRING_PAWS_CLIMB : BASE_CLIMB_BUDGET.climb,
  });
  let abilities = URL_ABILITIES;
  // The ordinary pounce's arc (Spring Paws' with ?abilities=spring).
  const ARC = pounceArc(asked.has('spring') ? { skills: ['spring-paws'] } : null, { reducedMotion: rm });

  // ---- The rig, as verify-places.html builds it ----
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.prepend(renderer.domElement);
  const tier = { name: 'high', envIntensity: 0.45 };
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  scene.background = skyBackground(SKY.top, SKY.horizon);
  scene.fog = new THREE.Fog(SKY.horizon, 40, 120);
  const sun = createSun();
  scene.add(sun);
  const fill = createFill(DEFAULT_GROUND_BOUNCE);
  scene.add(fill);
  const area = ROOFS ? buildRoofs(scene) : buildTraversalYard(scene); // once per page load (no dispose(); see the header)
  if (ROOFS) {
    // the walk's evening look (game/walk.js's eveningLook), as verify-places.html gives it
    scene.environmentIntensity = duskEnv(scene.environmentIntensity, applyDusk({ scene, sun, fill, areaData: area }));
  }
  const cat = buildCat(BREED);
  scene.add(cat);
  // ?critters=1 (the Rooftops): the walk's critters, before the caster sweep as walk.js makes them
  const critters = ROOFS && params.get('critters') === '1'
    ? createCritters(scene, area.critterSpawns, { ground: area.ground, motionRng: mulberry32(7) })
    : null;
  const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
  const shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
  sun.shadow.bias = SUN_BIAS;
  assignShadowCasters(scene);
  // The Rooftops' life: the evening run on to its full dusk, then on with each
  // frame. With critters=1 it is handed them and visits 0, and an in-memory
  // guide store (the guide starts in the alley; nothing on the device changes).
  const memoryStore = (v = null) => ({ get: () => v, set: (x) => { v = x; } });
  const life = ROOFS
    ? area.life(critters ? { scene, sun, fill, critters, visits: 0, guideStore: memoryStore() } : { scene, sun, fill, guideStore: memoryStore() })
    : null;
  if (ROOFS) {
    createLampPools(scene);
    for (let k = 0; k < 240 * 30; k++) life.update(1 / 30);
  }

  // ---- The walk: the real player and the moves runtime ----
  const player = createPlayer(camera, renderer.domElement);
  player.setReducedMotion(rm);
  const session = { perched: null, fight: null, chasing: false, idleTime: 0 };
  const ctx = { cat, player, session };
  const events = [];
  let live = NO_TRAVERSAL;
  let t = 0;
  let pageJump = 0; // s left of the ordinary pounce's pose
  let pressT = 0; // t at the last press

  // A fresh walk at (x, z), facing (fx, fz), the view behind her.
  function reset(x, z, fx, fz) {
    live.dispose();
    abilities = URL_ABILITIES;
    live = MOVES
      ? createTraversalLive(area.traversal, { ground: area.ground, reducedMotion: rm, abilities: () => abilities, onEvent: (e) => events.push(e) })
      : NO_TRAVERSAL;
    events.length = 0;
    session.idleTime = 0;
    pageJump = 0;
    cat.position.set(x, area.ground.y(x, z), z);
    cat.rotation.set(0, facingYaw(fx, fz), 0);
    player.setAvatar(cat, PACE);
    player.setGround(area.ground);
    player.setViewYaw(behindYaw(fx, fz));
    player.enable();
    player.update(0, area.colliders, area.bounds, []); // the camera on her spot
    shadows.update(area.ground.y(x, z), 1e3); // the shadow fit settled on her level at once
  }

  // The jump button: the moves first (main.js's order, game/interactions.js),
  // else the ordinary pounce. True when the moves took it.
  function press() {
    pressT = t;
    if (live.jump(ctx)) return true;
    player.pounce(ARC);
    pageJump = POUNCE_HOP_TIME;
    return false;
  }

  // A world direction turned into a stick once with the yaw of the moment and
  // then held, as a child's thumb would be (test/helpers/traversalwalk.js).
  const stick = { x: 0, z: 0 };
  function push(wx, wz) {
    stickToWorld(wx, wz, -player.viewYaw(), stick);
    player.setTouchMove({ x: stick.x, z: stick.z, mag: Math.hypot(wx, wz) });
  }

  // One frame, as main.js orders it.
  function frame(dt) {
    t += dt;
    if (pageJump > 0) pageJump -= dt;
    live.update(dt, t, ctx);
    player.update(dt, area.colliders, area.bounds, []);
    player.speedFactor = 1; // game/avatar.js writes it after player.update
    animateCat(cat, pageJump > 0 ? 'pounce' : live.pose ?? 'follow', t, live.busy ? live.speed : player.speed, rm);
    cat.rotation.x = 0;
    cat.rotation.z = 0;
    live.late(dt, t, ctx);
    critters?.update(dt, t, cat.position, cat.position); // main.js's order: the critters, then the life
    life?.update(dt, t, cat.position, camera);
    shadows.update(area.ground.y(cat.position.x, cat.position.z), dt);
    render();
  }

  const hud = document.getElementById('hud');
  if (BARE) hud.remove();
  const captionEl = document.getElementById('caption');
  let caption = null;
  function setCaption(text) {
    if (text === caption) return;
    caption = text;
    captionEl.replaceChildren();
    if (text) {
      const span = document.createElement('span');
      span.textContent = text;
      captionEl.append(span);
    }
  }
  function render() {
    renderer.render(scene, camera);
    if (BARE) return;
    const p = cat.position;
    hud.textContent = [
      `moves ${MOVES ? 'on' : 'off (before)'}${rm ? ' · reduced motion' : ''} · abilities ${[...asked].join(',') || 'none'}`,
      `at ${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}`,
      `phase ${live.phase ?? '-'}${live.crossing ? ` on ${live.crossing.id}` : ''}${live.hop ? ` ${live.hop.id}` : ''} · progress ${live.progress.toFixed(2)}`,
      `last event ${events.length ? JSON.stringify(events[events.length - 1]) : '-'}`,
      tour ? '' : 'arrows or W-A-S-D walk · Space jumps',
    ].filter(Boolean).join('\n');
  }

  // ---- The shots ----
  const E = [1, 0], WEST = [-1, 0], N = [0, -1], S = [0, 1];
  const on = (id, p) => () => live.crossing?.id === id && live.progress >= p - 1e-9;
  const air = (p) => () => live.phase === 'air' && live.progress >= p - 1e-9;
  const after = (s) => () => t - pressT >= s - 1e-9;
  const inPhase = (ph, s = 0) => () => live.phase === ph && t - pressT >= s - 1e-9;
  // needs: 'before' (traversal=0) or an ability the URL must ask for.
  const SHOTS = {
    'before-plank': { needs: 'before', at: [-9.2, -13], face: E, push: true, until: after(1.5) },
    plank: { at: [-9.2, -13], face: E, push: true, until: on('plank-1', 0.5) },
    'plank-lean': { at: [-2.2, 6], face: WEST, push: true, until: on('plank-2', 0.5) },
    line: { at: [-1.0, -9], face: WEST, push: true, until: on('line-1', 0.5) },
    ridge: { at: [7.0, -11], face: E, push: true, until: on('ridge-1', 0.6) },
    'before-climb': { needs: 'before', at: [-12, 9.4], face: N, until: after(0.15) },
    climb: { at: [-12, 9.4], face: N, until: air(0.6) },
    crouch: { at: [3, -7.0], face: S, until: inPhase('crouch', 0.35) },
    leap: { at: [3, -7.0], face: S, until: air(0.5) },
    land: { at: [3, -7.0], face: S, until: inPhase('land') },
    'leap-down': { at: [7.0, 0], face: E, until: air(0.5) },
    look: { at: [14, 3.2], face: S, until: inPhase('look', 0.5) },
    'long-leap': { needs: 'longleap', at: [14, 3.2], face: S, until: air(0.5) },
    drop: { at: [-12, -7.0], face: S, until: air(0.6) },
  };

  window.__shot = (name) => {
    if (ROOFS) throw new Error('the shots are the yard\'s: load the page without area=roofs');
    const shot = SHOTS[name];
    if (!shot) throw new Error(`no shot "${name}"; there are ${Object.keys(SHOTS).join(', ')}`);
    if (shot.needs === 'before' && MOVES) console.error(`shot ${name} is a "before": load the page with traversal=0`);
    if (shot.needs === 'longleap' && !abilities.longLeap) console.error(`shot ${name} needs abilities=longleap`);
    if (shot.needs !== 'before' && !MOVES) console.error(`shot ${name} needs the moves: load the page without traversal=0`);
    tour = null;
    setCaption(null);
    reset(shot.at[0], shot.at[1], shot.face[0], shot.face[1]);
    pressT = t;
    if (shot.push) push(shot.face[0], shot.face[1]);
    else press();
    let reached = false;
    for (let k = 0; k < SHOT_LIMIT / DT; k++) {
      frame(DT);
      if (shot.until()) { reached = true; break; }
    }
    if (!reached) console.error(`shot ${name} never reached its moment in ${SHOT_LIMIT} s (phase ${live.phase}, progress ${live.progress.toFixed(2)})`);
    player.setTouchMove(null);
    render();
    return name;
  };

  // ---- The tours ----
  let tour = null; // { name, pilot, stopped, ended, ... } while one runs

  // The runtime as the pilot sees it. Under traversal=0 its jump is the page's
  // ordinary pounce, once, and the press is never "taken": the tour stops
  // REFUSE_HOLD s later (see tourStep).
  function pilotLive() {
    if (MOVES) return live;
    return {
      get busy() { return false; }, get crossing() { return null; }, get hop() { return null; }, get looking() { return null; },
      jump() {
        if (tour.refusedAt === null) { press(); tour.refusedAt = t; }
        return false;
      },
    };
  }

  window.__tour = (name) => {
    const spec = TOURS[name];
    if (!spec) throw new Error(`no tour "${name}"; there are ${Object.keys(TOURS).join(', ')}`);
    reset(spec.start.x, spec.start.z, spec.start.face[0], spec.start.face[1]);
    const pilot = createYardPilot(spec, { setAbilities: (a) => { abilities = { ...URL_ABILITIES, ...a }; } });
    tour = { name, pilot, stopped: null, ended: null, refusedAt: null, anchor: { x: cat.position.x, z: cat.position.z, t } };
    tour.w = { cat, player, ctx, live: pilotLive() };
    setCaption(null);
    render();
    return name;
  };

  // Hold her still and say so; the film goes on for TAIL.stopped.
  function stopTour(text) {
    tour.stopped = t;
    player.setTouchMove(null);
    player.halt();
    setCaption(text);
  }

  function tourStep() {
    if (tour.stopped === null && tour.ended === null) {
      const r = tour.pilot.step(DT, tour.w);
      setCaption(r.caption);
      if (r.done && r.failed !== null) {
        console.error(`tour ${tour.name}: the pilot gave up on step ${r.failed}`);
        stopTour(MOVES ? `The tour stopped here (step ${r.failed})` : CANT);
      } else if (r.done) tour.ended = t;
    }
    frame(DT);
    if (tour.stopped === null && tour.ended === null && !MOVES) {
      // The "before": a press the moves would have taken, or a walk that
      // has stopped getting anywhere.
      const a = tour.anchor;
      if (Math.hypot(cat.position.x - a.x, cat.position.z - a.z) > STUCK.dist) { a.x = cat.position.x; a.z = cat.position.z; a.t = t; }
      if (tour.refusedAt !== null && t - tour.refusedAt >= REFUSE_HOLD - 1e-9) stopTour(CANT);
      else if (t - a.t >= STUCK.time - 1e-9) stopTour(CANT);
    }
    const done = (tour.ended !== null && t - tour.ended >= TAIL.done - 1e-9)
      || (tour.stopped !== null && t - tour.stopped >= TAIL.stopped - 1e-9);
    return { done, caption };
  }

  window.__frame = () => {
    if (tour) return tourStep();
    frame(DT);
    return { done: false, caption };
  };
  window.__snap = (q = 0.85) => { render(); return renderer.domElement.toDataURL('image/jpeg', q); };
  window.__live = () => live;
  window.__events = events;
  window.__player = player;
  window.__cat = cat;

  // Space: the jump (the player itself already keeps Space from scrolling).
  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' || e.repeat || tour) return;
    e.preventDefault();
    press();
  });

  // ---- Start ----
  const tourName = params.get('tour');
  if (tourName) window.__tour(tourName);
  else reset(SPAWN.x, SPAWN.z, 0, -1);
  render();
  window.__ready = true;

  if (!DRIVE) {
    // Real time: a tour in fixed steps of the time that has passed; free play
    // at the frame's own (capped) dt.
    const clock = new THREE.Clock();
    let owed = 0;
    let finished = false;
    const loop = () => {
      requestAnimationFrame(loop);
      const dt = Math.min(clock.getDelta(), 0.1);
      if (!tour) { frame(Math.min(dt, 0.05)); return; }
      if (finished) return;
      owed += dt;
      while (owed >= DT && !finished) {
        owed -= DT;
        finished = tourStep().done;
      }
    };
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
