<!doctype html>
<meta charset="utf-8">
<title>Place pictures</title>
<style>
  body { margin: 0; background: #1c2431; font: 12px Avenir, sans-serif; color: #f1e0c2; }
  #hud { padding: 6px 10px; }
</style>
<div id="hud">loading…</div>
<script type="module">
  // Snaps the destination-card pictures for the dressing room (v21 Stream 5).
  // One area per load: verify-places.html?area=park. Builds the area with the
  // game's own rig (walk.js's order: sun, build, fill, shadow fit, casters)
  // and frames a fixed, flattering view (VIEWS below). window.__snap()
  // returns the JPEG as a data URL; the pictures are saved to public/places/.
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier, setTextureAnisotropy } from '/src/render/textures.js';
  import { createWind } from '/src/render/wind.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createStripTiles } from '/src/render/striptiles.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { createGrass } from '/src/render/grass.js';
  import { createPawPrints } from '/src/render/pawprints.js';
  import { createClouds } from '/src/render/clouds.js';
  import { skyBackground } from '/src/render/sky.js';
  import { createAmbient } from '/src/render/ambient.js';
  import { LADDER } from '/src/render/quality.js';
  import * as neighborhood from '/src/world/neighborhood.js';
  import * as park from '/src/world/park.js';
  import * as seaside from '/src/world/seaside.js';
  import * as docks from '/src/world/docks.js';
  import * as woods from '/src/world/woods.js';
  import * as river from '/src/world/river.js';
  import * as moor from '/src/world/moor.js';
  import * as pines from '/src/world/pines.js';
  import * as gorge from '/src/world/gorge.js';
  import * as farm from '/src/world/farm.js';
  import * as fair from '/src/world/fair.js';
  import * as roofs from '/src/world/roofs.js';
  import { ROOFS_REGISTRATION, ROOFS_SHOTS, ROOFS_SHOT_T, ROOFS_LIFE_SHOTS, ROOFS_MOMENT_SHOTS, TELESCOPE_CRATE } from '/src/world/roofsplan.js';
  import { createGoldMice } from '/src/goldmice.js';
  import { groundOf } from '/src/ground.js';
  import { GUIDE, perchIndex } from '/src/world/roofsflock.js';
  import { applyDusk, duskEnv, createLampPools } from '/src/render/dusk.js';
  import { createFarmAnimals } from '/src/farmanimals.js';
  import { buildCat } from '/src/cat/model.js';
  import { animateCat } from '/src/cat/animator.js';

  const AREAS = { neighborhood, park, seaside, docks, woods, river, moor, pines, gorge, farm, fair, roofs };
  const id = new URLSearchParams(location.search).get('area') || 'neighborhood';
  // ?size=WxH renders bigger than the card pictures (for looking, not shipping).
  const [W, H] = (new URLSearchParams(location.search).get('size') || '640x360').split('x').map(Number);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  setTextureAnisotropy(Math.min(4, renderer.capabilities.getMaxAnisotropy()));
  document.body.appendChild(renderer.domElement);

  const tier = { name: 'high', envIntensity: 0.45 };
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  const sun = createSun();
  scene.add(sun);
  const wind = createWind({ reducedMotion: true });
  const area = AREAS[id].build(scene, { water: { quality: tier, reducedMotion: true }, wind });
  const fill = createFill(area.groundBounce);
  scene.add(fill);
  // An area that is always evening (area.evening, the Rooftops) gets the walk's
  // evening look (game/walk.js's eveningLook): render/dusk.js's light, sky, fog,
  // windows and lamps, and the image light dimmed. Its life (area.life, the
  // evening deepening and the bus) is made after the caster sweep, below.
  const evening = area.evening === true;
  if (evening) {
    const look = applyDusk({ scene, sun, fill, areaData: area });
    scene.environmentIntensity = duskEnv(scene.environmentIntensity, look);
  }
  if (id === 'fair') fair.setFairGlow(area, Number(new URLSearchParams(location.search).get('glow') || 0)); // &glow=1 lights the bulbs
  if (new URLSearchParams(location.search).has('nofog')) scene.fog = null; // for a picture from high above

  // ?animals (the Farm only) adds its animals (src/farmanimals.js) and a cat,
  // before the caster sweep as walk.js does. window.__farmStep(seconds, cat)
  // runs them on; cat = { x, z, running, inWater, on: 'cow-1', pose, yaw }
  // puts the cat somewhere (on: a cow's back) in a pose. window.__farm is the
  // animals, to move one by hand.
  const farmAnimals = id === 'farm' && new URLSearchParams(location.search).has('animals')
    ? createFarmAnimals(scene, area, { reducedMotion: false }) : null;
  const farmCat = farmAnimals ? buildCat(new URLSearchParams(location.search).get('breed') || 'tabby') : null;
  if (farmCat) { farmCat.position.set(0, 0, 46); scene.add(farmCat); }
  window.__farm = farmAnimals;
  window.__farmCat = farmCat;
  let farmT = 0;
  window.__farmStep = (seconds = 0, spec = {}) => {
    const cow = spec.on ? farmAnimals.sim.cows.find((c) => c.id === spec.on) : null;
    const session = { perched: cow ? cow.perch : spec.perched ? {} : null, pounceTime: 0 };
    const player = { speed: spec.speed ?? 0, zooming: !!spec.running, inWater: !!spec.inWater };
    if (spec.x !== undefined) farmCat.position.set(spec.x, 0, spec.z);
    if (spec.yaw !== undefined) farmCat.rotation.y = spec.yaw;
    const vx = spec.vx ?? 0, vz = spec.vz ?? 0;
    for (let s = 0; s <= seconds; s += 1 / 30) {
      farmT += 1 / 30;
      farmCat.position.x += vx / 30; farmCat.position.z += vz / 30;
      farmAnimals.update(1 / 30, farmT, { cat: farmCat, player, session });
    }
    farmCat.position.y = cow ? cow.perch.y : spec.inWater ? -0.18 : 0;
    animateCat(farmCat, spec.pose ?? (cow ? 'perch' : 'follow'), farmT, player.speed, false);
    render();
    return farmAnimals.sim.all.map((a) => `${a.id} ${a.x.toFixed(1)},${a.z.toFixed(1)} ${a.mode ?? ''}`).join(' | ');
  };
  const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 300);
  const shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
  sun.shadow.bias = SUN_BIAS;
  assignShadowCasters(scene);
  // The evening's life, run on to a walk second in 1/30 s frames (the sum of dt
  // is its walk time). The page's own view is the card view, taken at sunset
  // (ROOFS_SHOT_T.card); ?evening=s for another moment. The life only runs
  // forward, so a shot at an earlier time rebuilds it from the start (the sun
  // and fill put back first). The lamp pools are added after the caster sweep,
  // as walk.js does.
  //   The Rooftops' life is handed the walk's shape (roofslife.js): every
  // update gets dt, the walk second, a stand-in cat spot far from every bird
  // (FAR) and the camera. Its critters are stand-ins, one per roof bird (an
  // empty group and its anchors, never in the scene: nothing more is drawn),
  // so __flush can send a bird off as critters.js would; nothing else
  // flushes one. The guide's memory is in-memory (memoryStore), so a picture
  // never reads or writes the device's key and the guide always starts in
  // the alley.
  const EVENING_DUSK = 240; // s (src/roofslife.js EVENING_RAMP): full dusk
  const evParam = new URLSearchParams(location.search).get('evening');
  const EVENING_T = evParam !== null ? Number(evParam) : id === 'roofs' ? ROOFS_SHOT_T.card : EVENING_DUSK;
  const sun0 = sun.intensity, fill0 = fill.intensity;
  const FAR = Object.freeze({ x: 0, y: 0, z: 1000 }); // m: no bird sees her, none is flushed
  const memoryStore = (v = null) => ({ get: () => v, set: (x) => { v = x; } });
  let standIns = [];
  const makeLife = () => {
    if (!evening || !area.life) return null;
    standIns = (area.critterSpawns ?? []).filter((s) => s.roofBird).map((s) => ({
      def: { roofBird: s.roofBird }, group: new THREE.Group(), anchor: new THREE.Vector3(), anchorHome: new THREE.Vector3(), fleeing: false, cooldown: 0,
    }));
    return area.life({ scene, sun, fill, critters: { list: standIns }, visits: 0, guideStore: memoryStore() });
  };
  let life = makeLife();
  let lifeT = 0;
  let lifeStirred = false; // a bird has been flushed: the next shot starts the life again
  const lifeStep = (dt, cat = FAR) => { life?.update(dt, lifeT + dt, cat, camera); lifeT += dt; };
  const lifeTo = (t) => {
    if (t < lifeT - 1e-9 || lifeStirred) { life?.dispose?.(); sun.intensity = sun0; fill.intensity = fill0; life = makeLife(); lifeT = 0; lifeStirred = false; }
    while (lifeT < t - 1e-9) lifeStep(Math.min(1 / 30, t - lifeT));
  };
  lifeTo(EVENING_T);
  if (evening) createLampPools(scene);
  // Bigger areas: with ?grow=1 an area that has strips builds with them
  // (src/grow.js reads the address). ?strips=all draws every tile at once,
  // ?strips=x,z the tiles a cat at (x, z) would have; window.__strips(x, z)
  // moves that cat. ?nofog takes the haze away (an overview from high up).
  const stripsAt = new URLSearchParams(location.search).get('strips');
  const stripTiles = area.strips && stripsAt ? createStripTiles(scene, {
    strips: stripsAt === 'all'
      ? area.strips.map((st) => ({ ...st, layers: [{ id: 'small', show: 1e9, hide: 2e9 }, { id: 'trees', show: 1e9, hide: 2e9 }] }))
      : area.strips,
    wind, reducedMotion: true,
  }) : null;
  window.__strips = (x, z) => { stripTiles?.settle(x, z); render(); return stripTiles ? JSON.stringify(stripTiles.stats) : 'no strips'; };
  if (stripTiles) stripTiles.settle(...(stripsAt === 'all' ? [0, 0] : stripsAt.split(',').map(Number)));
  if (new URLSearchParams(location.search).has('nofog')) scene.fog = null;
  // ?grass[=low] adds walk.js's lawn tufts (render/grass.js), after the caster
  // sweep exactly as walk.js does. Off by default so the shipped place
  // pictures stay reproducible.
  const params0 = new URLSearchParams(location.search);
  const grass = params0.has('grass')
    ? createGrass(scene, { areaId: id, areaData: area, tier: LADDER[params0.get('grass') === 'low' ? 3 : 0], camera, hooks: AREAS[id]?.GRASS_HOOKS })
    : null;
  // ?paws[=low] lays a short hand-placed trail of paw prints
  // (render/pawprints.js) by walking an invisible cat along PAW_TRAILS at a
  // trot, through the same update() walk.js's render loop calls. The trail is
  // a few seconds old at the start, so the far end shows the fade.
  // window.__pawsAge(s) ages every print by s seconds and re-renders.
  // Each area is a list of polylines; the cat hops (no prints) between them.
  const PAW_TRAILS = {
    seaside: [[[9, 36], [13, 32], [16.5, 31]], [[23.2, 33], [24.4, 26], [24.2, 21]]], // dry sand; wet sand
    docks: [[[-6, 14], [-6, 9.5], [-3, 6.5], [3, 6.5]]], // cobbles -> pavement -> quay
    park: [[[0, 40], [0, 30]]], // gravel path
    neighborhood: [[[0, 14], [0, 4]]], // gravel road
  };
  const paws = params0.has('paws')
    ? createPawPrints(scene, { areaId: id, areaData: area, tier: LADDER[params0.get('paws') === 'low' ? 3 : 0] })
    : null;
  for (const pts of paws ? PAW_TRAILS[id] ?? [] : []) {
    const dt = 1 / 60;
    paws.update(dt, { x: pts[0][0], z: pts[0][1], grounded: false }); // land here
    for (let k = 1; k < pts.length; k++) {
      const [x0, z0] = pts[k - 1];
      const [x1, z1] = pts[k];
      const n = Math.ceil(Math.hypot(x1 - x0, z1 - z0) / (2.5 * dt));
      for (let i = 0; i <= n; i++) {
        paws.update(dt, { x: x0 + (x1 - x0) * i / n, z: z0 + (z1 - z0) * i / n, grounded: true });
      }
    }
  }
  window.__paws = paws;
  window.__pawsAge = (s) => { paws?.update(s, {}); render(); };
  // ?clouds[=low] adds walk.js's drifting sky clouds (render/clouds.js), after
  // the caster sweep as walk.js does; &dusk swaps in the area's dusk sky and
  // fog first (walk.js's dusk block). window.__cloudT drives their drift.
  if (params0.has('dusk') && !evening) {
    scene.background = skyBackground(area.skyDusk.top, area.skyDusk.horizon);
    scene.fog = new THREE.Fog(area.skyDusk.horizon, 30, 110);
    sun.intensity = 0.7;
  }
  const b0 = area.bounds;
  const clouds = params0.has('clouds')
    ? createClouds(scene, {
      areaId: id, tier: LADDER[params0.get('clouds') === 'low' ? 3 : 0], camera, dusk: params0.has('dusk') || evening,
      centre: { x: (b0.minX + b0.maxX) / 2, z: (b0.minZ + b0.maxZ) / 2 },
    })
    : null;
  window.__cloudT = 0;
  // ?ambient[=low] adds walk.js's ambient particles (render/ambient.js), also
  // after the caster sweep. ?dusk also asks for the dusk effect (the Docks'
  // moths). window.__ambientStep(seconds) runs the simulation on
  // from __grassT in 1/30s steps, since leaves and mist are stateful.
  // (?dusk is applied once, above, the way walk.js does it.)
  const dusk = params0.has('dusk') || evening;
  const ambient = params0.has('ambient')
    ? createAmbient(scene, {
      areaId: id, areaData: area, tier: LADDER[params0.get('ambient') === 'low' ? 3 : 0], camera, dusk,
    })
    : null;
  window.__ambient = ambient;
  window.__ambientStep = (seconds = 1) => {
    for (let s = 0; s < seconds; s += 1 / 30) {
      window.__grassT += 1 / 30;
      ambient?.update(window.__grassT, 1);
    }
    render();
    return ambient?.visibleCount ?? 0;
  };
  window.__grassT = 0;
  window.__scene = scene; // for poking at the scene from the console
  const render = () => {
    shadows.update();
    grass?.update(window.__grassT, 1);
    clouds?.update(window.__cloudT);
    renderer.render(scene, camera);
    window.__calls = renderer.info.render.calls;
  };

  window.__cam = (px, py, pz, lx, ly, lz) => {
    camera.position.set(px, py, pz); camera.lookAt(lx, ly, lz); render();
    const hud = document.getElementById('hud');
    if (hud) hud.textContent = `${id} · ${[px, py, pz, lx, ly, lz].join(', ')}`;
    return id;
  };
  window.__snap = (q = 0.8) => { render(); return renderer.domElement.toDataURL('image/jpeg', q); };
  // ?cam=px,py,pz,lx,ly,lz overrides the area's view; ?bare hides the label so a headless screenshot is just the picture.
  const params = new URLSearchParams(location.search);
  // The views the shipped pictures were taken from (world coordinates).
  const VIEWS = {
    neighborhood: '1,4.5,47,-1,0.5,31',
    park: '-14,3.4,16,-14,0.2,0',
    // a marram clump close by, the boardwalk, the sea, boats and the cliff (the
    // old view '6,4.2,22,32,0.4,4' showed only bare sand and a speck of grass)
    seaside: '5,1.1,6,14,0.8,-2',
    docks: '0,3.6,16,0,0.4,0',
    // the spawn view: the chase camera behind the cat on the short path, looking
    // north up the north path (the shipped card picture). The clearing's view up
    // the glade path to the log bridge is '2,1.2,4,-4.5,0.3,-12'.
    woods: '44,2.9,16.5,44,0.4,4',
    // pool-1 with its lily pads and reeds, willows behind (the card picture); the
    // bank-path view '-6,1.4,6,-20,0.4,-26' was mostly bare grass
    river: '-24,1.8,9,-33,0.5,15',
    // over the river bend from its north-east bank: the log bridge, the bridge
    // path, heather and thorns, the lake and the island's tree beyond (the card
    // picture). The first view, high path '24,3.0,-22,-10,0.4,12', was half
    // sky over bare grass
    moor: '24,4.5,-14,4,0.3,6',
    // from the truce path's last bend, looking down the bay to the island and
    // its bridge
    pines: '-6,1.6,-2,28,1.0,28',
    // high over the gorge's north end, looking south down the floor: the
    // stream, the path, the stepping stones and pines (the card picture). The
    // first view, from the clifftop's lip '3,13.8,-26,-8,2,20', was half bare
    // rock
    gorge: '-3,15,-40,-6,0,0',
    // from the yard's east side: the red barn with its hay bales and open hay
    // door, the hen coop and the goat paddock to the left, the wheat and the
    // scarecrow to the right (the card picture)
    farm: '9.5,2.2,6,0.5,2.4,-12',
    fair: fair.FAIR_REGISTRATION.view,
    // from the alley, up at the terrace backs and the clock tower (the card picture)
    roofs: ROOFS_REGISTRATION.view,
  };
  const c = (params.get('cam') || VIEWS[id]).split(',').map(Number);
  if (params.has('bare')) document.getElementById('hud').remove();
  window.__cam(...c);
  // The picture views (scripts/record-page.mjs --shots): __shot(name) frames
  // the area's shot `name` (ROOFS_SHOTS for the Rooftops; 'view' is ?cam or VIEWS[id])
  // and answers the name. Each shot first puts the life at its walk second
  // (ROOFS_SHOT_T: the card at sunset, the edge's bus in the street; any other
  // shot at full dusk, or at ?evening when that is given). __info() renders and returns
  // renderer.info.render's { calls, triangles } (shadow passes included).
  //   The life's views (ROOFS_LIFE_SHOTS: { view, t }) are shots too, and so
  // are the harness's own LIFE_EXTRAS below, for the owner's pictures of the
  // life: each puts the camera first (the loft's pigeons look for it), runs
  // the life to its t, then any setup (a lead, flushes), and renders.
  const SHOTS = id === 'roofs' ? ROOFS_SHOTS : {};
  const SHOT_T = id === 'roofs' ? ROOFS_SHOT_T : {};
  // Harness only (never shipped): a bird sent off as critters.js sends one,
  // her stand-in spot `r` m from it at its height, `k` eighths of a turn round
  // from +x. __flush(birdId, k, r) flushes it and runs one frame with her
  // there; the life is started again at the next shot.
  const proxyOf = (birdId) => {
    const c = standIns.find((s) => s.def.roofBird === birdId);
    if (!c) throw new Error(`no roof bird "${birdId}"`);
    return c;
  };
  const near = (p, k, r = 2.4) => ({ x: p.x + r * Math.cos((k * Math.PI) / 4), y: p.y, z: p.z + r * Math.sin((k * Math.PI) / 4) });
  window.__flush = (birdId, k = 0, r = 2.4) => {
    const c = proxyOf(birdId);
    c.fleeing = true;
    c.cooldown = 18; // critters.js's, for a flushed bird
    lifeStirred = true;
    lifeStep(1 / 30, near(c.group.position, k, r));
    const p = c.group.position;
    return `${birdId} ${p.x.toFixed(2)},${p.y.toFixed(2)},${p.z.toFixed(2)}`;
  };
  // Where each roof bird is drawn now: 'id x,y,z' (its stand-in follows it).
  window.__birds = () => standIns.map((c) => `${c.def.roofBird} ${c.group.position.toArray().map((v) => v.toFixed(2)).join(',')}`).join(' | ');
  // The guide led along its whole route (GUIDE.route), her stand-in each time
  // 2.2 m behind it, on the side away from its next stop, until it lands.
  const perches = area.birdPerches ? perchIndex(area.birdPerches) : null;
  const lead = () => {
    const c = proxyOf(GUIDE.bird);
    lifeStirred = true;
    for (const stop of GUIDE.route) {
      const p = c.group.position;
      const n = perches.get(stop);
      const d = Math.hypot(n.x - p.x, n.z - p.z) || 1;
      const cat = { x: p.x - (2.2 * (n.x - p.x)) / d, y: p.y, z: p.z - (2.2 * (n.z - p.z)) / d };
      c.fleeing = true;
      c.cooldown = 18;
      for (let f = 0; f < 150 && c.fleeing; f++) lifeStep(1 / 30, cat);
      for (let f = 0; f < 15; f++) lifeStep(1 / 30); // she stays back a moment
    }
    const p = c.group.position;
    if (Math.hypot(p.x - perches.get(GUIDE.route.at(-1)).x, p.z - perches.get(GUIDE.route.at(-1)).z) > 0.05) console.error('the guide never reached the end of its route');
  };
  // The extras: { view, t, lead, flush: [[birdId, k]], after (s) }. A clip
  // (__tour, below) flushes at `at` s into it and runs `len` s.
  const LIFE_EXTRAS = id === 'roofs' ? {
    // two pigeons off at once over the flat roofs: one along the back gutter
    // (west), one off a chimney's aerial along the ridge (east)
    takeoff: { view: '6.5,7.4,15.0,11,8.9,8.5', t: 240, flush: [['pigeon-4', 0], ['pigeon-5', 2]], after: 0.6, len: 4.5, at: 1 },
    // close by the guide pigeon waiting on plank-3's far end, after it has led her there
    guideplank: { view: '14.9,4.3,22.2,16,3.7,19.4', t: 240, lead: true },
    // the gull on the warehouse's east parapet, and the same view as it flutters
    // off west along the north parapet
    gullperch: { view: '36.5,13.4,-39.5,33,12,-49', t: 240 },
    gull: { view: '36.5,13.4,-39.5,33,12,-49', t: 240, flush: [['gull-1', 5]], after: 0.6, len: 4, at: 1 },
    // the ginger cat asleep on its sill over the east yards, from over ext-11 (its face's side)
    ginger: { view: '22.9,5.5,14.9,24.25,4.4,12.2', t: 240 },
  } : {};
  // What the harness does after a life view's t: plank-3's far end shows the
  // guide having led her there (it waits on plank-3:1).
  const LIFE_SETUP = { plank: { lead: true } };
  // The moments (ROOFS_MOMENT_SHOTS, Rooftops step 5): a stand-in cat, drawn,
  // at the discovery's anchor (on the telescope's crate, perched; still for
  // the chimney's ring), and a stand-in session. The life is run to the
  // shot's t with her far away, then `dwell` s with her there, so the moment
  // has started (the moon in, the ring up, the camera eased round, the
  // pigeon along). The names win over a life view of the same name.
  const DWELL = { garden: 1, loft: 8, vane: 4, skylight: 1, telescope: 2, chimney: 3 };
  const STAND_DZ = { skylight: -0.85 }; // on the frame's north edge, so the pane shows (still within the find's 1.0 m)
  let momentCat = null;
  let momentMice = null;
  const clearMoment = () => {
    if (momentCat) { scene.remove(momentCat); momentCat = null; }
    if (momentMice) { momentMice.dispose?.(); momentMice = null; }
  };
  const stand = (name) => {
    clearMoment();
    if (name === 'mice') {
      momentMice = createGoldMice(scene, 'roofs', new Set(), { ground: groundOf(area), rng: () => 0.25 });
      momentMice.update(0);
      return;
    }
    const a = area.anchors.discoveries[name];
    const perched = name === 'telescope' ? { x: TELESCOPE_CRATE.x, z: TELESCOPE_CRATE.z, y: TELESCOPE_CRATE.s } : null;
    const spot = { x: perched ? perched.x : a.x, y: a.y + (perched ? perched.y : 0), z: (perched ? perched.z : a.z) + (STAND_DZ[name] ?? 0) };
    momentCat = buildCat('tabby');
    momentCat.position.set(spot.x, spot.y, spot.z);
    momentCat.rotation.y = name === 'vane' ? 0 : name === 'telescope' ? -2.6 : 0.8;
    scene.add(momentCat);
    lifeStirred = true; // the next shot starts the life again
    const session = { perched, pounceTime: 0, traversal: { busy: false } };
    for (let f = 0; f < DWELL[name] * 30; f++) {
      life?.update(1 / 30, lifeT + 1 / 30, spot, camera, session);
      lifeT += 1 / 30;
    }
    animateCat(momentCat, perched ? 'perch' : 'follow', lifeT, 0, false);
  };
  const lifeShot = (name) => (id === 'roofs' ? ROOFS_MOMENT_SHOTS[name] ?? (ROOFS_LIFE_SHOTS[name] && { ...ROOFS_LIFE_SHOTS[name], ...LIFE_SETUP[name] }) ?? LIFE_EXTRAS[name] ?? null : null);
  const stir = (s) => {
    if (s.lead) lead();
    for (const [birdId, k] of s.flush ?? []) window.__flush(birdId, k);
    if (s.flush) for (let f = 0; f < Math.round((s.after ?? 0) * 30); f++) lifeStep(1 / 30);
  };
  window.__shot = (name) => {
    const ls = lifeShot(name);
    const v = name === 'view' ? (params.get('cam') || VIEWS[id]) : ls ? ls.view : SHOTS[name];
    if (!v) throw new Error(`no shot "${name}" for ${id}; there are ${['view', ...Object.keys(SHOTS), ...Object.keys(ROOFS_LIFE_SHOTS), ...Object.keys(ROOFS_MOMENT_SHOTS), ...Object.keys(LIFE_EXTRAS)].join(', ')}`);
    window.__cam(...v.split(',').map(Number));
    if (id === 'roofs') {
      lifeTo(name === 'view' ? EVENING_T : ls ? ls.t : SHOT_T[name] ?? (evParam !== null ? EVENING_T : EVENING_DUSK));
      if (ls) stir(ls);
      clearMoment();
      if (id === 'roofs' && ROOFS_MOMENT_SHOTS[name]) {
        window.__cam(...v.split(',').map(Number));
        stand(name);
        render(); // the vane's camera is where the life eased it: not put back
        return name;
      }
    }
    window.__cam(...v.split(',').map(Number));
    return name;
  };
  // A short clip of a life extra (scripts/record-page.mjs --tour <name>):
  // __tour(name) puts the life at its t, then each __frame() is one 1/30 s
  // frame and a render; its flushes come `at` s in, and it is done at `len` s.
  let clip = null;
  window.__tour = (name) => {
    const s = LIFE_EXTRAS[name];
    if (!s?.len) throw new Error(`no clip "${name}"; there are ${Object.keys(LIFE_EXTRAS).filter((k) => LIFE_EXTRAS[k].len).join(', ')}`);
    window.__cam(...s.view.split(',').map(Number));
    lifeTo(s.t);
    clip = { s, n: 0, flushed: false };
    return name;
  };
  window.__frame = () => {
    const { s } = clip;
    clip.n++;
    if (!clip.flushed && clip.n / 30 >= s.at) {
      clip.flushed = true;
      for (const [birdId, k] of s.flush ?? []) window.__flush(birdId, k);
    } else lifeStep(1 / 30);
    render();
    return { done: clip.n / 30 >= s.len, caption: null };
  };
  window.__info = () => {
    render();
    const { calls, triangles } = renderer.info.render;
    return { calls, triangles };
  };
  window.__ready = true;
</script>
