<!doctype html>
<meta charset="utf-8">
<title>Place pictures</title>
<style>
  body { margin: 0; background: #1c2431; font: 12px Avenir, sans-serif; color: #f1e0c2; }
  #hud { padding: 6px 10px; }
</style>
<div id="hud">loading…</div>
<script type="module">
  // Snaps the destination-card pictures for the dressing room (v21 Stream 5).
  // One area per load: verify-places.html?area=park. Builds the area with the
  // game's own rig (walk.js's order: sun, build, fill, shadow fit, casters)
  // and frames a fixed, flattering view (VIEWS below). window.__snap()
  // returns the JPEG as a data URL; the pictures are saved to public/places/.
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier, setTextureAnisotropy } from '/src/render/textures.js';
  import { createWind } from '/src/render/wind.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { createGrass } from '/src/render/grass.js';
  import { createPawPrints } from '/src/render/pawprints.js';
  import { createClouds } from '/src/render/clouds.js';
  import { skyBackground } from '/src/render/sky.js';
  import { createAmbient } from '/src/render/ambient.js';
  import { LADDER } from '/src/render/quality.js';
  import * as neighborhood from '/src/world/neighborhood.js';
  import * as park from '/src/world/park.js';
  import * as seaside from '/src/world/seaside.js';
  import * as docks from '/src/world/docks.js';
  import * as woods from '/src/world/woods.js';
  import * as river from '/src/world/river.js';
  import * as moor from '/src/world/moor.js';

  const AREAS = { neighborhood, park, seaside, docks, woods, river, moor };
  const id = new URLSearchParams(location.search).get('area') || 'neighborhood';
  // ?size=WxH renders bigger than the card pictures (for looking, not shipping).
  const [W, H] = (new URLSearchParams(location.search).get('size') || '640x360').split('x').map(Number);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  setTextureAnisotropy(Math.min(4, renderer.capabilities.getMaxAnisotropy()));
  document.body.appendChild(renderer.domElement);

  const tier = { name: 'high', envIntensity: 0.45 };
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  const sun = createSun();
  scene.add(sun);
  const wind = createWind({ reducedMotion: true });
  const area = AREAS[id].build(scene, { water: { quality: tier, reducedMotion: true }, wind });
  scene.add(createFill(area.groundBounce));

  const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 300);
  const shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
  sun.shadow.bias = SUN_BIAS;
  assignShadowCasters(scene);
  // ?grass[=low] adds walk.js's lawn tufts (render/grass.js), after the caster
  // sweep exactly as walk.js does. Off by default so the shipped place
  // pictures stay reproducible.
  const params0 = new URLSearchParams(location.search);
  const grass = params0.has('grass')
    ? createGrass(scene, { areaId: id, areaData: area, tier: LADDER[params0.get('grass') === 'low' ? 3 : 0], camera })
    : null;
  // ?paws[=low] lays a short hand-placed trail of paw prints
  // (render/pawprints.js) by walking an invisible cat along PAW_TRAILS at a
  // trot, through the same update() walk.js's render loop calls. The trail is
  // a few seconds old at the start, so the far end shows the fade.
  // window.__pawsAge(s) ages every print by s seconds and re-renders.
  // Each area is a list of polylines; the cat hops (no prints) between them.
  const PAW_TRAILS = {
    seaside: [[[9, 36], [13, 32], [16.5, 31]], [[23.2, 33], [24.4, 26], [24.2, 21]]], // dry sand; wet sand
    docks: [[[-6, 14], [-6, 9.5], [-3, 6.5], [3, 6.5]]], // cobbles -> pavement -> quay
    park: [[[0, 40], [0, 30]]], // gravel path
    neighborhood: [[[0, 14], [0, 4]]], // gravel road
  };
  const paws = params0.has('paws')
    ? createPawPrints(scene, { areaId: id, areaData: area, tier: LADDER[params0.get('paws') === 'low' ? 3 : 0] })
    : null;
  for (const pts of paws ? PAW_TRAILS[id] ?? [] : []) {
    const dt = 1 / 60;
    paws.update(dt, { x: pts[0][0], z: pts[0][1], grounded: false }); // land here
    for (let k = 1; k < pts.length; k++) {
      const [x0, z0] = pts[k - 1];
      const [x1, z1] = pts[k];
      const n = Math.ceil(Math.hypot(x1 - x0, z1 - z0) / (2.5 * dt));
      for (let i = 0; i <= n; i++) {
        paws.update(dt, { x: x0 + (x1 - x0) * i / n, z: z0 + (z1 - z0) * i / n, grounded: true });
      }
    }
  }
  window.__paws = paws;
  window.__pawsAge = (s) => { paws?.update(s, {}); render(); };
  // ?clouds[=low] adds walk.js's drifting sky clouds (render/clouds.js), after
  // the caster sweep as walk.js does; &dusk swaps in the area's dusk sky and
  // fog first (walk.js's dusk block). window.__cloudT drives their drift.
  if (params0.has('dusk')) {
    scene.background = skyBackground(area.skyDusk.top, area.skyDusk.horizon);
    scene.fog = new THREE.Fog(area.skyDusk.horizon, 30, 110);
    sun.intensity = 0.7;
  }
  const b0 = area.bounds;
  const clouds = params0.has('clouds')
    ? createClouds(scene, {
      areaId: id, tier: LADDER[params0.get('clouds') === 'low' ? 3 : 0], camera, dusk: params0.has('dusk'),
      centre: { x: (b0.minX + b0.maxX) / 2, z: (b0.minZ + b0.maxZ) / 2 },
    })
    : null;
  window.__cloudT = 0;
  // ?ambient[=low] adds walk.js's ambient particles (render/ambient.js), also
  // after the caster sweep. ?dusk also asks for the dusk effect (the Docks'
  // moths). window.__ambientStep(seconds) runs the simulation on
  // from __grassT in 1/30s steps, since leaves and mist are stateful.
  // (?dusk is applied once, above, the way walk.js does it.)
  const dusk = params0.has('dusk');
  const ambient = params0.has('ambient')
    ? createAmbient(scene, {
      areaId: id, areaData: area, tier: LADDER[params0.get('ambient') === 'low' ? 3 : 0], camera, dusk,
    })
    : null;
  window.__ambient = ambient;
  window.__ambientStep = (seconds = 1) => {
    for (let s = 0; s < seconds; s += 1 / 30) {
      window.__grassT += 1 / 30;
      ambient?.update(window.__grassT, 1);
    }
    render();
    return ambient?.visibleCount ?? 0;
  };
  window.__grassT = 0;
  window.__scene = scene; // for poking at the scene from the console
  const render = () => {
    shadows.update();
    grass?.update(window.__grassT, 1);
    clouds?.update(window.__cloudT);
    renderer.render(scene, camera);
    window.__calls = renderer.info.render.calls;
  };

  window.__cam = (px, py, pz, lx, ly, lz) => {
    camera.position.set(px, py, pz); camera.lookAt(lx, ly, lz); render();
    const hud = document.getElementById('hud');
    if (hud) hud.textContent = `${id} · ${[px, py, pz, lx, ly, lz].join(', ')}`;
    return id;
  };
  window.__snap = (q = 0.8) => { render(); return renderer.domElement.toDataURL('image/jpeg', q); };
  // ?cam=px,py,pz,lx,ly,lz overrides the area's view; ?bare hides the label so a headless screenshot is just the picture.
  const params = new URLSearchParams(location.search);
  // The views the shipped pictures were taken from (world coordinates).
  const VIEWS = {
    neighborhood: '1,4.5,47,-1,0.5,31',
    park: '-14,3.4,16,-14,0.2,0',
    seaside: '6,4.2,22,32,0.4,4',
    docks: '0,3.6,16,0,0.4,0',
    // the spawn view: the chase camera behind the cat on the short path, looking
    // north up the north path (the shipped card picture). The clearing's view up
    // the glade path to the log bridge is '2,1.2,4,-4.5,0.3,-12'.
    woods: '44,2.9,16.5,44,0.4,4',
    // pool-1 with its lily pads and reeds, willows behind (the card picture); the
    // bank-path view '-6,1.4,6,-20,0.4,-26' was mostly bare grass
    river: '-24,1.8,9,-33,0.5,15',
    // over the river bend from its north-east bank: the log bridge, the bridge
    // path, heather and thorns, the lake and the island's tree beyond (the card
    // picture). The first view, high path '24,3.0,-22,-10,0.4,12', was half
    // sky over bare grass
    moor: '24,4.5,-14,4,0.3,6',
  };
  const c = (params.get('cam') || VIEWS[id]).split(',').map(Number);
  if (params.has('bare')) document.getElementById('hud').remove();
  window.__cam(...c);
</script>
