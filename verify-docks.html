<!doctype html>
<meta charset="utf-8">
<title>Docks visual pilot</title>
<style>
  body { margin: 0; background: #4e4e58; font: 12px Avenir, sans-serif; }
  #hud { position: fixed; bottom: 8px; left: 8px; color: #fff; background: rgba(0,0,0,.6);
         padding: 6px 10px; border-radius: 8px; z-index: 5; }
</style>
<div id="hud">loading…</div>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier, setTextureAnisotropy } from '/src/render/textures.js';
  import { waterRig } from '/src/render/water.js';
  import { createWind } from '/src/render/wind.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { build } from '/src/world/docks.js';

  const W = 1000, H = 580;
  const renderer = new THREE.WebGLRenderer({ canvas: undefined, antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;             // main.js:97
  setTextureAnisotropy(Math.min(4, renderer.capabilities.getMaxAnisotropy()));
  document.body.appendChild(renderer.domElement);

  const tier = { name: 'high', envIntensity: 0.45 };
  setTextureTier(tier);

  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;

  // The game's rig, from render/rig.js, in walk.js's order: the sun before the
  // build, the fill after it (it takes the area's own groundBounce), then the
  // shadow fit, the bias and the caster sweep once the scene is complete.
  const sun = createSun();
  scene.add(sun);

  const wind = createWind({ reducedMotion: false });
  const area = build(scene, { water: { quality: tier, reducedMotion: false }, wind });
  scene.add(createFill(area.groundBounce));
  const water = waterRig(area.waterFx ?? []);

  // The real follow camera: catcam is 4.5m behind and 2.2m up.
  const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
  // The shadow fit as the game runs it on the high tier; shadows.update()
  // runs before every render, as main.js does each frame.
  const shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
  sun.shadow.bias = SUN_BIAS;
  const casters = assignShadowCasters(scene);
  const render = () => { shadows.update(); renderer.render(scene, camera); };
  const VIEWS = {
    // Standing on the quay looking across the canal — the money shot: cobbles
    // in the near field at grazing angle, water in the middle, warehouses behind.
    canal:     { pos: [0, 2.2, 14],    look: [0, 0.4, 0] },
    // Close on the ground, to judge cobble scale at a cat's eye.
    cobbles:   { pos: [6, 1.4, 10],    look: [4, 0.0, 4] },
    // The warehouse row — brick, siding, shingle, windows together.
    warehouses:{ pos: [10, 3.0, 26],   look: [14, 3.0, 12] },
    // The crane yard — paintedMetal at range.
    crane:     { pos: [-8, 3.2, -2],   look: [-18, 4.0, -14] },
    // Far view: everything should have flattened back to colour.
    far:       { pos: [0, 12, 46],     look: [0, 0, 0] },
  };
  let t = 0;
  window.__view = (name) => {
    const v = VIEWS[name] || VIEWS.canal;
    camera.position.set(...v.pos);
    camera.lookAt(...v.look);
    render();
    document.getElementById('hud').textContent =
      `${name} · high tier · anisotropy ${Math.min(4, renderer.capabilities.getMaxAnisotropy())} · waterFx ${(area.waterFx ?? []).length} · casters ${casters.casters}/${casters.meshes}`;
    return name;
  };
  window.__scene = scene; window.__water = water; window.__area = area;
  window.__cam = (px,py,pz, lx,ly,lz, label='free') => { camera.position.set(px,py,pz); camera.lookAt(lx,ly,lz); render(); document.getElementById('hud').textContent = `${label} · pos ${px},${py},${pz} -> ${lx},${ly},${lz} · casters ${casters.casters}/${casters.meshes}`; return label; };
  window.__step = (n = 60) => { for (let i = 0; i < n; i++) { t += 1 / 60; water.update(1 / 60); wind.update(t, 1); } render(); return t.toFixed(2); };
  __view('canal');
</script>
