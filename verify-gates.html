<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate looks</title>
<!-- World map step 3 (dev only, like the other verify-*.html: the build reads
     index.html alone). The four gate looks of src/world/gateway.js on a lawn,
     each twice: shut on the left, open on the right. The area side is towards
     the camera (south); each gate faces north, so an open leaf swings away.
     URL: ?look=signpost|fairgate|farmgate|promenade to show one. Drag to orbit.
     For scripts/record-page.mjs: window.__shot(name), name one of
     gates-all (the row from the area side), gates-high (from above) and
     gates-cat (a cat's eye, 0.3 m up, in front of the first shut gate). -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2431; color: #f1e0c2; font: 13px/1.3 Avenir, Nunito, 'Trebuchet MS', sans-serif; }
  #hud { position: absolute; top: 8px; left: 10px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="hud">Gate looks · shut left, open right · drag to orbit</div>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier, setTextureAnisotropy } from '/src/render/textures.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { ground } from '/src/world/builder.js';
  import { addGatewayDressing } from '/src/world/gateway.js';
  import { GATEWAY_ENDS, gatewayEnd } from '/src/gateways.js';

  const ALL = ['signpost', 'fairgate', 'farmgate', 'promenade'];
  const want = new URLSearchParams(location.search).get('look');
  const looks = ALL.includes(want) ? [want] : ALL;

  const W = window.innerWidth, H = window.innerHeight;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  setTextureAnisotropy(Math.min(4, renderer.capabilities.getMaxAnisotropy()));
  document.body.appendChild(renderer.domElement);

  const tier = { name: 'high', envIntensity: 0.45 };
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbcd8ec);
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  const sun = createSun();
  scene.add(sun);
  scene.add(createFill(0x8fae6a));
  scene.add(ground(120, 0x8fae6a, { surface: 'grass' }));

  // Each look twice, 9 m apart within a pair and 18 m between pairs, with a
  // short lane up to each gate from the area side. Each copy borrows the
  // neighbour of the first real end with that look, so its band is a real one.
  const SPACING = 18, PAIR = 4.5;
  const ends = [];
  looks.forEach((look, i) => {
    const real = Object.values(GATEWAY_ENDS).flat().find((e) => e.look === look);
    const cx = (i - (looks.length - 1) / 2) * SPACING;
    for (const [state, dx] of [['shut', -PAIR], ['open', PAIR]]) {
      const x = cx + dx;
      ends.push(gatewayEnd({ id: `${look}-${state}`, gateway: look, x, z: 0, faces: 'north', to: real.to, twin: '-', look, lane: [x, 5, x, 0] }));
    }
  });
  const gates = addGatewayDressing(scene, 'verify', { ends, isOpen: (e) => e.id.endsWith('-open') });
  window.__gates = gates;

  const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 300);
  const shadows = createShadowFit(sun, camera, { radius: 26, mapSize: 2048 });
  sun.shadow.bias = SUN_BIAS;
  assignShadowCasters(scene);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.9, 0);

  const span = looks.length * SPACING;
  const VIEWS = {
    all() { camera.position.set(0, 3.2, span * 0.62 + 2); controls.target.set(0, 0.9, 0); },
    high() { camera.position.set(-span * 0.25, span * 0.55, span * 0.5); controls.target.set(0, 0, -1); },
    cat() {
      const x = ends[0].x;
      camera.position.set(x + 0.6, 0.3, 4.5);
      controls.target.set(x, 0.8, 0);
    },
  };
  // controls.update() fires 'change', which renders: never call it from render.
  const render = () => { shadows.update(); renderer.render(scene, camera); };
  const view = (name) => { VIEWS[name](); camera.lookAt(controls.target); controls.update(); };
  window.__shot = (name) => {
    const m = /^gates-(all|high|cat)$/.exec(name);
    if (!m) return `no shot ${name}`;
    view(m[1]);
    render();
    return name;
  };
  view('all');
  controls.addEventListener('change', render);
  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    render();
  });
  render();
  window.__ready = true;
</script>
</body>
</html>
