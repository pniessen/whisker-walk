<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Holiday decor: the five places, Christmas and Hanukkah</title>
<!-- Holiday keepsakes H6 (docs/superpowers/plans/2026-11-27-holiday-merch.md): the real area builders dressed by the real src/world/holidaydecor.js,
     in the game's own light rig (the sun, the fill, the shadow fit), seen from a hand-picked camera.
     Pass ?shot=<place>-<holiday>-<view>: place is neighborhood | park | farm | market | house; holiday is christmas | hanukkah | winter (hanukkah shows night 3);
     views: neighborhood street | park tree, menorah, fountain | farm barn, yard | market square, stalls, dreidel | house parlour, sill.
     Contract for scripts/record-page.mjs: window.__ready is true after the first frame; window.__shot(name) returns name once drawn. -->
<style>html, body { margin: 0; background: #223; }</style>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier } from '/src/render/textures.js';
  import { createWind } from '/src/render/wind.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { mergeStaticProps } from '/src/render/mergeprops.js';
  import { setHolidayOverride } from '/src/holidays.js';
  import * as decor from '/src/world/holidaydecor.js';
  import { loadHouseStages } from '/src/world/housestages.js';

  const W = 960, H = 540;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);
  const tier = { name: 'high', envIntensity: 0.45 };
  setTextureTier(tier);
  const env = buildEnvMap(renderer);
  decor.bind(decor.NEEDS.map((k) => THREE[k]));

  const BUILD = {
    neighborhood: () => import('/src/world/neighborhood.js'),
    park: () => import('/src/world/park.js'),
    farm: () => import('/src/world/farm.js'),
    market: () => import('/src/world/market.js'),
    house: () => loadHouseStages().then(() => import('/src/world/house.js')),
  };
  // [camera position, look at]
  const VIEWS = {
    'neighborhood-street': [[0, 2.6, 46], [0, 2.6, 30]],
    'neighborhood-west': [[-9, 2.4, 40], [-12, 3, 32]],
    'neighborhood-east': [[9, 2.4, 40], [12, 3, 32]],
    'park-tree': [[-4, 2.8, 30], [-14.5, 2.4, 17]],
    'park-menorah': [[-2, 2, 15], [-9.2, 0.9, 8.6]],
    'park-fountain': [[6, 2, 30], [0, 0.7, 20]],
    'farm-barn': [[0, 2.2, -2], [0, 1.8, -10.5]],
    'farm-yard': [[-8, 2.4, 14], [-18, 1.8, 8]],
    'market-square': [[-1, 2.6, 6.5], [-4.5, 1.4, -5.5]],
    'market-stalls': [[0, 2, -3], [7, 1.8, -10.5]],
    'market-dreidel': [[14, 2.6, -15.5], [20.2, 1.1, -13]],
    'house-parlour': [[8.5, 1.9, 4.2], [13.4, 0.9, 7]],
    'house-sill': [[7, 1.5, 8.5], [5.7, 1.0, 11.8]],
  };

  let sun = null;
  async function shot(name) {
    const [place, holiday, view] = name.split('-');
    const scene = new THREE.Scene();
    scene.environment = env;
    scene.environmentIntensity = tier.envIntensity;
    sun = createSun();
    scene.add(sun);
    const m = await BUILD[place]();
    const wind = createWind({ reducedMotion: false });
    const area = m.build(scene, { water: { quality: tier, reducedMotion: false }, wind });
    scene.add(createFill(area.groundBounce));
    mergeStaticProps(scene);
    setHolidayOverride({ holiday, night: holiday === 'hanukkah' ? 3 : null });
    decor.dress(place, scene, area, { pick: 'auto', reducedMotion: true });
    setHolidayOverride(null);
    const [pos, look] = VIEWS[`${place}-${view}`];
    const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
    camera.position.set(...pos);
    camera.lookAt(...look);
    const shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
    sun.shadow.bias = SUN_BIAS;
    assignShadowCasters(scene);
    shadows.update();
    renderer.render(scene, camera);
    return name;
  }
  window.__shot = shot;
  window.__ready = false;
  shot(new URLSearchParams(location.search).get('shot') ?? 'neighborhood-christmas-street').then(() => { window.__ready = true; });
</script>
</body>
</html>
