<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Cave pass 9 (the cave answers her voice and moves) picture page</title>
<!-- The Crystal Cave (flag-only place), picture page for the beauty rounds: the REAL build and life. NOT in the game's page.
     URL params: size=WxH (default 960x540), tier=high|low|lite. window.__shot(name) with scripts/record-page.mjs.
     Shots (the PLAY camera: 4.5 m behind, 2.2 m up, fov 70): camp rose pool gold heart (the five vistas), each with -gold (3.5 s still: the golden moment) and -res / -aur / -dream (the moods); camp0 (seen from the entry); at_x_z_dx_dz for a survey (n = minus, p = point).
     Contact sheet: crystal-beauty9-pics/contact-pass9-before-after.png (one row per vista; columns before, meow, pounce, sniff, still, zoomies, each caught mid-reaction).
     Pass 9 shots: vista-ev with ev = base (nothing happens: the BEFORE; not 'calm', a mood name) | meow | pounce | sniff | still | zoom, e.g. camp-meow. Add -rm for reduced motion is URL param motion=0.
     URL param motion=0 freezes (reduced motion). -->
<style>html,body{margin:0;background:#2a1a30;overflow:hidden}canvas{position:fixed;left:0;top:0;display:block}</style>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier } from '/src/render/textures.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { buildCat } from '/src/cat/model.js';
  import { animateCat } from '/src/cat/animator.js';
  import { facingYaw } from '/src/traversal.js';
  import { applyDusk, duskEnv, tintDuskLawn } from '/src/render/dusk.js';
  import { effectiveWear } from '/src/suithook.js';
  import { mergeStaticProps } from '/src/render/mergeprops.js';
  import { loadCrystalStages } from '/src/world/crystalstages.js';
  await loadCrystalStages(); // the game's loader awaits every stage with the base chunk
  const { build } = await import('/src/world/crystal.js');
  import { createProgression } from '/src/progression.js';
  import { createDiscoveryLog } from '/src/discoveries.js';
  import { createFx } from '/src/fx.js';
  import { bus } from '/src/events.js';

  const params = new URLSearchParams(location.search);
  const [W0, H0] = (params.get('size') || '960x540').split('x').map(Number);
  const TIER = params.get('tier') || 'high';
  const DT = 1 / 30;
  const tier = TIER === 'lite' ? { name: 'low', rung: 5, shadows: false, envIntensity: 0.3 } : TIER === 'low' ? { name: 'low', rung: 3, shadows: true, envIntensity: 0.3 } : { name: 'high', shadows: true, envIntensity: 0.3 };
  let W = W0, H = H0;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H); renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = tier.shadows; renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
  document.body.prepend(renderer.domElement);
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  const sun = createSun(); scene.add(sun);
  const fill = createFill(0x8d8c93); scene.add(fill);
  const area = build(scene);
  const look = applyDusk({ scene, sun, fill, areaData: area });
  tintDuskLawn({ ground: scene.children.filter((c) => c.isMesh && (c.userData.ground || c.userData.duskTint)), grass: null, look });
  scene.environmentIntensity = duskEnv(scene.environmentIntensity, look);
  const ground = area.ground;
  const wear = effectiveWear({ collar: null, head: null, face: null, neck: null, body: null, back: null, feet: null }, 'crystal');
  const cat = buildCat('tabby', wear); scene.add(cat);
  const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
  const shadows = tier.shadows ? createShadowFit(sun, camera, { radius: 20, mapSize: tier.rung >= 3 ? 1024 : 2048 }) : null;
  sun.shadow.bias = SUN_BIAS; sun.castShadow = tier.shadows;
  assignShadowCasters(scene);
  mergeStaticProps(scene);
  const HIDE = (params.get('hide') || '').split(',').filter(Boolean);
  const fx = createFx(scene, { reducedMotion: false });
  const store = new Map();
  const STEP = Number(params.get('step') ?? 2);
  const progression = createProgression({ getItem: (k) => store.get(k) ?? null, setItem: (k, v) => store.set(k, String(v)), removeItem: (k) => store.delete(k) });
  const log = createDiscoveryLog(progression); log.startWalk();
  progression.state.crystal = { step: STEP, sparks: STEP >= 2 ? 1 : 0, album: 0 };
  const player = { floatY: 0 };
  const session = { hopLift: 0, pounceTime: 0, sniffTime: 0, idleTime: 0, wasZooming: false, perched: false };
  const life = area.life({ roomSeed: 7, sendEvent: () => {}, scene, sun, fill, ground, reducedMotion: params.get('motion') === '0', tier, progression, log, audio: null, doc: document, win: window, clock: () => 250, visits: 3, player });
  let t = 0;
  const lookAt = (pos, tgt, fov = 70) => { camera.fov = fov; camera.updateProjectionMatrix(); camera.position.set(...pos); camera.lookAt(...tgt); };
  let lock = null;
  function frame() {
    t += DT;
    if (lock) lookAt(...lock);
    life.update(DT, t, cat.position, camera, session);
    fx.update(DT, camera);
    animateCat(cat, 'idle', t, 0, false);
    if (HIDE.length) scene.traverse((o) => { if (HIDE.includes(o.name)) o.visible = false; });
    if (shadows) shadows.update(0, DT);
    renderer.render(scene, camera);
  }
  const settle = (n) => { for (let i = 0; i < n; i++) frame(); };
  const put = (x, z, fx_, fz_, lift = 0) => { cat.position.set(x, ground.y(x, z) + lift, z); cat.rotation.set(0, facingYaw(fx_, fz_), 0); };
  const cam = (pos, tgt, fov = 70, size = null) => { if (size) { W = size[0]; H = size[1]; } else { W = W0; H = H0; } renderer.setSize(W, H); camera.aspect = W / H; lock = [pos, tgt, fov]; };
  const S = {
    spawn: [0, 29, 0, -1, 0, [3, 2.4, 33], [0, 1.8, 20], 68],
    entry: [-1, 20, 0, -1, 0, [-5, 2.2, 22.5], [2, 1.2, 8], 68],
    rose: [-15, 6, -1, -0.3, 0, [-9, 2.2, 10], [-22, 1.6, 1.5], 68],
    pool: [14, 3, 0, -1, 0, [18, 2.4, 8], [13, 0.6, -6], 68],
    gold: [-8, -17, 0, -1, 0, [-4, 2.4, -12], [-9, 1.6, -26], 68],
    heart: [19, -14, 1, -1, 0, [15, 2.6, -10], [22, 2.0, -22], 68],
    lumi: [2, 24, 0, -1, 0, [5, 1.8, 26.5], [3.4, 0.5, 21.2], 60],
    phone: [0, 29, 0, -1, 0, [0, 2.8, 34.5], [0, 1.6, 20], 62, [390, 760]],
  };
  // pass 8: PLAY-camera shots (the game's own camera: 4.5 m behind, 2.2 m up, fov 70, looking at her back). Name = vista[-mood][-gold]; mood calm|res|aur|dream sets the walk clock to the middle of that mood.
  // gold: she stands still 4 s first (the golden moment). vista = camp | rose | pool | gold | heart (the five spots), plus extras for the survey.
  const PLAY = { camp: [-13, 16.5, 0.6, -0.8], rose: [-14, 5, -1, 0.1], pool: [10, 1, 1, -0.2], gold: [-9, -21, -1, -0.5], heart: [16, -15, 1, -0.7],
    camp0: [-8, 20, -1, 0.05], entry: [0, 24, 0, -1], wheel: [-25, 8, -1, 0.3], bed: [-12, -20, -0.5, -1], mural: [20, -26, 0, -1] };
  const MOODS = { calm: 30, res: 120, aur: 210, dream: 300 };
  window.__shot = (name) => {
    const parts = name.split('-'); let base = parts[0];
    if (base.startsWith('at_')) { const q = base.slice(3).split('_').map((v) => Number(v.replace('n', '-').replace('p', '.'))); PLAY[base] = q; } // survey: at_x_z_dx_dz (n = minus, p = point)
    const mood = parts.find((p) => MOODS[p]); const gold = parts.includes('gold');
    if (mood) { t = MOODS[mood]; for (let i = 0; i < 40; i++) { t += DT; life.update(DT, t, cat.position, camera, session); } }
    if (PLAY[base]) {
      const [x, z, dx, dz] = PLAY[base]; const n = Math.hypot(dx, dz); put(x, z, dx, dz);
      const y = ground.y(x, z); cam([x - dx / n * 4.5, y + 2.2, z - dz / n * 4.5], [x, y + 0.8, z], 70);
      const ev = parts.find((p) => ['meow', 'pounce', 'sniff', 'still', 'zoom'].includes(p));
      if (ev) {
        Object.assign(session, { pounceTime: 0, sniffTime: 0, idleTime: 0, wasZooming: false }); settle(6); t += 3; settle(3);
        if (ev === 'meow') { bus.emit('tip:did', { id: 'call' }); settle(26); }
        if (ev === 'pounce') { bus.emit('pounce:land', {}); session.pounceTime = 1; settle(7); }
        if (ev === 'sniff') { session.sniffTime = 1; settle(22); session.sniffTime = 0; }
        if (ev === 'still') { session.idleTime = 3; settle(70); }
        if (ev === 'zoom') { session.wasZooming = true; for (let i = 0; i < 40; i++) { put(x + dx / n * (i * 0.08 - 3.2), z + dz / n * (i * 0.08 - 3.2), dx, dz); frame(); } }
        if (params.get('dbg')) console.warn(name, JSON.stringify(window.__voice()));
        return name;
      }
      if (gold) t += 20; settle(gold ? 104 : 60); // gold: 3.5 s still, so the camera flash is 0.4 s old
      return name;
    }
    if (base === 'stats') { put(16, -15, 1, -0.7); cam([12.6, ground.y(16, -15) + 2.6, -11.6], [17.1, ground.y(16, -15) + 0.9, -16.05], 62); settle(30); let meshes = 0; let casters = 0; scene.traverse((o) => { if (o.isMesh && o.visible) { meshes++; if (o.castShadow) casters++; } }); const d = document.createElement('pre'); d.style.cssText = 'position:fixed;left:0;top:0;color:#fff;background:#000;font:20px monospace;margin:0'; d.textContent = `triangles ${renderer.info.render.triangles} calls ${renderer.info.render.calls} meshes ${meshes} casters ${casters}`; document.body.appendChild(d); return name; }
    if (base === 'names') { const d = document.createElement('pre'); d.style.cssText = 'position:fixed;left:0;top:0;color:#fff;background:#000;font:10px monospace;columns:4;margin:0'; d.textContent = scene.children.map((o, i) => i + ' ' + (o.name || o.type) + ' ' + (o.material?.blending ?? '') + (o.material?.transparent ? 'T' : '')).join('\n'); document.body.appendChild(d); return name; }
    name = base;
    const s = S[name]; if (!s) throw new Error('no shot ' + name);
    put(s[0], s[1], s[2], s[3], s[4]);
    cam(s[5], s[6], s[7], s[8]);
    if (name === 'heart') { life.wing.start({ own: false, elapsed: 0 }); for (let i = 0; i < 400; i++) { t += DT; life.update(DT, t, cat.position, camera, session); } }
    settle(name === 'lumi' ? 120 : 30);
    return name;
  };
  window.__voice = () => { const o = { x: 0, y: 0, z: 0, g: 0, size: 0, rgb: [1, 1, 1] }; const v = life.voice; let k = 0; const l = []; for (let i = 0; i < v.ps.length; i++) { v.at(i, t, o); if (o.g > 0.01) { k++; l.push([o.x.toFixed(1), o.y.toFixed(1), o.z.toFixed(1), o.g.toFixed(2)].join(',')); } } return { k, vis: v.points.visible, cat: [cat.position.x, cat.position.y, cat.position.z], counts: v.state.counts, l: l.slice(0, 6) }; };
  window.__stats = () => ({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles });
  window.__ready = true;
</script>
</body>
</html>
