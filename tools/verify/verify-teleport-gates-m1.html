<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleport gates, milestone 1: the three looks</title>
<link rel="stylesheet" href="/src/style.css">
<!-- Teleport gates milestone 1 (docs/superpowers/plans/2026-11-23-teleport-gates.md): the picture page for the three gate looks
     (src/world/telegate.js), the swirl, the card, the prompt and the two owner choices (look per gate, landing facing).
     The real Park scaffold, the real gate code, the real cat and follow camera; the card and the swirl are the real src/teleui.js
     on the game's own stylesheet. NOT in the game. scripts/record-page.mjs makes the pictures: __shot(name), __tour(name) /
     __frame(). URL params: look=stonering|archway|hollow (default stonering), suit=space|dive (the disc's tint), dusk=1,
     dormant=1, rm=1 (reduced motion), away=1 (land facing away from the gate), size=WxH (default 960x540), tv=1 (couch size). -->
<style>
  html, body { margin: 0; background: #1c2431; overflow: hidden; font: 16px/1.35 Avenir, system-ui, sans-serif; color: #f1e0c2; }
  #stage { position: fixed; left: 0; top: 0; }
  #stage canvas { display: block; }
  #stage #overlay { position: absolute; inset: 0; z-index: 10; }
  #stage #overlay.hidden { display: none; }
  #stage #hud { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  #stage .hud-prompt { z-index: 2; }
  .pad { display: inline-block; min-width: 1.5em; margin-left: .3em; padding: 0 .4em; border-radius: 999px; background: #e8d8a8; color: #3a2a10; font-weight: 800; text-align: center; }
</style>
</head>
<body>
<div id="stage"><div id="hud"></div><div id="overlay" class="hidden"></div></div>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier } from '/src/render/textures.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { skyBackground } from '/src/render/sky.js';
  import { buildCat } from '/src/cat/model.js';
  import { animateCat } from '/src/cat/animator.js';
  import { createPlayer } from '/src/player.js';
  import { facingYaw, behindYaw } from '/src/traversal.js';
  import { applyDusk, duskEnv, tintDuskLawn } from '/src/render/dusk.js';
  import { createWind } from '/src/render/wind.js';
  import { build as buildPark } from '/src/world/park.js';
  import { addTeleGates, setTeleClock, discTint, LOOK_NAMES } from '/src/world/telegate.js';
  import { arriveFor, TELE_ENDS, teleRow } from '/src/teleport.js';
  import * as UI from '/src/teleui.js';
  import { lower } from '/src/territories.js';
  import { escapeHtml } from '/src/escapehtml.js';

  const params = new URLSearchParams(location.search);
  const rm = params.get('rm') === '1';
  const DUSK = params.get('dusk') === '1';
  const DORMANT = params.get('dormant') === '1';
  const TV = params.get('tv') === '1';
  const LOOK = LOOK_NAMES.includes(params.get('look')) ? params.get('look') : 'stonering';
  const SUIT = ['space', 'dive'].includes(params.get('suit')) ? params.get('suit') : null;
  const MODE = params.get('away') === '1' ? 'away' : 'toward';
  const [W, H] = (params.get('size') || '960x540').split('x').map(Number);
  const DT = 1 / 30;
  const PACE = 3.5;
  const stage = document.getElementById('stage');
  stage.style.width = `${W}px`; stage.style.height = `${H}px`;
  if (TV) document.documentElement.classList.add('tv');

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  stage.prepend(renderer.domElement);
  const tier = { name: 'high', envIntensity: 0.45 };
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  scene.background = skyBackground(0x8cc8ee, 0xe6f2e8);
  scene.fog = new THREE.Fog(0xe6f2e8, 70, 170);
  const sun = createSun();
  scene.add(sun);
  const wind = createWind({ reducedMotion: rm });
  const area = buildPark(scene, { water: { quality: 'high', reducedMotion: rm }, wind });
  const fill = createFill(area.groundBounce);
  scene.add(fill);

  // The gate: the table's park end, in the look the page asks for, turned to the suit's tint. Time is the page's own, so a
  // picture is the same every time.
  const base = TELE_ENDS.park[0];
  const end = teleRow({ ...base, look: LOOK, suit: SUIT, arrive: arriveFor(base.faces, base.x, base.z, MODE) });
  let clockT = 0.6;
  setTeleClock(() => clockT);
  addTeleGates(scene, [end], { awakeOf: () => !DORMANT, calm: rm });
  if (DUSK) {
    const look = applyDusk({ scene, sun, fill, areaData: area });
    tintDuskLawn({ ground: scene.children.filter((c) => c.isMesh && (c.userData.ground || c.userData.duskTint)), grass: null, look });
    scene.environmentIntensity = duskEnv(scene.environmentIntensity, look);
    renderer.toneMappingExposure = 1.1;
  }
  const cat = buildCat('tabby');
  scene.add(cat);
  const camera = new THREE.PerspectiveCamera(W < H ? 62 : 70, W / H, 0.1, 300);
  const shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
  sun.shadow.bias = SUN_BIAS;
  assignShadowCasters(scene);
  const player = createPlayer(camera, renderer.domElement);
  player.setReducedMotion(rm);
  let t = 0;
  function reset(x, z, fx, fz) {
    cat.position.set(x, 0, z);
    cat.rotation.set(0, facingYaw(fx, fz), 0);
    player.setAvatar(cat, PACE);
    player.setGround(null);
    player.setViewYaw(behindYaw(fx, fz));
    player.enable();
    player.update(0, area.colliders, area.bounds, area.waters);
    shadows.update(0, 1e3);
  }
  const stick = (x, z) => player.setTouchMove(x === 0 && z === 0 ? null : { x, z, mag: 1 });
  let freeCam = false;
  function frame(dt) {
    t += dt; clockT += dt;
    player.update(dt, area.colliders, area.bounds, area.waters);
    player.speedFactor = 1;
    animateCat(cat, 'follow', t, player.speed, rm);
    cat.rotation.x = 0; cat.rotation.z = 0;
    shadows.update(0, dt);
    renderer.render(scene, camera);
  }
  const showAt = (cam) => { camera.position.set(...cam.pos); camera.lookAt(...cam.look); camera.fov = cam.fov ?? camera.fov; camera.updateProjectionMatrix(); };

  // ---- the page's HTML pieces: the real card, the real swirl, the prompt pill as hud.js sets it ----
  const overlay = document.getElementById('overlay');
  const hud = document.getElementById('hud');
  UI.setup({ padTag: (tok) => (params.get('pad') === '1' ? ` <span class="pad">${tok === '⟦confirm⟧' ? 'A' : 'B'}</span>` : ''), lower, escapeHtml });
  const NAME = 'The Greenhouse';
  const showCard = () => { overlay.className = ''; overlay.innerHTML = UI.cardHtml({ name: NAME, look: LOOK, tint: discTint(end) }); };
  const showPill = (text) => { hud.innerHTML = `<div class="hud-prompt"><button class="hud-prompt-btn" type="button">${text}</button></div>`; document.body.classList.add('touch-mode'); };
  const clear = () => { overlay.className = 'hidden'; overlay.innerHTML = ''; hud.innerHTML = ''; };

  // A swirl frame at `s` seconds into its 1.2 s (the CSS runs on the page's own clock, so it is held and scrubbed).
  const swirlAt = (s, calm = rm) => {
    overlay.className = '';
    overlay.innerHTML = UI.swirlHtml({ name: NAME, calm, tint: discTint(end) });
    const root = overlay.firstElementChild;
    for (const el of [root, root.querySelector('.tele-turn')]) { el.style.animationPlayState = 'paused'; el.style.animationDelay = `-${s}s`; }
  };
  const openingAt = (s, calm = rm) => {
    overlay.className = '';
    overlay.innerHTML = `<div class="tele-swirl opening${calm ? ' calm' : ''}" style="--tele-a:${UI.hex(discTint(end))};animation-play-state:paused;animation-delay:-${s}s"><div class="tele-turn"></div></div>`;
  };

  const GX = end.x, GZ = end.z; // the gate; faces west: she walks west up to it, from the east
  const SHOTS = {
    // walking: the follow camera as the game has it
    approach: { at: [GX + 6.5, GZ], face: [-1, 0] },
    near: { at: [GX + 1.8, GZ], face: [-1, 0], prompt: 'Go through' },
    arrive: { at: [end.arrive.x, end.arrive.z], face: [Math.sin(end.arrive.yaw) * -1, Math.cos(end.arrive.yaw) * -1] },
    // fixed cameras
    front: { at: [GX + 5, GZ], face: [-1, 0], cam: { pos: [GX + 5.5, 1.5, GZ], look: [GX, 1.5, GZ], fov: 55 } },
    threeq: { at: [GX + 3, GZ + 2], face: [-1, 0], cam: { pos: [GX + 5, 1.9, GZ + 5.5], look: [GX, 1.4, GZ], fov: 50 } },
    side: { at: [GX + 3, GZ], face: [-1, 0], cam: { pos: [GX + 0.5, 2.2, GZ + 7], look: [GX, 1.5, GZ], fov: 50 } },
    wide: { at: [GX + 14, GZ - 2], face: [-1, 0], cam: { pos: [GX + 20, 2.4, GZ + 6], look: [GX, 1.6, GZ], fov: 50 } },
    // the card, the swirl and its opening, over the place
    card: { at: [GX + 1.8, GZ], face: [-1, 0], cam: { pos: [GX + 5, 1.9, GZ + 5.5], look: [GX, 1.4, GZ], fov: 50 }, html: 'card' },
    swirl1: { at: [GX, GZ], face: [-1, 0], cam: { pos: [GX + 5, 1.9, GZ + 5.5], look: [GX, 1.4, GZ], fov: 50 }, html: 'swirl', s: 0.3 },
    swirl2: { at: [GX, GZ], face: [-1, 0], cam: { pos: [GX + 5, 1.9, GZ + 5.5], look: [GX, 1.4, GZ], fov: 50 }, html: 'swirl', s: 0.7 },
    swirl3: { at: [GX, GZ], face: [-1, 0], cam: { pos: [GX + 5, 1.9, GZ + 5.5], look: [GX, 1.4, GZ], fov: 50 }, html: 'swirl', s: 1.15 },
    open1: { at: [end.arrive.x, end.arrive.z], face: [-1, 0], html: 'open', s: 0.1 },
    open2: { at: [end.arrive.x, end.arrive.z], face: [-1, 0], html: 'open', s: 0.35 },
  };
  window.__shot = (name) => {
    const s = SHOTS[name];
    if (!s) throw new Error(`no shot "${name}"; there are ${Object.keys(SHOTS).join(', ')}`);
    clear();
    freeCam = !!s.cam;
    reset(s.at[0], s.at[1], s.face[0], s.face[1]);
    for (let k = 0; k < 20; k++) { clockT = 0.6; if (s.cam) { showAt(s.cam); shadows.update(0, DT); renderer.render(scene, camera); } else frame(DT); }
    clockT = 0.6;
    if (s.cam) { showAt(s.cam); renderer.render(scene, camera); } else renderer.render(scene, camera);
    if (s.prompt) showPill(s.prompt);
    if (s.html === 'card') showCard();
    if (s.html === 'swirl') swirlAt(s.s);
    if (s.html === 'open') openingAt(s.s);
    return name;
  };

  // ---- the film: she walks up to the gate, the card asks, the swirl closes; then the other side opens on her landing ----
  let tour = null;
  window.__tour = (name) => {
    clear();
    tour = { name, k: 0, phase: 0 };
    reset(GX + 8, GZ, -1, 0);
    clockT = 0;
    stick(0, -1); // her stick forward: west
  };
  const TOTAL = 30 * 12;
  window.__frame = () => {
    const k = tour.k++;
    const sec = k * DT;
    t += DT; clockT += DT;
    let caption = 'she walks up';
    if (sec < 3.2) { frame(DT); if (cat.position.x < GX + 1.7) stick(0, 0); if (Math.hypot(cat.position.x - GX, cat.position.z - GZ) < 2.4) showPill('Go through'); }
    else if (sec < 4.4) { caption = 'the card'; stick(0, 0); frame(DT); if (!overlay.firstElementChild) { clear(); showCard(); } }
    else if (sec < 5.6) { caption = 'the swirl'; frame(DT); swirlAt(Math.min(sec - 4.4, 1.19)); }
    else if (sec < 6.0) { caption = 'the swirl'; swirlAt(1.19); }
    else if (sec < 6.1) { caption = 'the other side'; clear(); reset(end.arrive.x, end.arrive.z, -Math.sin(end.arrive.yaw), -Math.cos(end.arrive.yaw)); frame(DT); }
    else if (sec < 6.7) { caption = 'the swirl opens'; frame(DT); openingAt(Math.min(sec - 6.1, 0.59)); }
    else { caption = 'she looks at the gate'; clear(); frame(DT); }
    return { done: sec > 8.2, caption };
  };

  window.__snap = (q = 0.85) => { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/jpeg', q); };
  window.__info = () => ({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, look: LOOK });
  reset(GX + 6.5, GZ, -1, 0);
  renderer.render(scene, camera);
  window.__ready = true;
</script>
</body>
</html>
