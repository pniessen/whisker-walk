<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reef shell carry picture page</title>
<!-- The real Reef build and Marlo's real shell carry (world/reefmarlo.js), with a stand-in cat (a box body and a head child, its nose toward -z like the real cat's mouth point)
     turned through four headings while it carries the first shell. Shots: y0 y90 y180 y270 (the cat's heading in degrees). Before the fix the shell swung round the cat
     (half a metre ahead, turned with it); after, it rides at the mouth, upright and unspun. NOT in the game's page. ?size=WxH. -->
<style>html,body{margin:0;background:#0b2a3a;overflow:hidden}canvas{position:fixed;left:0;top:0;display:block}</style>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { loadReefStages } from '/src/world/reefstages.js';
  const params = new URLSearchParams(location.search);
  const [W, H] = (params.get('size') || '480x300').split('x').map(Number);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H); renderer.setPixelRatio(1);
  document.body.prepend(renderer.domElement);
  await loadReefStages();
  const { build } = await import('/src/world/reef.js');
  const P = await import('/src/world/reefplan.js');
  const S = await import('/src/world/reefstory.js');
  const { createProgression } = await import('/src/progression.js');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1f6a80);
  scene.fog = new THREE.FogExp2(0x1f6a80, 0.02);
  scene.add(new THREE.HemisphereLight(0xcdeeff, 0x2a5a60, 1.6));
  const sun = new THREE.DirectionalLight(0xfff2d0, 2.4); sun.position.set(-30, 60, 20); scene.add(sun);
  const area = build(scene, { water: { quality: { name: 'high', shadows: true } } });
  const memory = { _m: {}, getItem(k) { return this._m[k] ?? null; }, setItem(k, v) { this._m[k] = String(v); }, removeItem(k) { delete this._m[k]; } };
  const progression = createProgression(memory);
  progression.state.reef = { ...progression.state.reef, step: 1, shells: 0 };
  const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 300);
  const sh = S.SHELLS[0];
  const cat = new THREE.Group();
  cat.position.set(sh.x, P.reefY(sh.x, sh.z) + 0.1, sh.z);
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.35, 0.9), new THREE.MeshStandardMaterial({ color: 0xc9873a })); body.position.y = 0.3; cat.add(body);
  const head = new THREE.Group(); head.position.set(0, 0.55, -0.55);
  head.add(new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), new THREE.MeshStandardMaterial({ color: 0xd99a4a })));
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.12, 6), new THREE.MeshStandardMaterial({ color: 0x6a3a2a })); nose.rotation.x = -Math.PI / 2; nose.position.set(0, -0.04, -0.22); head.add(nose);
  cat.add(head); cat.userData.parts = { head };
  scene.add(cat);
  const player = { perchY: 0, floatY: 0, inputActive: false, kickHeld: false, dir: { x: 0, z: 0 }, halt() {}, clearFloat() {}, inputDirection() { return { x: 0, z: 0 }; } };
  const log = { awardOnce() { return 10; }, count() { return 0; }, mark() {}, startWalk() {} };
  const life = area.life({ scene, progression, log, audio: { chime() {} }, player, reducedMotion: false, visits: 1, doc: null });
  const session = { cat, perched: null, perchHold: null, idleTime: 0, fair: { riding: null } };
  let t = 0;
  const step = (n) => { for (let i = 0; i < n; i++) { t += 1 / 30; life.update(1 / 30, t, cat.position, camera, session); } };
  step(5);
  // Meet Marlo (step 1 = met already), then pick up the first shell
  life.promptAt(cat.position); const got = life.interact();
  step(3);
  const view = () => { camera.position.set(cat.position.x + 0.5, cat.position.y + 2.6, cat.position.z + 1.8); camera.lookAt(cat.position.x, cat.position.y + 0.4, cat.position.z); renderer.render(scene, camera); };
  const yawShot = (deg) => () => { cat.rotation.y = (deg * Math.PI) / 180; cat.updateMatrixWorld(true); step(3); view(); };
  const shots = { y0: yawShot(0), y90: yawShot(90), y180: yawShot(180), y270: yawShot(270) };
  window.__shot = (n) => { shots[n]?.(); return n; };
  window.__picked = got;
  window.__ready = true;
</script>
</body>
</html>
