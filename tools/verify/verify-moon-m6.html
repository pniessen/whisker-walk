<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon milestone 6 picture page</title>
<!-- The Moon, milestone 6 (Wing C: the Launch Complex, the postcard, the launch and Earth's reply): the REAL place (src/world/moon.js, built as the walk builds it) and
     its REAL life (world/moonlife.js with the Message Desk's stamps, the rocket and its flight, Earth's reply: world/moonlaunchlive.js, on this page's real DOM), a real
     progression on an in-memory save and a real discovery log, driven the way src/main.js drives them each frame, the golden mice and pebbles made as game/walk.js
     makes them, the real suit and the Moon's own hop and the evening look. NOT in the game's page: nothing reaches it from the app.
     scripts/record-page.mjs makes the pictures: __shot(name), __tour(name) with __frame(), __snap().
     URL params: size=WxH (default 960x540), bare (no HUD), tier=high|low|lite, rm=1 (reduced motion), save=0..8 (the story's step: 4 woken base, 5 Earth found, 6 postcard in
                 the rocket, 7 launched, 8 Earth answered), stamp=0..2 (her stamp for the saves from 6 on).
     Shots: launchpad (the real pad from the Viewing Mound), padside (from the Launch Desk), desk (the Message Desk in the dome), stamps (the picker open), postcard (carrying it),
            slot (the rocket's mailbox), button (at the Launch Desk), count (the board at 3), launch1..launch5 (T-3, ignition +1.5 s, +4 s, +8 s with the camera tilted, +16 s the
            dot), mound (the Mound's benches, the pad beyond), reply (Earth's night side blinking her stamp), replyfar (the whole sky), binoc (the binoculars), rock (the
            stand on Earthrise Rock), phone, phonelaunch, tv, tvlaunch, worst (the heaviest view found by the sweep).
     Tours: launch (the desk, the postcard, the rocket, the button, five, four, ... lift-off, the climb, the dot, the reply). window.__sweepFlight(places) counts draw calls with a rocket in flight. -->
<style>
  html, body { margin: 0; background: #05070f; overflow: hidden; font: 12px/1.35 Avenir, system-ui, sans-serif; color: #e8ecf8; }
  canvas { position: fixed; left: 0; top: 0; display: block; }
  #hud { position: fixed; left: 0; top: 0; padding: 6px 10px; background: rgba(8, 10, 18, .72); white-space: pre; pointer-events: none; }
  #cap { position: fixed; left: 0; bottom: 0; padding: 6px 10px; background: rgba(8, 10, 18, .72); white-space: pre; pointer-events: none; font-size: 14px; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<div id="cap"></div>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier } from '/src/render/textures.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { buildCat } from '/src/cat/model.js';
  import { animateCat } from '/src/cat/animator.js';
  import { createPlayer, pounceArc } from '/src/player.js';
  import { createFx } from '/src/fx.js';
  import { facingYaw, behindYaw } from '/src/traversal.js';
  import { applyDusk, duskEnv, tintDuskLawn } from '/src/render/dusk.js';
  import { effectiveWear } from '/src/suithook.js';
  import { placeArc, placePace, placeBudget } from '/src/placephysics.js';
  import { bestPerch, stickTakesOff } from '/src/climbing.js';
  import { NO_FAIR } from '/src/fairnone.js';
  import { mergeStaticProps } from '/src/render/mergeprops.js';
  import { bus } from '/src/events.js';
  import { build } from '/src/world/moon.js';
  import * as P from '/src/world/moonplan.js';
  import { createProgression } from '/src/progression.js';
  import { createDiscoveryLog } from '/src/discoveries.js';
  import { discoveryText } from '/src/ui/hud.js';
  import { createGoldMice } from '/src/goldmice.js';
  import { createPawPrints } from '/src/render/pawprints.js';
  import { litMaterial } from '/src/render/materials.js';

  const params = new URLSearchParams(location.search);
  const rm = params.get('rm') === '1';
  const [W0, H0] = (params.get('size') || '960x540').split('x').map(Number);
  const BARE = params.has('bare');
  const TIER = params.get('tier') || 'high';
  const DT = 1 / 30;
  const tier = TIER === 'lite' ? { name: 'low', rung: 5, shadows: false, envIntensity: 0.3 } : TIER === 'low' ? { name: 'low', rung: 3, shadows: true, envIntensity: 0.3 } : { name: 'high', shadows: true, envIntensity: 0.3 };

  let W = W0, H = H0;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = tier.shadows;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  document.body.prepend(renderer.domElement);
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  const sun = createSun();
  scene.add(sun);
  const fill = createFill(0x8d8c93);
  scene.add(fill);
  const area = build(scene, { water: { quality: tier, reducedMotion: rm } });
  const look = applyDusk({ scene, sun, fill, areaData: area });
  tintDuskLawn({ ground: scene.children.filter((c) => c.isMesh && (c.userData.ground || c.userData.duskTint)), grass: null, look });
  scene.environmentIntensity = duskEnv(scene.environmentIntensity, look);
  const ground = area.ground;

  const wear = effectiveWear({ collar: null, head: null, face: null, neck: null, body: null, back: null, feet: null }, 'moon');
  const cat = buildCat('tabby', wear);
  scene.add(cat);
  const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
  const shadows = tier.shadows ? createShadowFit(sun, camera, { radius: 20, mapSize: tier.rung >= 3 ? 1024 : 2048 }) : null;
  sun.shadow.bias = SUN_BIAS;
  sun.castShadow = tier.shadows;
  assignShadowCasters(scene);
  mergeStaticProps(scene);

  const fx = createFx(scene, { reducedMotion: rm });
  // the golden mice and the pebbles as game/walk.js makes them
  const mice = createGoldMice(scene, 'moon', new Set(), { ground, rng: () => 0.3 });
  const pebbles = area.collectibles.map((c) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), litMaterial(0xf25c8a, { emissive: 0x5a1a30 })); m.position.set(c.x, ground.y(c.x, c.z) + 0.2, c.z); scene.add(m); return m; });
  // the paw prints on the dust (the walk makes the ring after the shadow sweeps)
  const paws = createPawPrints(scene, { areaId: 'moon', areaData: area, tier: { pawPrints: 48, pawFade: 9 }, reducedMotion: rm });
  // the save: a real progression on an in-memory store (nothing persisted), and a real discovery log, so the finds pay as they do in the game
  const STAMP = Number(params.get('stamp') ?? 1);
  const SAVES = [{ step: 0, cells: 0 }, { step: 1, cells: 0 }, { step: 2, cells: 1 }, { step: 3, cells: 3 }, { step: 4, cells: 3 }, { step: 5, cells: 3, scope: 3 }, { step: 6, cells: 3, scope: 3, stamp: STAMP }, { step: 7, cells: 3, scope: 3, stamp: STAMP }, { step: 8, cells: 3, scope: 3, stamp: STAMP }];
  const SCOPE = 0;
  const store = new Map();
  const progression = createProgression({ getItem: (k) => store.get(k) ?? null, setItem: (k, v) => store.set(k, String(v)), removeItem: (k) => store.delete(k) });
  const state = progression.state;
  let log = null;
  const toasts = [];
  bus.on('discovery', (e) => { toasts.push(discoveryText(e) || e.label); });
  const session = { pounceTime: 0, perched: null, perchHold: null, idleTime: 0, hopLift: 0, fx, goals: null, cat, fair: NO_FAIR };
  session.goldMice = mice; // what the walk's session carries (the Moon's life hides the far ones to hold the draw budget)
  session.collectibleMeshes = new Map(area.collectibles.map((c, i) => [c.id, pebbles[i]]));
  let life = null;
  const dust = {};
  let t = 0;
  function makeLife(save) {
    life?.dispose();
    Object.assign(state.moon, { stamp: -1, scope: SCOPE }, SAVES[save]);
    state.journal = {};
    log = createDiscoveryLog(progression);
    log.startWalk();
    toasts.length = 0;
    dust.reset?.();
    life = area.life({ scene, sun, fill, ground, reducedMotion: rm, tier, progression, log, audio: null, doc: document, win: window, clock: () => 250 });
    t = 0;
    session.perched = null;
    session.perchHold = null;
    session.fair = NO_FAIR;
    return life;
  }
  makeLife(Number(params.get('save') ?? 0));
  const player = createPlayer(camera, renderer.domElement);
  player.setReducedMotion(rm);
  function reset(x, z, fx_, fz_) {
    cat.position.set(x, ground.y(x, z), z);
    cat.rotation.set(0, facingYaw(fx_, fz_), 0);
    player.setAvatar(cat, placePace(3.5, 'moon'));
    player.setGround(ground);
    player.setViewYaw(behindYaw(fx_, fz_));
    player.perchY = 0;
    session.perched = null;
    player.enable();
    player.update(0, area.colliders, area.bounds, area.waters);
    session.pounceTime = 0; session.hopLift = 0;
    life.update(0, t, cat.position, camera, session);
    if (shadows) shadows.update(0, 1e3);
  }
  const stick = (x, z) => player.setTouchMove(x === 0 && z === 0 ? null : { x, z, mag: 1 });
  const hud = document.getElementById('hud');
  const capEl = document.getElementById('cap');
  if (BARE) { hud.remove(); }
  // main.js's order: player.update; the area's life; the fair (here Dot's hooks); the avatar (pose, speedFactor, a pushed stick off a perch); late
  let lock = null; // the shot's camera, put back before each frame (the walk recomputes its camera every frame: a launch's tilt must not pile up)
  function frame(dt) {
    t += dt;
    player.update(dt, area.colliders, area.bounds, area.waters);
    if (lock) { camera.position.set(...lock.pos); camera.lookAt(...lock.look); } // the shot's camera over the walk's follow camera, before the life tips it (as main.js's order: the player, then the area's life)
    life.update(dt, t, cat.position, camera, session);
    session.fair.update(dt, t, { cat, player, session });
    if (stickTakesOff(session, player.inputActive)) { session.perched = null; player.perchY = 0; }
    player.speedFactor = session.perched ? 0 : 1;
    fx.update(dt, camera);
    mice.update(t);
    if (session.pounceTime > 0) session.pounceTime -= dt;
    const on = session.perched;
    animateCat(cat, player.hopY > 0 ? 'pounce' : on?.pose ?? (on ? 'perch' : 'follow'), t, on ? 0 : player.speed, rm);
    cat.rotation.x = 0; cat.rotation.z = 0;
    cat.position.y = ground.y(cat.position.x, cat.position.z) + (on ? on.y : 0) + player.hopY + session.hopLift;
    paws.update(dt, { x: cat.position.x, z: cat.position.z, grounded: !on && !(player.hopY > 0) });
    session.fair.late(dt, t, { cat, player, session });
    if (shadows) shadows.update(0, dt);
    render();
  }
  function render() {
    renderer.render(scene, camera);
    if (BARE) return;
    const p = cat.position;
    hud.textContent = [`moon m6 · tier ${TIER} · at ${p.x.toFixed(1)}, ${p.z.toFixed(1)}, ${p.y.toFixed(2)} · save step ${state.moon.step} stamp ${state.moon.stamp}`, `draws ${renderer.info.render.calls} · tris ${renderer.info.render.triangles}`].join('\n');
  }
  // the walk's own presses
  const arcNow = () => placeArc(pounceArc(state, { reducedMotion: rm }), 'moon');
  const press = () => { // game/interactions.js doPounceOrClimb: a climb if a perch is in reach (the cat goes to it at once, the arc is drawn there), else a hop
    const arc = arcNow();
    const next = bestPerch(area.perches, cat.position, player.perchY, session.perched, placeBudget(state, 'moon'), { ground });
    if (next) { session.perched = next; player.perchY = next.y; player.halt(); cat.position.set(next.x, ground.y(next.x, next.z), next.z); }
    else if (session.perched) { session.perched = null; player.perchY = 0; }
    player.pounce(arc); session.pounceTime = arc.time;
  };
  const resize = (w, h) => { W = w; H = h; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  const setCam = (pos, look, fov = 70) => { lock = { pos, look }; camera.fov = fov; camera.updateProjectionMatrix(); camera.position.set(...pos); camera.lookAt(...look); life.sky.update(camera, t); };
  const settle = (n) => { for (let k = 0; k < n; k++) frame(DT); };
  const at = (x, z) => { cat.position.set(x, ground.y(x, z), z); };
  const angTo = (cur, want, k) => { let d = ((want - cur + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return cur + d * k; };
  // the cat walks a path of points at `speed` m/s (placed each frame, as the stick would; the life, the prints and the camera follow)
  function scriptWalk(points, speed = 4, each = null) {
    for (let i = 0; i + 1 < points.length; i++) {
      const [ax, az] = points[i]; const [bx, bz] = points[i + 1];
      const n = Math.max(1, Math.round(Math.hypot(bx - ax, bz - az) / (speed * DT)));
      cat.rotation.y = facingYaw(bx - ax, bz - az);
      for (let k = 1; k <= n; k++) { const x = ax + ((bx - ax) * k) / n; const z = az + ((bz - az) * k) / n; cat.position.set(x, ground.y(x, z), z); frame(DT); each?.(); }
    }
  }
  const meow = () => bus.emit('tip:did', { id: 'call' });
  const behind = (dist = 4.4, up = 2.5, fov = 66) => { const p = cat.position; const yaw = cat.rotation.y; setCam([p.x - Math.sin(yaw) * dist, p.y + up, p.z - Math.cos(yaw) * dist], [p.x + Math.sin(yaw) * 2.5, p.y + 0.8, p.z + Math.cos(yaw) * 2.5], fov); };
  const D = P.LAUNCH_DESK;
  const place = (x, z, fx_, fz_) => { cat.position.set(x, ground.y(x, z), z); cat.rotation.y = facingYaw(fx_, fz_); };
  const stepFor = (n) => settle(Math.round(n / DT));
  const toButton = () => { place(D.x - 1.4, D.z, 1, 0); settle(4); };
  const startLaunch = () => { toButton(); if (!life.promptAt(cat.position)) throw new Error('no button prompt'); life.interact(); };
  // a camera on the mound's top looking at the pad: the rocket 16 m tall, the tower behind it
  const moundCam = (look = [P.PAD.x, 7.5, P.PAD.z], pos = [P.MOUND.x + 1.2, P.MOUND.h + 2.4, P.MOUND.z + 1.0], fov = 58) => { lock = null; setCam(pos, look, fov); };
  const CAMS = {
    pad: { at: [P.MOUND.x + 1.0, P.MOUND.z + 2.0], face: [1, 0.3], cam: null },
    desk: { at: [P.MESSAGE_DESK.x + 1.6, P.MESSAGE_DESK.z + 0.4], face: [-1, 0] },
    rock: { at: [P.ROCK_LEDGES[2].x, P.ROCK_LEDGES[2].z], face: [0, -1] },
  };
  const perchOnRock = () => { const r = P.ROCK_LEDGES[2]; session.perched = { x: r.x, z: r.z, y: r.y, pose: 'perch' }; player.perchY = r.y; settle(3); };
  const earthCam = () => { const e = P.EARTH; const d = new THREE.Vector3(Math.sin(e.bearingDeg * Math.PI / 180) * Math.cos(e.elevDeg * Math.PI / 180), Math.sin(e.elevDeg * Math.PI / 180), -Math.cos(e.bearingDeg * Math.PI / 180) * Math.cos(e.elevDeg * Math.PI / 180)); const p = cat.position; setCam([p.x, p.y + 3.2, p.z], [p.x + d.x * 100, p.y + 3.2 + d.y * 100, p.z + d.z * 100], 18); };
  const SHOTS = {
    launchpad: () => { prep({ ...CAMS.pad, save: 6 }); moundCam(); },
    padside: () => { prep({ at: [D.x - 1.4, D.z], face: [1, 0], save: 6 }); setCam([D.x - 5.5, 2.6, D.z + 4.8], [P.PAD.x - 3, 5.5, P.PAD.z], 62); },
    mound: () => { prep({ ...CAMS.pad, save: 6 }); const p = cat.position; setCam([p.x - 3.4, p.y + 2.2, p.z - 3.2], [P.PAD.x - 6, 4.5, P.PAD.z], 66); },
    desk: () => { prep({ ...CAMS.desk, save: 5 }); const p = cat.position; setCam([p.x + 4.2, 2.8, p.z + 3.2], [P.MESSAGE_DESK.x, 1.0, P.MESSAGE_DESK.z], 60); },
    stamps: () => { prep({ ...CAMS.desk, save: 5 }); life.promptAt(cat.position); life.interact(); settle(4); const p = cat.position; setCam([p.x + 4.2, 2.8, p.z + 3.2], [P.MESSAGE_DESK.x, 1.0, P.MESSAGE_DESK.z], 60); },
    postcard: () => { prep({ ...CAMS.desk, save: 5 }); life.promptAt(cat.position); life.interact(); window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Digit2' })); settle(10); const p = cat.position; setCam([p.x - 2.4, p.y + 1.1, p.z + 1.3], [p.x, p.y + 0.6, p.z], 52); },
    slot: () => { prep({ at: [P.ROCKET_SLOT.x - 1.0, P.ROCKET_SLOT.z + 1.0], face: [1, -1], save: 6 }); const p = cat.position; setCam([p.x - 3.4, p.y + 1.8, p.z + 2.6], [P.ROCKET_SLOT.x + 0.4, 1.6, P.ROCKET_SLOT.z - 0.4], 62); },
    button: () => { prep({ at: [D.x - 1.4, D.z], face: [1, 0], save: 6 }); setCam([D.x - 4.4, 2.4, D.z + 3.6], [D.x, 1.0, D.z], 58); },
    count: () => { prep({ at: [D.x - 1.4, D.z], face: [1, 0], save: 6 }); life.promptAt(cat.position); life.interact(); stepFor(3.1); moundCam([P.PAD.x - 3, 5.8, P.PAD.z], [P.PAD.x - 14, 3.4, P.PAD.z + 11], 60); },
    launch1: () => { prep({ at: [D.x - 1.4, D.z], face: [1, 0], save: 6 }); life.promptAt(cat.position); life.interact(); stepFor(4.3); moundCam(); },
    launch2: () => { prep({ at: [D.x - 1.4, D.z], face: [1, 0], save: 6 }); life.promptAt(cat.position); life.interact(); stepFor(6.5); moundCam([P.PAD.x, 6, P.PAD.z]); },
    launch3: () => { prep({ at: [D.x - 1.4, D.z], face: [1, 0], save: 6 }); life.promptAt(cat.position); life.interact(); stepFor(9.0); moundCam([P.PAD.x, 14, P.PAD.z]); },
    launch4: () => { prep({ at: [D.x - 1.4, D.z], face: [1, 0], save: 6 }); life.promptAt(cat.position); life.interact(); stepFor(13); moundCam([P.PAD.x, 40, P.PAD.z], undefined, 62); },
    launch5: () => { prep({ at: [D.x - 1.4, D.z], face: [1, 0], save: 6 }); life.promptAt(cat.position); life.interact(); stepFor(21.0); moundCam([P.PAD.x - 22, 120, P.PAD.z + 60], [P.MOUND.x + 8, P.MOUND.h + 2.4, P.MOUND.z + 14], 76); },
    reply: () => { prep({ ...CAMS.rock, save: 7 }); perchOnRock(); stepFor(2.6); earthCam(); },
    replyfar: () => { prep({ ...CAMS.rock, save: 7 }); perchOnRock(); stepFor(2.6); const p = cat.position; setCam([p.x, p.y + 2.6, p.z + 5.5], [p.x + 4, p.y + 26, p.z - 80], 66); },
    binoc: () => { prep({ ...CAMS.rock, save: 8 }); perchOnRock(); life.promptAt(cat.position); life.interact(); stepFor(0.8); },
    rock: () => { prep({ ...CAMS.rock, save: 8 }); perchOnRock(); const p = cat.position; setCam([p.x + 3.2, p.y + 1.8, p.z + 4.6], [P.BINOCULARS.x, p.y + 0.6, P.BINOCULARS.z], 56); },
    phone: () => { prep({ ...CAMS.pad, save: 6, size: [390, 760] }); moundCam([P.PAD.x - 2, 6.5, P.PAD.z], [P.MOUND.x - 1.0, P.MOUND.h + 2.6, P.MOUND.z + 3.0], 66); },
    phonelaunch: () => { prep({ at: [D.x - 1.4, D.z], face: [1, 0], save: 6, size: [390, 760] }); life.promptAt(cat.position); life.interact(); stepFor(9); moundCam([P.PAD.x - 2, 12, P.PAD.z], [P.MOUND.x - 1.0, P.MOUND.h + 2.6, P.MOUND.z + 3.0], 70); },
    tv: () => { prep({ ...CAMS.pad, save: 6, size: [1920, 1080] }); moundCam(); },
    tvlaunch: () => { prep({ at: [D.x - 1.4, D.z], face: [1, 0], save: 6, size: [1920, 1080] }); life.promptAt(cat.position); life.interact(); stepFor(9); moundCam([P.PAD.x, 14, P.PAD.z]); },
    worst: () => { prep({ at: [P.PAD.x - 16, P.PAD.z + 8], face: [1, -0.5], save: 6 }); life.launch.credit({ kind: 'launch', t0: 0, now: 6.5 }); settle(4); const p = cat.position; setCam([p.x - 3, p.y + 2.4, p.z + 3], [P.PAD.x, 9, P.PAD.z], 66); },
  };
  function prep(s) {
    life.star?.scope?.close();
    lock = null;
    resize(...(s.size ?? [W0, H0]));
    makeLife(s.save ?? Number(params.get('save') ?? 6));
    reset(s.at[0], s.at[1], (s.face ?? [1, 0])[0], (s.face ?? [1, 0])[1]);
    stick(0, 0);
    cat.visible = true;
    settle(s.settle ?? 20);
    if (s.cam) setCam(s.cam.pos, s.cam.look, s.cam.fov);
  }
  window.__shot = (name) => {
    const f = SHOTS[name];
    if (!f) throw new Error(`no shot "${name}"; there are ${Object.keys(SHOTS).join(', ')}`);
    f();
    render();
    return name;
  };
  window.__snap = (q = 0.85) => { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/jpeg', q); };
  window.__stats = () => { const i = renderer.info; return { calls: i.render.calls, triangles: i.render.triangles }; };
  // the sweep: the draw calls of a frame (main and shadow passes) from 12 headings at each of many places, the worst reported. `fly` starts a launch at 6.5 s into its flight
  // (a rocket in the air, the plume and the smoke on) for every place; `save` is the story's step.
  window.__sweep = (places, headings = 12, { fly = false, save = 7 } = {}) => {
    let worst = { calls: 0 }; let sum = 0; let n = 0;
    for (const [x, z, y0] of places) {
      if (fly) { lock = null; makeLife(save); reset(x, z, 0, -1); life.launch.credit({ kind: 'launch', t0: 0, now: 6.5 }); }
      for (let h = 0; h < headings; h++) {
        const a = (h / headings) * Math.PI * 2;
        cat.position.set(x, y0 ?? ground.y(x, z), z); cat.rotation.y = a;
        settle(2);
        setCam([x - Math.sin(a) * 4.4, (y0 ?? ground.y(x, z)) + 2.9, z - Math.cos(a) * 4.4], [x + Math.sin(a) * 2.5, (y0 ?? ground.y(x, z)) + 0.8, z + Math.cos(a) * 2.5], 70);
        renderer.info.autoReset = false; renderer.info.reset();
        renderer.render(scene, camera);
        const calls = renderer.info.render.calls; const tris = renderer.info.render.triangles;
        renderer.info.autoReset = true;
        sum += calls; n++;
        if (calls > worst.calls) worst = { calls, tris, at: [x, z], heading: h };
      }
    }
    return { worst, mean: sum / n, n };
  };

  // ---- tours ----------------------------------------------------------------------------------------------------------
  // launch: write the postcard at the desk, carry it to the rocket, post it, the big red button, five to one, lift-off, the climb, the fading dot, and Earth's reply
  const TOURS = {
    launch: () => {
      makeLife(5);
      const M = P.MESSAGE_DESK;
      reset(M.x + 4.5, M.z + 1.5, -1, 0);
      let k = 0; let cap = 'Write a postcard at the message desk'; let si = -1; let sh = 0; let phase = 0;
      const route = [[M.x + 4.5, M.z + 1.5], [M.x + 1.6, M.z + 0.4]];
      const seg = [];
      const leg = (pts, speed = 5) => { for (let i = 0; i + 1 < pts.length; i++) { const [ax, az] = pts[i]; const [bx, bz] = pts[i + 1]; const n = Math.max(1, Math.round(Math.hypot(bx - ax, bz - az) / (speed * DT))); for (let q = 1; q <= n; q++) seg.push([ax + ((bx - ax) * q) / n, az + ((bz - az) * q) / n, facingYaw(bx - ax, bz - az)]); } };
      leg(route);
      const follow = () => behind(5.0, 2.6, 66);
      const to = (pts) => { seg.length = 0; k = 0; leg(pts); phase = 0; };
      const script = [
        ['Pick a stamp for the postcard', () => { life.promptAt(cat.position); life.interact(); }, 50],
        ['A star! The postcard is in her mouth', () => { window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Digit2' })); }, 24],
        ['Carry it to the rocket', () => { to([[cat.position.x, cat.position.z], [-6, 33], [20, 16], [P.ROCKET_SLOT.x - 1.2, P.ROCKET_SLOT.z + 1.2]]); }, 0],
        ['Post it in the rocket', () => { life.promptAt(cat.position); life.interact(); }, 40],
        ['To the big red button', () => { to([[cat.position.x, cat.position.z], [D.x - 1.4, D.z]]); }, 0],
        ['Press the button', () => { cat.rotation.y = facingYaw(1, 0); life.promptAt(cat.position); life.interact(); }, 4],
        ['Five... four... three... two... one...', () => { moundCam(); }, 150],
        ['Lift-off!', () => {}, 100],
        ['The rocket climbs', () => { moundCam([P.PAD.x, 30, P.PAD.z], undefined, 62); }, 150],
        ['Out of sight: a fading dot', () => { moundCam([P.PAD.x - 6, 140, P.PAD.z - 30], undefined, 64); }, 190],
        ['Climb Earthrise Rock and wait', () => { const r = P.ROCK_LEDGES[2]; cat.position.set(r.x, ground.y(r.x, r.z) + r.y, r.z); session.perched = { x: r.x, z: r.z, y: r.y, pose: 'perch' }; player.perchY = r.y; settle(2); const p = cat.position; setCam([p.x + 1.0, p.y + 2.6, p.z + 5.5], [p.x + 4, p.y + 26, p.z - 80], 66); }, 120],
        ['Earth says hello back, with her stamp', () => { earthCam(); }, 720],
      ];
      return () => {
        if (phase === 0 && seg.length) {
          const [x, z, yaw] = seg[k++];
          cat.rotation.y = angTo(cat.rotation.y, yaw, 0.2);
          cat.position.set(x, ground.y(x, z), z);
          frame(DT); lock = null; follow(); capEl.textContent = BARE ? '' : cap; render();
          if (k >= seg.length) { phase = 1; seg.length = 0; }
          return { done: false, caption: cap };
        }
        if (si < 0 || sh <= 0) { si++; if (si >= script.length) return { done: true, caption: cap }; cap = script[si][0]; script[si][1](); sh = script[si][2]; if (phase === 0 && seg.length) return { done: false, caption: cap }; }
        sh--; settle(1);
        capEl.textContent = BARE ? '' : cap; render();
        return { done: false, caption: cap };
      };
    },
  };
  window.__tour = (name) => { if (!TOURS[name]) throw new Error(`no tour "${name}"; there are ${Object.keys(TOURS).join(', ')}`); resize(W0, H0); tour = TOURS[name](); return name; };
  let tour = null;
  window.__frame = () => tour ? tour() : { done: true };
  // for tests of the page by hand
  window.__makeLife = (n) => { lock = null; return makeLife(n); };
  window.__d = { P, player, session, cat, get life() { return life; }, frame, ground, area, progression, paws, mice, scene, camera, renderer };

  reset(0, 45, 0, -1);
  render();
  window.__ready = true;
</script>
