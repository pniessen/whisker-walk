<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Stone harness</title>
<!-- Series switch A3 (dev only, like the other verify-*.html: the build reads
     index.html alone). One camp built twice, side by side: left with the
     family's words (the Highrock), right with the everyday words (the High
     Stone), each with its camp cats seated, the leader on the rock. The
     everyday set is put in use for the right-hand build the way
     test/helpers/offwords.js does it, and taken out again.
     URL: ?place=woods (default) or ?place=gorge.
     For scripts/record-page.mjs: window.__shot(name), name one of
     highstone-<place>-camera (the game's own camera, behind a cat standing
     in the camp) and highstone-<place>-catheight (a cat's eye, 0.3 m up). -->
<style>
  html, body { margin: 0; background: #1c2431; color: #f1e0c2; font: 14px/1.3 Avenir, Nunito, 'Trebuchet MS', sans-serif; }
  .panes { display: flex; gap: 8px; padding: 8px; }
  .pane { flex: 0 0 auto; }
  .pane h1 { font-size: 15px; margin: 0 0 6px; font-weight: 700; }
  .pane h1 span { color: #a8b4c8; font-weight: 400; }
  canvas { display: block; border-radius: 6px; }
</style>
</head>
<body>
<div class="panes">
  <div class="pane"><h1>Family's words <span>· the Highrock</span></h1><div id="on"></div></div>
  <div class="pane"><h1>Everyday words <span>· the High Stone</span></h1><div id="off"></div></div>
</div>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier, setTextureAnisotropy } from '/src/render/textures.js';
  import { createWind } from '/src/render/wind.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { cameraOffset } from '/src/catcam.js';
  import { ZOOM_STEPS, DEFAULT_ZOOM_STEP } from '/src/camzoom.js';
  import { DEFAULT_PITCH } from '/src/player.js';
  import { buildCat, CAT_LOOK_Y } from '/src/cat/model.js';
  import { createClanCats } from '/src/clancats.js';
  import { castFor } from '/src/clancast.js';
  import { campLayout, campDressing } from '/src/world/camp.js';
  import { addWordSet, removeWordSet, setSeriesMode, SERIES_ON } from '/src/wordset.js';
  import * as offWords from '/src/offclanwords.js';
  import * as woods from '/src/world/woods.js';
  import * as gorge from '/src/world/gorge.js';

  const place = new URLSearchParams(location.search).get('place') === 'gorge' ? 'gorge' : 'woods';
  const world = place === 'gorge' ? gorge : woods;
  const W = 636, H = 500;
  const tier = { name: 'high', envIntensity: 0.45 };
  setTextureTier(tier);

  // The rock's frame: its spot, `away` (towards its back) and the steps' side,
  // as world/camp.js works them out.
  const L = campLayout(place);
  const away = place === 'gorge' ? 0 : Math.atan2(L.rock.z - L.cz, L.rock.x - L.cx);
  const K = campDressing(place).kill;
  const bx = Math.cos(away), bz = Math.sin(away);
  const side = (-bz * (K.x - L.rock.x) + bx * (K.z - L.rock.z)) > 0 ? -1 : 1;
  // the view's direction from the rock: between its front and the steps
  const view = away + side * 2.3;
  const ux = Math.cos(view), uz = Math.sin(view);

  function pane(id, everyday) {
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    setTextureAnisotropy(Math.min(4, renderer.capabilities.getMaxAnisotropy()));
    document.getElementById(id).appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.environment = buildEnvMap(renderer);
    scene.environmentIntensity = tier.envIntensity;
    const sun = createSun();
    scene.add(sun);
    const wind = createWind({ reducedMotion: true });
    if (everyday) {
      addWordSet(offWords.OFF_ID, offWords);
      setSeriesMode(offWords.OFF_ID);
    }
    let area, clan;
    try {
      area = world.build(scene, { water: { quality: tier, reducedMotion: true }, wind });
      scene.add(createFill(area.groundBounce));
      // the camp's own cats on their seats, the leader on the rock
      clan = createClanCats(scene, area, castFor(place), {
        campLayout: campLayout(place), roamHomes: [], roomSeed: 12345, showNames: false,
        reducedMotion: true, areaId: place, ground: area.ground ?? null,
      });
    } finally {
      if (everyday) {
        setSeriesMode(SERIES_ON);
        removeWordSet(offWords.OFF_ID);
      }
    }
    // a cat of hers, standing in the camp looking at the rock
    const ground = area.ground && !area.ground.flat ? area.ground : null;
    const gy = (x, z) => (ground ? ground.y(x, z) : 0);
    const cat = buildCat('tabby');
    const px = L.rock.x + ux * 3.2, pz = L.rock.z + uz * 3.2;
    cat.position.set(px, gy(px, pz), pz);
    cat.rotation.y = Math.atan2(ux, uz) + Math.PI;
    scene.add(cat);
    const far = new THREE.Vector3(L.rock.x + 40, 0, L.rock.z + 40);
    for (let i = 0; i < 90; i++) clan.update(1 / 60, i / 60, far);
    const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
    const shadows = createShadowFit(sun, camera, { radius: 20, mapSize: 2048 });
    sun.shadow.bias = SUN_BIAS;
    assignShadowCasters(scene);
    const render = () => { shadows.update(); renderer.render(scene, camera); };
    return { scene, camera, render, cat, gy, clan, area };
  }

  const panes = [pane('on', false), pane('off', true)];

  const rockY = (p) => p.gy(L.rock.x, L.rock.z);
  const VIEWS = {
    // the game's camera at its default step, behind her cat
    camera(p) {
      const z = ZOOM_STEPS[DEFAULT_ZOOM_STEP];
      const yaw = Math.atan2(ux, uz);
      const off = cameraOffset(yaw, DEFAULT_PITCH, z.dist, z.height);
      p.camera.position.copy(p.cat.position).add(off);
      p.camera.lookAt(p.cat.position.x, p.cat.position.y + CAT_LOOK_Y, p.cat.position.z);
    },
    // a cat's eye: 0.3 m up, 2.4 m from the rock, looking up at it
    catheight(p) {
      p.cat.visible = false;
      const x = L.rock.x + ux * 2.4, z = L.rock.z + uz * 2.4;
      p.camera.position.set(x, p.gy(x, z) + 0.3, z);
      p.camera.lookAt(L.rock.x, rockY(p) + 0.65, L.rock.z);
    },
  };
  window.__shot = (name) => {
    const m = /^highstone-(woods|gorge)-(camera|catheight)$/.exec(name);
    if (!m || m[1] !== place) return `no shot ${name} on ?place=${place}`;
    for (const p of panes) {
      p.cat.visible = true;
      VIEWS[m[2]](p);
      p.render();
    }
    return name;
  };
  window.__panes = panes;
  window.__shot(`highstone-${place}-camera`);
  window.__ready = true;
</script>
</body>
</html>
