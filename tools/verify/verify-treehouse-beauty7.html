<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treehouse beauty picture page, pass 7</title>
<!-- The Treehouse village, picture page for beauty pass 7 (2026-11-28): the REAL build and life at the PLAY camera (behind the cat, 7 m back and 3.8 m up, the walk's own zoom step 2). NOT in the game's page.
     Five vistas, shots v1..v5 (a moment after arriving) and g1..g5 (after standing still 4.6 s: the golden moment): 1 the Bakery deck looking up the big oak, 2 the high bridge with flags and kite, 3 the Bakery deck at golden hour,
     4 the stairs to the Crown mid-way, 5 the Bell Tower base. URL params: size=WxH (default 960x540), tier=high|low|lite, still=1 (reduced motion). Contact sheet treehouse-beauty7-pics/contact-pass7-before-after.png (one row per vista;
     columns: before arrival, after arrival, before golden moment, after golden moment). window.__shot(name) with scripts/record-page.mjs. -->
<style>html,body{margin:0;background:#2a1a30;overflow:hidden}canvas{position:fixed;left:0;top:0;display:block}</style>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier } from '/src/render/textures.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { buildCat } from '/src/cat/model.js';
  import { animateCat } from '/src/cat/animator.js';
  import { facingYaw } from '/src/traversal.js';
  import { applyDusk, duskEnv, tintDuskLawn } from '/src/render/dusk.js';
  import { effectiveWear } from '/src/suithook.js';
  import { mergeStaticProps } from '/src/render/mergeprops.js';
  import { build } from '/src/world/treehouse.js';
  import { ST, loadTreehouseStages } from '/src/world/treehousestages.js';
  import * as K from '/src/world/treehouseparts.js';
  import { drawBeauty } from '/src/world/treehousebeauty.js';
  import { createProgression } from '/src/progression.js';
  import { createDiscoveryLog } from '/src/discoveries.js';
  import { createFx } from '/src/fx.js';

  const params = new URLSearchParams(location.search);
  const [W0, H0] = (params.get('size') || '960x540').split('x').map(Number);
  const TIER = params.get('tier') || 'high';
  const DT = 1 / 30;
  const STILL = params.get('still') === '1'; const SEASON = params.get('season') || null; const SURPRISE = params.get('surprise') || null; const ADV = Number(params.get('adv') || 0); const DUSKY = params.get('dusk') === '1';
  const tier = TIER === 'lite' ? { name: 'low', rung: 5, shadows: false, envIntensity: 0.3 } : TIER === 'low' ? { name: 'low', rung: 3, shadows: true, envIntensity: 0.3 } : { name: 'high', shadows: true, envIntensity: 0.3 };
  let W = W0, H = H0;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H); renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = tier.shadows; renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
  document.body.prepend(renderer.domElement);
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  const sun = createSun(); scene.add(sun);
  const fill = createFill(0x8d8c93); scene.add(fill);
  await loadTreehouseStages();
  if (params.get('old') === '1') ST.lift = Object.freeze({ draw: (kit, M) => { K.drawFerns(kit, M); K.drawRim(kit, M); K.drawCanopy(kit, M); drawBeauty(kit, M); } });
  const area = build(scene);
  const look = applyDusk({ scene, sun, fill, areaData: area });
  tintDuskLawn({ ground: scene.children.filter((c) => c.isMesh && (c.userData.ground || c.userData.duskTint)), grass: null, look });
  scene.environmentIntensity = duskEnv(scene.environmentIntensity, look);
  const ground = area.ground;
  const wear = effectiveWear({ collar: null, head: null, face: null, neck: null, body: null, back: null, feet: null }, 'treehouse');
  const cat = buildCat('tabby', wear); scene.add(cat);
  const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
  const shadows = tier.shadows ? createShadowFit(sun, camera, { radius: 20, mapSize: tier.rung >= 3 ? 1024 : 2048 }) : null;
  sun.shadow.bias = SUN_BIAS; sun.castShadow = tier.shadows;
  assignShadowCasters(scene);
  mergeStaticProps(scene);
  const fx = createFx(scene, { reducedMotion: STILL });
  const store = new Map();
  const STEP = Number(params.get('step') ?? 2);
  const progression = createProgression({ getItem: (k) => store.get(k) ?? null, setItem: (k, v) => store.set(k, String(v)), removeItem: (k) => store.delete(k) });
  const log = createDiscoveryLog(progression); log.startWalk();
  const player = { floatY: 0 };
  const lctx = { roomSeed: 7, sendEvent: () => {}, scene, sun, fill, ground, reducedMotion: STILL, tier, progression, log, audio: null, doc: document, win: window, clock: () => 250, visits: 3, player, season: SEASON, surprise: SURPRISE, surpriseAt: 1, dusk: DUSKY, now: new Date(2026, 10, 28), weather: { condition: 'clear' }, hour: 12.5 }; const life = area.life(lctx);
  let t = 0;
  const lookAt = (pos, tgt, fov = 70) => { camera.fov = fov; camera.updateProjectionMatrix(); camera.position.set(...pos); camera.lookAt(...tgt); };
  let lock = null;
  function frame() {
    t += DT;
    if (lock) lookAt(...lock);
    life.update(DT, t, cat.position, camera, { hopLift: 0 });
    fx.update(DT, camera);
    animateCat(cat, 'idle', t, 0, false);
    if (shadows) shadows.update(0, DT);
    renderer.render(scene, camera);
  }
  const settle = (n) => { for (let i = 0; i < n; i++) frame(); };
  const advance = (sec) => { for (let i = 0; i < sec * 30; i++) { t += DT; if (lock) lookAt(...lock); life.update(DT, t, cat.position, camera, { hopLift: 0 }); } };
  let advanced = false;
  const put = (x, z, fx_, fz_, lift = 0) => { cat.position.set(x, ground.y(x, z) + lift, z); cat.rotation.set(0, facingYaw(fx_, fz_), 0); };
  const cam = (pos, tgt, fov = 70, size = null) => { if (size) { W = size[0]; H = size[1]; } else { W = W0; H = H0; } renderer.setSize(W, H); camera.aspect = W / H; lock = [pos, tgt, fov]; };
  // [cat x, z, facing dx, dz, hour]
  const V = { 1: [-5.0, 8.1, 0.34, -0.94, 12.5], 2: [4.4, -8.6, -0.55, -0.85, 14.2], 3: [-8.6, 12.4, 0.8, -0.6, 17.6], 4: [2.5, -10.8, -0.58, -0.82, 11.6], 5: [-0.6, -14.0, 0.1, -1, 15.8] };
  window.__shot = (name) => {
    const m = /^([vg])([1-5])$/.exec(name); if (!m) throw new Error('no shot ' + name);
    const [x, z, dx, dz, hour] = V[m[2]];
    if (lctx.hour !== hour) { lctx.hour = hour; lock = null; put(0, 25, 0, -1, 0); advance(5.5); } // the day's hour is read every 5 s: let it take, away from the spot
    const n = Math.hypot(dx, dz); const ux = dx / n; const uz = dz / n; const gy = ground.y(x, z);
    put(x, z, dx, dz, 0);
    cam([x - ux * 7, gy + 3.8, z - uz * 7], [x + ux * 2, gy + 0.8, z + uz * 2], 62);
    settle(m[1] === 'v' ? 20 : 4);
    if (m[1] === 'g') { for (let i = 0; i < 140; i++) frame(); } // 4.6 s standing still, rendered (the golden moment)
    return name;
  };
  window.__stats = () => ({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles });
  window.__ready = true;
</script>
</body>
</html>
