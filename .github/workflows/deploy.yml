name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No workflow-level concurrency: that would cancel the deploy job mid-upload.
# Instead each pre-deploy job (gate, test shard, build) cancels its own older
# run on the same ref, with a distinct group per job so jobs of one run never
# queue behind each other (and each shard has its own group). Only `deploy`
# uses the `pages` group, and it is never cancelled (GitHub's advice for Pages).
# The stale checks stay as a second line of defence.

jobs:
  # A newer push cancels this run, but a shard already running still bills until
  # it notices. This one-second job asks GitHub what main is now; if it is not
  # this commit, the run is stale and every job below is skipped. It fails open:
  # if the lookup fails, or this is a manual run of another branch, the run goes
  # ahead as before. The newest commit always passes, so it is always tested and
  # deployed in full. A stale run can never reach deploy (build needs test).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: ci-gate-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=true
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            head=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1) || head=""
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then current=false; echo "stale: main is $head"; fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

  # The whole suite, split over four machines that run side by side. One
  # machine took about 12 minutes; a quarter each takes about a quarter of
  # that. `--shard` is vitest's own split, so the four parts together are
  # exactly `npm test`. If any part fails, nothing is built or deployed.
  test:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Stale check (fails open)
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            head=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1) || head=""
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then stale=true; echo "stale: main is $head"; fi
          fi
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
      - if: steps.stale.outputs.stale != 'true'
        uses: actions/checkout@v4
      - if: steps.stale.outputs.stale != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - if: steps.stale.outputs.stale != 'true'
        run: npm ci
      - if: steps.stale.outputs.stale != 'true'
        run: npx vitest run --shard=${{ matrix.shard }}/4

  build:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: ci-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      stale: ${{ steps.stale.outputs.stale }}
    steps:
      - name: Stale check (fails open)
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            head=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1) || head=""
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then stale=true; echo "stale: main is $head"; fi
          fi
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
      - if: steps.stale.outputs.stale != 'true'
        uses: actions/checkout@v4
      - if: steps.stale.outputs.stale != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - if: steps.stale.outputs.stale != 'true'
        run: npm ci
      # The family's word set is sealed in src/seriesvault.js: refuse a vault no code opens or one that is
      # older than the words it holds (needs no secret; scripts/series.mjs).
      - if: steps.stale.outputs.stale != 'true'
        name: Check the family word set is sealed and current
        run: node scripts/series.mjs verify
      - if: steps.stale.outputs.stale != 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # The private family edition must never reach the public site: stop the deploy if any
      # built file carries its marker (test/privateedition.test.js checks the same in a test).
      - if: steps.stale.outputs.stale != 'true'
        name: Refuse a bundle that holds the private edition
        run: if grep -rl "ww-private-family" dist; then echo "private edition token in the public build" && exit 1; fi
      - if: steps.stale.outputs.stale != 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.stale.outputs.stale != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.stale != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Fetch the live site and fail the run if it is broken or is not this commit.
  # Plain node (no npm ci): scripts/smoke.mjs uses only built-ins and GETs.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Smoke check the live site
        run: node scripts/smoke.mjs "${{ needs.deploy.outputs.page_url }}" --commit "$GITHUB_SHA" --retry-seconds 180
