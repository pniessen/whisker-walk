<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon milestone 1 picture page</title>
<!-- The Moon, milestone 1 (the ground, the sky, Earth, the landing site): the REAL place (src/world/moon.js, built as the walk builds it), the
     real walk's own pieces driven the way src/main.js drives them each frame (player.update, then the area's life: the sky dress, the camera's
     ease, the skip, the landing dust, then the cat's drawn height), the real suit (effectiveWear for the Moon), the Moon's own hop arc
     (placeArc, as game/interactions.js presses it) and the evening look (render/dusk.js). NOT in the game's page: nothing reaches it from the app.
     scripts/record-page.mjs makes the pictures: __shot(name), __snap().
     URL params: size=WxH (default 960x540), bare (no HUD), tier=high|low|lite (the quality tier the walk would build at), rm=1 (reduced motion).
     Shots: landing (the spawn, the default view), earthrise (the same, the view dragged up: Earth over the ridge), field (the crater field's edge, Echo Crater and the Twin Bowls),
            hop (a suited cat in the air over Echo Crater, Earth ahead), land (the frame the paws touch: the dust), phone (a close walk view,
            390 wide), tv (the same landing view at TV size), ridge (the Earthrise Ridge and the hills at the edge), side (a fixed side view of the hop). -->
<style>
  html, body { margin: 0; background: #05070f; overflow: hidden; font: 12px/1.35 Avenir, system-ui, sans-serif; color: #e8ecf8; }
  canvas { position: fixed; left: 0; top: 0; display: block; }
  #hud { position: fixed; left: 0; top: 0; padding: 6px 10px; background: rgba(8, 10, 18, .72); white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<script type="module">
  import * as THREE from 'three';
  import { buildEnvMap } from '/src/render/materials.js';
  import { setTextureTier } from '/src/render/textures.js';
  import { createSun, createFill, SUN_BIAS, assignShadowCasters } from '/src/render/rig.js';
  import { createShadowFit } from '/src/render/shadowfit.js';
  import { buildCat } from '/src/cat/model.js';
  import { animateCat } from '/src/cat/animator.js';
  import { createPlayer, pounceArc } from '/src/player.js';
  import { createFx } from '/src/fx.js';
  import { facingYaw, behindYaw } from '/src/traversal.js';
  import { applyDusk, duskEnv, tintDuskLawn } from '/src/render/dusk.js';
  import { effectiveWear } from '/src/suithook.js';
  import { placeArc, placePace } from '/src/placephysics.js';
  import { mergeStaticProps } from '/src/render/mergeprops.js';
  import { build } from '/src/world/moon.js';

  const params = new URLSearchParams(location.search);
  const rm = params.get('rm') === '1';
  const [W0, H0] = (params.get('size') || '960x540').split('x').map(Number);
  const BARE = params.has('bare');
  const TIER = params.get('tier') || 'high';
  const DT = 1 / 30;
  const tier = TIER === 'lite' ? { name: 'low', rung: 5, shadows: false, envIntensity: 0.3 } : TIER === 'low' ? { name: 'low', rung: 3, shadows: true, envIntensity: 0.3 } : { name: 'high', shadows: true, envIntensity: 0.3 };

  let W = W0, H = H0;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = tier.shadows;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  document.body.prepend(renderer.domElement);
  setTextureTier(tier);
  const scene = new THREE.Scene();
  scene.environment = buildEnvMap(renderer);
  scene.environmentIntensity = tier.envIntensity;
  const sun = createSun();
  scene.add(sun);
  const fill = createFill(0x8d8c93);
  scene.add(fill);
  const area = build(scene, { water: { quality: tier, reducedMotion: rm } });
  const look = applyDusk({ scene, sun, fill, areaData: area });
  tintDuskLawn({ ground: scene.children.filter((c) => c.isMesh && (c.userData.ground || c.userData.duskTint)), grass: null, look });
  scene.environmentIntensity = duskEnv(scene.environmentIntensity, look);
  const ground = area.ground;

  // the cat, drawn as the walk draws her on the Moon (the one call game/walk.js makes)
  const wear = effectiveWear({ collar: null, head: null, face: null, neck: null, body: null, back: null, feet: null }, 'moon');
  const cat = buildCat('tabby', wear);
  scene.add(cat);
  const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
  const shadows = tier.shadows ? createShadowFit(sun, camera, { radius: 20, mapSize: tier.rung >= 3 ? 1024 : 2048 }) : null;
  sun.shadow.bias = SUN_BIAS;
  sun.castShadow = tier.shadows;
  assignShadowCasters(scene);
  mergeStaticProps(scene);

  const fx = createFx(scene, { reducedMotion: rm });
  const state = { skills: [] };
  const session = { pounceTime: 0, perched: null, hopLift: 0, fx };
  const life = area.life({ scene, sun, fill, ground, reducedMotion: rm, tier, progression: { state }, audio: null });
  const player = createPlayer(camera, renderer.domElement);
  player.setReducedMotion(rm);
  let t = 0;
  function reset(x, z, fx_, fz_) {
    cat.position.set(x, ground.y(x, z), z);
    cat.rotation.set(0, facingYaw(fx_, fz_), 0);
    player.setAvatar(cat, placePace(3.5, 'moon'));
    player.setGround(ground);
    player.setViewYaw(behindYaw(fx_, fz_));
    player.enable();
    player.update(0, area.colliders, area.bounds, area.waters);
    session.pounceTime = 0; session.hopLift = 0;
    life.update(0, t, cat.position, camera, session);
    if (shadows) shadows.update(0, 1e3);
  }
  const stick = (x, z) => player.setTouchMove(x === 0 && z === 0 ? null : { x, z, mag: 1 });
  const hud = document.getElementById('hud');
  if (BARE) hud.remove();
  // one frame, in the order src/main.js runs it: player, the area's life (it moves the camera and sets the skip), the avatar's drawn height
  function frame(dt) {
    t += dt;
    player.update(dt, area.colliders, area.bounds, area.waters);
    player.speedFactor = 1;
    life.update(dt, t, cat.position, camera, session);
    fx.update(dt, camera);
    if (session.pounceTime > 0) session.pounceTime -= dt;
    animateCat(cat, player.hopY > 0 ? 'pounce' : 'follow', t, player.speed, rm);
    cat.rotation.x = 0; cat.rotation.z = 0;
    cat.position.y = ground.y(cat.position.x, cat.position.z) + player.hopY + session.hopLift;
    if (shadows) shadows.update(0, dt);
    render();
  }
  function render() {
    renderer.render(scene, camera);
    if (BARE) return;
    const p = cat.position;
    hud.textContent = [`moon · tier ${TIER} · at ${p.x.toFixed(1)}, ${p.z.toFixed(1)} · hop ${player.hopY.toFixed(2)} m`, `draws ${renderer.info.render.calls} · tris ${renderer.info.render.triangles}`].join('\n');
  }
  const press = () => { const arc = placeArc(pounceArc(state, { reducedMotion: rm }), 'moon'); player.pounce(arc); session.pounceTime = arc.time; };
  const resize = (w, h) => { W = w; H = h; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  const SHOTS = {
    landing: { at: [0, 45], face: [0, -1] },
    earthrise: { at: [0, 45], face: [0, -1], up: 1 },
    field: { at: [16, 24], face: [0, -1], yaw: 0.5 },
    hop: { at: [16, 22], face: [0, -1], stick: [0, -1], hop: 0.54, up: 0.6 },
    land: { at: [16, 22], face: [0, -1], stick: [0, -1], hop: 1.08 },
    phone: { at: [4, 44], face: [0, -1], size: [390, 760], up: 0.8 },
    tv: { at: [0, 45], face: [0, -1], size: [1920, 1080], up: 1 },
    ridge: { at: [-2, -30], face: [0, -1] },
    top: { at: [0, 45], face: [0, -1], cam: { pos: [0, 150, 18], look: [0, 0, 0], fov: 70 } },
    side: { at: [16, 22], face: [0, -1], hop: 0.54, cam: { pos: [26, 2.6, 15.6], look: [16, 0.4, 15.6], fov: 55 } },
  };
  window.__shot = (name) => {
    const s = SHOTS[name];
    if (!s) throw new Error(`no shot "${name}"; there are ${Object.keys(SHOTS).join(', ')}`);
    resize(...(s.size ?? [W0, H0]));
    reset(s.at[0], s.at[1], s.face[0], s.face[1]);
    if (s.yaw) player.setViewYaw(behindYaw(s.face[0], s.face[1]) + s.yaw);
    if (s.up) player.addOrbit(0, -108 * s.up); // she drags the view up (the walk's look-up): Earth is 21 degrees up
    if (s.stick) stick(...s.stick);
    for (let k = 0; k < 20; k++) frame(DT);
    if (s.hop !== undefined) {
      press();
      for (let k = 0; k < Math.round(s.hop / DT); k++) frame(DT);
    }
    stick(0, 0);
    if (s.cam) { camera.fov = s.cam.fov ?? 70; camera.updateProjectionMatrix(); camera.position.set(...s.cam.pos); camera.lookAt(...s.cam.look); life.sky.update(camera, t); }
    render();
    return name;
  };
  window.__snap = (q = 0.85) => { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/jpeg', q); };
  window.__stats = () => { const i = renderer.info; return { calls: i.render.calls, triangles: i.render.triangles }; };
  reset(0, 45, 0, -1);
  render();
  window.__ready = true;
</script>
</body>
</html>
